    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "看圖・花的構造", "q": "看上面的圖，頂端有花粉的構造是哪一個代號？", "o": ["甲", "乙", "丙", "丁"], "a": 1, "why": "雄蕊頂端有花粉，圖中的乙是雄蕊。", "img": "<svg viewBox=\"0 0 340 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"340\" height=\"300\" rx=\"14\" fill=\"#FFF6FB\"/><path d=\"M170 290 L170 190\" stroke=\"#4F9A4A\" stroke-width=\"8\" stroke-linecap=\"round\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(-60 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(-20 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(20 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(60 170 175) translate(0 0)\"/><path d=\"M170 180 Q152.0 140 140 92\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"140\" cy=\"88\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q161.0 140 155 82\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"155\" cy=\"78\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q179.0 140 185 82\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"185\" cy=\"78\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q188.0 140 200 92\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"200\" cy=\"88\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 182 L170 70\" stroke=\"#6BBF6A\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"170\" cy=\"66\" r=\"9\" fill=\"#9BD49A\" stroke=\"#3B3355\" stroke-width=\"2\"/><path d=\"M170 178 Q130 182 112 206 Q140 204 170 196Z\" fill=\"#5FB25C\" stroke=\"#3B3355\" stroke-width=\"2\"/><path d=\"M170 178 Q210 182 228 206 Q200 204 170 196Z\" fill=\"#5FB25C\" stroke=\"#3B3355\" stroke-width=\"2\"/><ellipse cx=\"170\" cy=\"188\" rx=\"16\" ry=\"12\" fill=\"#5FB25C\" stroke=\"#3B3355\" stroke-width=\"2\"/><line x1=\"232\" y1=\"128\" x2=\"300\" y2=\"110\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"300\" cy=\"110\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"300\" y=\"117\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">甲</text><line x1=\"200\" y1=\"90\" x2=\"292\" y2=\"40\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"292\" cy=\"40\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"292\" y=\"47\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">乙</text><line x1=\"170\" y1=\"66\" x2=\"60\" y2=\"36\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"60\" cy=\"36\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"60\" y=\"43\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">丙</text><line x1=\"122\" y1=\"198\" x2=\"52\" y2=\"236\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"52\" cy=\"236\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"52\" y=\"243\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">丁</text></svg>", "keep": true},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "看圖・花的構造", "q": "看上面的圖，授粉成功後會發育成果實的是哪一個代號？", "o": ["甲", "乙", "丙", "丁"], "a": 2, "why": "授粉成功後，雌蕊會發育成果實。圖中的丙是雌蕊。", "trap": {"1": "乙是雄蕊，負責產生花粉；會發育成果實的是雌蕊。"}, "img": "<svg viewBox=\"0 0 340 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"340\" height=\"300\" rx=\"14\" fill=\"#FFF6FB\"/><path d=\"M170 290 L170 190\" stroke=\"#4F9A4A\" stroke-width=\"8\" stroke-linecap=\"round\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(-60 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(-20 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(20 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(60 170 175) translate(0 0)\"/><path d=\"M170 180 Q152.0 140 140 92\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"140\" cy=\"88\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q161.0 140 155 82\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"155\" cy=\"78\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q179.0 140 185 82\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"185\" cy=\"78\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q188.0 140 200 92\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"200\" cy=\"88\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 182 L170 70\" stroke=\"#6BBF6A\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"170\" cy=\"66\" r=\"9\" fill=\"#9BD49A\" stroke=\"#3B3355\" stroke-width=\"2\"/><path d=\"M170 178 Q130 182 112 206 Q140 204 170 196Z\" fill=\"#5FB25C\" stroke=\"#3B3355\" stroke-width=\"2\"/><path d=\"M170 178 Q210 182 228 206 Q200 204 170 196Z\" fill=\"#5FB25C\" stroke=\"#3B3355\" stroke-width=\"2\"/><ellipse cx=\"170\" cy=\"188\" rx=\"16\" ry=\"12\" fill=\"#5FB25C\" stroke=\"#3B3355\" stroke-width=\"2\"/><line x1=\"232\" y1=\"128\" x2=\"300\" y2=\"110\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"300\" cy=\"110\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"300\" y=\"117\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">甲</text><line x1=\"200\" y1=\"90\" x2=\"292\" y2=\"40\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"292\" cy=\"40\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"292\" y=\"47\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">乙</text><line x1=\"170\" y1=\"66\" x2=\"60\" y2=\"36\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"60\" cy=\"36\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"60\" y=\"43\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">丙</text><line x1=\"122\" y1=\"198\" x2=\"52\" y2=\"236\" stroke=\"#3B3355\" stroke-width=\"1.8\"/><circle cx=\"52\" cy=\"236\" r=\"17\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"52\" y=\"243\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">丁</text></svg>", "keep": true},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "月橘的花有香氣，可以吸引動物來幫忙傳播花粉。", "a": 0}, {"s": "夏天在公園，可以看到櫻花和荷花一起盛開。", "a": 1, "why": "櫻花在春季開，荷花在夏季開，它們不會一起盛開。"}, {"s": "只要是花，就一定有花萼、花瓣、雄蕊和雌蕊。", "a": 1, "why": "「一定」是陷阱！不完全花會少一個部分，像絲瓜的雄花、雌花。"}, {"s": "果實可以保護種子，也能幫助種子傳播。", "a": 0}], "why": "看到「一定、只要、都」這種說得很絕對的字，要特別小心，常常是陷阱。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "臺灣欒樹的果實很輕、像氣球，靠風力傳播種子。", "a": 0}, {"s": "龍眼的果實裡面有許多黑色的種子。", "a": 1, "why": "龍眼只有 1 顆種子，有許多黑色種子的是木瓜。"}, {"s": "授粉成功以後，雄蕊會發育成果實。", "a": 1, "why": "會發育成果實的是雌蕊，不是雄蕊。"}, {"s": "植物可以當作動物的食物，也能讓動物在上面居住、棲息。", "a": 0}], "why": "記清楚：雌蕊→果實→裡面有種子；龍眼 1 顆、臺灣欒樹通常 6 顆、木瓜許多顆。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "選出正確的", "q": "關於植物的花，下面哪一個說法是「正確」的？", "o": ["花瓣通常顏色鮮豔，可以吸引動物", "花萼長在花的最中央", "每一朵花都有濃濃的香味", "雄蕊會發育成果實"], "a": 0, "why": "花瓣鮮豔可以吸引動物；花萼在花的最下面；不是每朵花都有香味；會發育成果實的是雌蕊。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "推理", "q": "絲瓜的雌花和雄花，從外形要怎麼分辨？", "o": ["雌花的花瓣下面，有一段膨大、像小絲瓜的構造", "雄花比較大朵", "雌花沒有花瓣", "雄花是白色的"], "a": 0, "why": "絲瓜雌花的花瓣下方有膨大像小絲瓜的構造，以後會長成絲瓜；雄花下面沒有。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "推理", "q": "番石榴的花謝了以後，雌蕊慢慢長成綠色的未成熟果實，再變成成熟果實。把成熟的番石榴切開，會看到什麼？", "o": ["許多種子", "雄蕊", "花萼", "什麼都沒有"], "a": 0, "why": "果實是雌蕊發育來的，果實裡有種子。番石榴切開可以看到中間密密麻麻的種子。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "推理", "q": "臺灣欒樹的果實很輕，外形像氣球。這樣的特徵對它有什麼幫助？", "o": ["可以隨著風把種子傳播出去", "可以吸引動物來吃", "可以在水裡漂流", "可以散發特殊氣味"], "a": 0, "why": "果實很輕、像氣球的，靠風力傳播。香甜好吃的果實（龍眼、木瓜）才是靠動物。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "選出不是的", "q": "下面哪一個「不是」果實的功能？", "o": ["吸收土壤中的水分", "保護種子", "幫助種子傳播"], "a": 0, "why": "果實的主要功能是保護種子和幫助種子傳播。吸收水分是根的工作。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "陷阱：判斷對錯", "q": "小明說：「絲瓜有雄花也有雌花，所以絲瓜的花是完全花。」他說得對嗎？", "o": ["不對，雄花只有雄蕊、雌花只有雌蕊，都少了一部分，是不完全花", "對，有雄花也有雌花就是完全花", "不對，絲瓜不會開花", "不對，絲瓜的花沒有花瓣"], "a": 0, "why": "完全花是「一朵花」裡四個部分都有。絲瓜的每一朵花都少了雄蕊或雌蕊，所以是不完全花。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "推理", "q": "從春天到冬天，依照開花季節排列，下面哪一組是正確的？", "o": ["杜鵑→金針花→臺灣欒樹→梅花", "梅花→荷花→杜鵑→臺灣欒樹", "荷花→櫻花→梅花→臺灣欒樹", "臺灣欒樹→梅花→櫻花→荷花"], "a": 0, "why": "春：櫻花、杜鵑；夏：荷花、金針花；秋：臺灣欒樹；冬：梅花。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "配合題・植物與生活", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 食", "乙 住", "丙 育、樂"], "parts": [{"s": "稻子煮成米飯", "a": 0}, {"s": "用木頭搭的木屋", "a": 1}, {"s": "陽明山的花鐘", "a": 2}, {"s": "萵苣做成沙拉", "a": 0}, {"s": "木製的桌椅", "a": 1}, {"s": "到植物園上自然課", "a": 2}], "why": "食：可以吃的（稻子、柳橙、萵苣）；住：用莖做成房子、家具；育、樂：自然教學、美化環境（植物園、花鐘）。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "素養題組", "q": "要滿足爸爸的願望，應該種哪一種？", "o": ["梅花", "龍眼", "臺灣欒樹", "荷花"], "a": 2, "why": "秋季時，臺灣欒樹金黃色的花十分燦爛。", "ctx": "小禾家要在院子裡種植物，每個人都有願望：<br>爸爸：「我想要<b>秋天</b>能開出金黃色花的樹。」<br>媽媽：「我想要果實香甜可以吃，而且<b>果實裡只有 1 顆種子</b>。」<br>妹妹：「我希望<b>冬天</b>也能看到花開。」<br>候選植物：梅花、龍眼、臺灣欒樹、荷花", "keep": true},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "素養題組", "q": "要滿足媽媽的願望，應該種哪一種？", "o": ["梅花", "龍眼", "臺灣欒樹", "荷花"], "a": 1, "why": "龍眼果肉芳香甜美，果實內只有 1 顆種子。", "ctx": "小禾家要在院子裡種植物，每個人都有願望：<br>爸爸：「我想要<b>秋天</b>能開出金黃色花的樹。」<br>媽媽：「我想要果實香甜可以吃，而且<b>果實裡只有 1 顆種子</b>。」<br>妹妹：「我希望<b>冬天</b>也能看到花開。」<br>候選植物：梅花、龍眼、臺灣欒樹、荷花", "keep": true},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "素養題組", "q": "要滿足妹妹的願望，應該種哪一種？", "o": ["梅花", "龍眼", "臺灣欒樹", "荷花"], "a": 0, "why": "寒冷的冬季，也能看到梅花綻放。荷花是夏天開的。", "ctx": "小禾家要在院子裡種植物，每個人都有願望：<br>爸爸：「我想要<b>秋天</b>能開出金黃色花的樹。」<br>媽媽：「我想要果實香甜可以吃，而且<b>果實裡只有 1 顆種子</b>。」<br>妹妹：「我希望<b>冬天</b>也能看到花開。」<br>候選植物：梅花、龍眼、臺灣欒樹、荷花", "keep": true},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "ext": true, "u": "充電站", "q": "捕蠅草、豬籠草這些食蟲植物會捕捉昆蟲，主要是為了什麼？", "o": ["在貧瘠的土壤中，補充氮和礦物質", "因為它們不能進行光合作用", "為了保護種子", "為了幫忙授粉"], "a": 0, "why": "食蟲植物有綠葉，還是可以行光合作用自己製造養分；捕蟲是為了補充土壤裡缺少的氮和礦物質。", "trap": {"1": "它們有綠色的葉子，仍然可以行光合作用，不是只靠吃蟲。"}},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "充電站", "q": "大樹不容易被風吹倒，主要原因是什麼？", "o": ["樹根向外伸展的範圍，比枝葉更寬廣", "樹葉很多", "樹長得很高", "樹上的花很多"], "a": 0, "why": "樹根向外伸展得比枝葉還寬廣，可以牢牢抓住土壤，所以大樹不容易傾倒。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的現象", "q": "「力」看得見嗎？", "o": ["看不見，但可以察覺到力的現象", "看得見，是紅色的", "只有大人看得見", "用放大鏡就看得見"], "a": 0, "why": "課本說：力是看不見的，但可以察覺到力的現象。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "物體受力後的變化", "q": "物體受力後，可能會發生哪兩種改變？", "o": ["形狀改變、運動狀態改變", "顏色改變、味道改變", "變重、變輕", "變熱、變冷"], "a": 0, "why": "物體受力後，形狀可能改變，運動狀態也可能改變。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "形狀的變化", "q": "用腳踩空的飲料罐，會發生什麼事？", "o": ["罐子變扁，不再受力後也無法恢復", "罐子變扁，放開後馬上恢復", "罐子完全不會改變", "罐子變大"], "a": 0, "why": "用腳踩空的飲料罐，飲料罐會變扁，不再受力後也無法恢復原狀。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "形狀的變化", "q": "用雙手拉長橡皮筋，放手後會怎樣？", "o": ["恢復原來的形狀", "一直保持拉長", "變成膠泥", "變成兩條"], "a": 0, "why": "橡皮筋受力會伸長，不再受力後能恢復原來的形狀。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "形狀的變化", "q": "用雙手壓揉膠泥，放手後會怎樣？", "o": ["維持被壓過的樣子，不能恢復原狀", "自己變回原來的長條", "變成橡皮筋", "變得很硬"], "a": 0, "why": "膠泥受力會改變形狀，放手後維持被壓扁彎曲的樣子，不能恢復原狀。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "形狀的變化", "q": "用手推堅硬的牆壁，用眼睛看，牆壁的形狀會怎樣？", "o": ["看不出改變", "凹進去一個洞", "變扁", "變彎"], "a": 0, "why": "推牆壁時，牆壁的形狀用肉眼看不會改變。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "運動狀態的變化", "q": "用腳踢靜止的球，球會怎樣？", "o": ["由靜止變成往前移動", "變成方形", "還是不動", "變小"], "a": 0, "why": "用腳踢靜止的球，球會由靜止狀態往前移動。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "運動狀態的變化", "q": "用腳擋住正在滾動的球，球會怎樣？", "o": ["變慢或停止", "越滾越快", "變扁不能恢復", "飛到天上"], "a": 0, "why": "用腳擋住正在滾動的球，球會變慢或停止。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的三要素", "q": "「力的三要素」是哪三個？", "o": ["力的大小、方向和作用點", "力的顏色、形狀和重量", "速度、時間和距離", "磁力、彈力和浮力"], "a": 0, "why": "力的大小、方向和作用點，稱為力的三要素。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的三要素", "q": "施力時，碰觸到物體的位置叫做什麼？", "o": ["作用點", "磁極", "節", "箭頭"], "a": 0, "why": "施力時碰觸到物體的位置稱為力的作用點。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的表示", "q": "畫力的圖時，力的「方向」用什麼表示？", "o": ["箭頭", "線段的顏色", "圓點的大小", "寫數字"], "a": 0, "why": "力的方向用箭頭表示，箭頭方向就是施力方向。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的表示", "q": "畫力的圖時，力的「大小」用什麼表示？", "o": ["線段的長短", "箭頭的方向", "圓點的顏色", "畫幾個箭頭"], "a": 0, "why": "力的大小用線段的長短表示。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的表示", "q": "力的圖中，線段畫得越長，代表什麼？", "o": ["力越大", "力越小", "東西移動得越遠", "東西越重"], "a": 0, "why": "線段越長代表力越大，越短代表施力越小。", "trap": {"2": "線段長短代表力的大小，不是移動的距離喔。"}},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的表示", "q": "用力把球往下壓，球會怎樣？", "o": ["形狀變扁", "往上飛", "變大", "完全不變"], "a": 0, "why": "壓球：用力將球往下壓，球的形狀會變扁。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 1, "u": "力的表示", "q": "用力把球往上拋，球會怎樣？", "o": ["向上移動", "變扁", "鑽進地下", "不會動"], "a": 0, "why": "拋球：用力將球往上拋，球會向上移動。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 2, "u": "陷阱：哪一個能恢復", "q": "下面哪一個東西受力變形後，不再受力時「能」恢復原狀？", "o": ["橡皮筋", "膠泥", "踩扁的空飲料罐", "捏過的黏土"], "a": 0, "why": "橡皮筋能恢復原狀；膠泥和踩扁的飲料罐不能恢復。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 2, "u": "陷阱：判斷對錯", "q": "有人說：「物體受力，一定會同時改變形狀和運動狀態。」這句話對嗎？", "o": ["不對，有些只改變形狀，有些只改變運動狀態", "對，兩個一定同時改變", "不對，物體受力都不會改變", "不對，只有形狀會改變"], "a": 0, "why": "壓膠泥只有形狀改變；踢球、擋球是運動狀態改變。不一定兩個同時發生。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "u": "融會貫通：分類", "q": "用腳擋住滾動中的球，球停下來了。這是力造成哪一種改變？", "o": ["運動狀態改變", "形狀改變而且無法恢復", "顏色改變", "沒有任何改變"], "a": 0, "why": "球由「動」變成「停」，是運動狀態的改變。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "用腳踢靜止的足球，足球開始移動，這是運動狀態的改變。", "a": 0}, {"s": "用手推牆壁，牆壁看起來沒變形，表示手沒有對牆壁用力。", "a": 1, "why": "手有用力，只是牆壁很堅硬，肉眼看不出形狀改變。"}, {"s": "描述一個力，只要說出力的大小就足夠了。", "a": 1, "why": "清楚描述力要說出三要素：大小、方向和作用點。"}, {"s": "力的圖中，線段越短，代表施力越小。", "a": 0}], "why": "物體受力不一定看得出變化；描述力要說清楚大小、方向和作用點三要素。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "橡皮筋受力會變形，不再受力後能恢復原狀。", "a": 0}, {"s": "物體受力後只要形狀改變了，就一定無法恢復。", "a": 1, "why": "「一定」是陷阱！橡皮筋改變形狀後就能恢復。"}, {"s": "空飲料罐被踩扁後，不再受力也無法恢復原狀。", "a": 0}, {"s": "膠泥被壓扁後放手，會自己變回原來的長條形。", "a": 1, "why": "膠泥放手後維持被壓扁的樣子，不能恢復。"}], "why": "會改變形狀的物體，不再受力後有些能恢復（橡皮筋），有些不能（膠泥、踩扁的飲料罐）。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "看圖・力的表示", "q": "哪一張圖表示「用比較大的力，把球往上拋」？", "o": ["<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 150 q30 14 60 0 l0 14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"132\" x2=\"80.0\" y2=\"62.4\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 54 L86.1 66.6 L73.9 66.6Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"132\" r=\"7\" fill=\"#E5484D\"/></svg></div>", "<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 150 q30 14 60 0 l0 14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"132\" x2=\"80.0\" y2=\"104.4\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 96 L86.1 108.6 L73.9 108.6Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"132\" r=\"7\" fill=\"#E5484D\"/></svg></div>", "<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 30 q30 -14 60 0 l0 -14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"48\" x2=\"80.0\" y2=\"117.6\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 126 L73.9 113.4 L86.1 113.4Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"48\" r=\"7\" fill=\"#E5484D\"/></svg></div>", "<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 30 q30 -14 60 0 l0 -14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"48\" x2=\"80.0\" y2=\"75.6\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 84 L73.9 71.4 L86.1 71.4Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"48\" r=\"7\" fill=\"#E5484D\"/></svg></div>"], "a": 0, "why": "箭頭朝上＝往上拋；線段越長＝力越大。所以要選箭頭朝上、線段比較長的那一張。", "trap": {"1": "方向對了，但線段比較短，表示力比較小。", "2": "線段很長，但箭頭朝下，是往下壓，不是往上拋。"}, "pic": true},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "看圖・力的表示", "q": "哪一張圖表示「用比較小的力，把球往下壓」？", "o": ["<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 30 q30 -14 60 0 l0 -14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"48\" x2=\"80.0\" y2=\"75.6\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 84 L73.9 71.4 L86.1 71.4Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"48\" r=\"7\" fill=\"#E5484D\"/></svg></div>", "<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 30 q30 -14 60 0 l0 -14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"48\" x2=\"80.0\" y2=\"117.6\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 126 L73.9 113.4 L86.1 113.4Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"48\" r=\"7\" fill=\"#E5484D\"/></svg></div>", "<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 150 q30 14 60 0 l0 14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"132\" x2=\"80.0\" y2=\"104.4\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 96 L86.1 108.6 L73.9 108.6Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"132\" r=\"7\" fill=\"#E5484D\"/></svg></div>", "<div><svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 150 q30 14 60 0 l0 14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"132\" x2=\"80.0\" y2=\"62.4\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 54 L86.1 66.6 L73.9 66.6Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"132\" r=\"7\" fill=\"#E5484D\"/></svg></div>"], "a": 0, "why": "箭頭朝下＝往下壓；線段短＝力比較小。", "trap": {"1": "方向對了，但線段很長，表示用了比較大的力。", "2": "線段短沒錯，但箭頭朝上，是往上拋。"}, "pic": true},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 2, "ext": true, "u": "看圖・力的表示", "q": "這張圖中，球上面的「紅色圓點」代表什麼？", "o": ["力的作用點", "力的大小", "力的方向", "球移動的距離"], "a": 0, "why": "紅點是手碰到球的位置，也就是力的作用點；箭頭是方向，線段長短是大小。", "img": "<svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 30 q30 -14 60 0 l0 -14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"48\" x2=\"80.0\" y2=\"117.6\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 126 L73.9 113.4 L86.1 113.4Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"48\" r=\"7\" fill=\"#E5484D\"/></svg>"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "看圖・力的表示", "q": "這張圖的箭頭和線段，表示什麼？", "o": ["用比較大的力往下壓球", "用比較小的力往上拋球", "用比較大的力往上拋球", "球往下移動很遠"], "a": 0, "why": "箭頭朝下是往下壓；線段很長代表力很大。線段長短不是移動距離。", "img": "<svg viewBox=\"0 0 160 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"160\" height=\"180\" rx=\"14\" fill=\"#F4FBF2\"/><circle cx=\"80\" cy=\"90\" r=\"42\" fill=\"#8FD18A\" stroke=\"#3B3355\" stroke-width=\"3\"/><path d=\"M50 30 q30 -14 60 0 l0 -14 l-60 0Z\" fill=\"#F6C9A8\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"48\" x2=\"80.0\" y2=\"117.6\" stroke=\"#2E2445\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M80 126 L73.9 113.4 L86.1 113.4Z\" fill=\"#2E2445\"/><circle cx=\"80\" cy=\"48\" r=\"7\" fill=\"#E5484D\"/></svg>"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "配合題・力造成的改變", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 只有形狀改變", "乙 只有運動狀態改變"], "parts": [{"s": "用手捏膠泥", "a": 0}, {"s": "踢靜止的球，球滾了出去", "a": 1}, {"s": "用腳擋住滾動中的球，球停下來", "a": 1}, {"s": "把橡皮筋拉長", "a": 0}, {"s": "用腳踩扁空飲料罐", "a": 0}], "why": "東西「變形」是形狀改變；東西「開始動、停下來、變快變慢」是運動狀態改變。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "配合題・能不能恢復", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 能恢復原狀", "乙 不能恢復原狀", "丙 用眼睛看不出改變"], "parts": [{"s": "拉長橡皮筋後放手", "a": 0}, {"s": "壓扁膠泥後放手", "a": 1}, {"s": "用手推牆壁", "a": 2}, {"s": "踩扁空飲料罐", "a": 1}], "why": "橡皮筋能恢復；膠泥、踩扁的飲料罐不能恢復；牆壁很硬，肉眼看不出改變。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 2, "ext": true, "u": "選出不是的", "q": "下面哪一個「不是」物體受力後可能發生的現象？", "o": ["物體的顏色改變", "物體的形狀改變", "物體由靜止變成移動", "移動中的物體變慢或停止"], "a": 0, "why": "物體受力可能改變形狀或運動狀態，但顏色不會因為受力而改變。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "推理", "q": "小華說：「我推箱子用了很大的力。」如果要把這個力描述清楚，他還要說出什麼？", "o": ["力的方向和作用點", "什麼都不用再說", "箱子的顏色", "箱子的價錢"], "a": 0, "why": "清楚描述力要說出三要素：大小、方向、作用點。他只說了大小。"},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "素養題組", "q": "小宇把球往上拋時，施力的方向是哪一邊？", "o": ["向上", "向下", "向左", "沒有方向"], "a": 0, "why": "往上拋，力的方向向上，箭頭要朝上畫。", "ctx": "體育課時，小宇先把籃球<b>用力往上拋</b>，接住以後，再把籃球<b>往下拍</b>到地上。", "keep": true},
    {"l": "第二單元活動一 力的現象有哪些", "lv": 3, "ext": true, "u": "素養題組", "q": "小宇想讓球拋得比剛剛更高，畫力的圖時應該怎麼改？", "o": ["向上的線段畫得更長", "向上的線段畫得更短", "箭頭改成朝下", "把紅點畫大一點"], "a": 0, "why": "要拋更高，就要用更大的力；力越大，線段畫得越長。", "ctx": "體育課時，小宇先把籃球<b>用力往上拋</b>，接住以後，再把籃球<b>往下拍</b>到地上。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵好好玩", "q": "用磁鐵可以把便條紙固定在冰箱門上，卻不能固定在木門上，這是為什麼？", "o": ["冰箱門裡面含有鐵", "木門太重", "冰箱門比較冷", "木門有磁力"], "a": 0, "why": "冰箱門裡面含有鐵，磁鐵可以吸住鐵製或含有鐵的物品。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵好好玩", "q": "下面哪一個能被磁鐵吸住？", "o": ["迴紋針", "橡皮擦", "色紙", "鉛筆"], "a": 0, "why": "能被吸住：長尾夾、迴紋針、釘書針、剪刀刀刃處。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵好好玩", "q": "下面哪一個「不能」被磁鐵吸住？", "o": ["十元硬幣", "長尾夾", "釘書針", "迴紋針"], "a": 0, "why": "不能被吸住：橡皮擦、彩色筆、十元硬幣、色紙、膠帶、鉛筆。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵好好玩", "q": "剪刀的哪一個部分能被磁鐵吸住？", "o": ["刀刃處", "塑膠握把", "剪刀上的貼紙"], "a": 0, "why": "課本說：剪刀刀刃處能被磁鐵吸住。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵好好玩", "q": "磁鐵除了可以吸住鐵製品，還可以吸引哪些金屬？", "o": ["鈷、鎳等金屬", "木頭", "塑膠", "紙"], "a": 0, "why": "磁鐵除了吸住鐵製品外，還能吸引鈷、鎳等金屬。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "安全使用", "q": "為什麼不可以把磁鐵靠近手機等電子產品？", "o": ["可能造成電子產品故障", "磁鐵會變成手機", "手機會變重", "磁鐵會融化"], "a": 0, "why": "不可用磁鐵靠近手機等電子產品，以免造成故障。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵好好玩", "q": "做餐具和飲料杯的不鏽鋼，通常能被磁鐵吸住嗎？", "o": ["通常不能", "一定可以", "只有晚上可以", "泡水才可以"], "a": 0, "why": "做餐具、飲料杯的不鏽鋼通常無法被磁鐵吸住；做床墊彈簧的不鏽鋼則可以。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的兩極", "q": "長條形磁鐵的哪裡，吸住的迴紋針最多？", "o": ["兩端", "中間", "每個地方一樣多", "都吸不住"], "a": 0, "why": "長條形磁鐵兩端吸住的迴紋針比中間多，兩端磁力較強。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的兩極", "q": "可以用什麼方法，知道磁鐵磁力的強弱？", "o": ["比較吸住的迴紋針數量", "比較磁鐵的顏色", "聞磁鐵的味道", "比較磁鐵的重量"], "a": 0, "why": "利用磁鐵吸住迴紋針的數量，可以知道磁力強弱。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的兩極", "q": "磁鐵上磁力較強的部位，叫做什麼？", "o": ["磁極", "作用點", "節", "浮標"], "a": 0, "why": "磁力較強的部位稱為「磁極」。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的兩極", "q": "磁極分成哪兩種？", "o": ["N 極和 S 極", "A 極和 B 極", "大極和小極", "紅極和綠極"], "a": 0, "why": "磁極分別是 N 極和 S 極。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的兩極", "q": "長條形和 U 形磁鐵的磁極，通常在哪裡？", "o": ["兩端", "正中間", "側邊", "沒有磁極"], "a": 0, "why": "長條形和 U 形磁鐵的磁極通常在兩端。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的兩極", "q": "圓形磁鐵的磁極，通常在哪裡？", "o": ["面積較大的兩面", "圓圓的側邊", "中心的一個點", "沒有磁極"], "a": 0, "why": "圓形磁鐵的磁極通常在面積較大的兩面。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "同極相斥異極相吸", "q": "一個磁鐵的 N 極，靠近另一個磁鐵的 S 極，會怎樣？", "o": ["互相吸引", "互相排斥", "沒有反應", "變成鐵"], "a": 0, "why": "N 極和 S 極是不同的磁極，異極相吸。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "同極相斥異極相吸", "q": "一個磁鐵的 N 極，靠近另一個磁鐵的 N 極，會怎樣？", "o": ["互相排斥", "互相吸引", "沒有反應", "黏在一起"], "a": 0, "why": "N 極和 N 極是相同磁極，同極相斥。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "同極相斥異極相吸", "q": "兩個磁鐵的 S 極互相靠近，會怎樣？", "o": ["互相排斥", "互相吸引", "沒有反應", "變成 N 極"], "a": 0, "why": "S 極和 S 極是相同磁極，同極相斥。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "同極相斥異極相吸", "q": "磁鐵磁極的特性是什麼？", "o": ["同極相斥、異極相吸", "同極相吸、異極相斥", "不管哪一極都相吸", "不管哪一極都相斥"], "a": 0, "why": "每個磁鐵都有 N 極和 S 極，磁極具有同極相斥、異極相吸的特性。", "trap": {"1": "剛好相反喔！相同的極會推開，不同的極才會吸住。"}},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的妙用", "q": "怎麼把散落的鐵粉收乾淨？", "o": ["磁鐵放進塑膠袋，隔著袋子吸鐵粉，再把袋子翻面、移開磁鐵", "用水沖", "用手抓", "用吹風機吹"], "a": 0, "why": "讓磁鐵隔著塑膠袋吸引鐵粉，翻面再移開磁鐵，鐵粉就被收進塑膠袋裡。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的保存", "q": "我們現在常用的永久磁鐵，是用什麼製成的？", "o": ["氧化鐵", "木頭", "塑膠", "玻璃"], "a": 0, "why": "我們現在常用的磁鐵，是以氧化鐵製成的永久磁鐵。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的保存", "q": "只有一個磁鐵時，正確的保存方法是什麼？", "o": ["把磁鐵吸在鐵片上", "放在火爐旁邊", "用槌子敲一敲", "放在手機上面"], "a": 0, "why": "只有一個磁鐵時，可以把磁鐵吸附在鐵片上。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的保存", "q": "有兩個以上的磁鐵時，要怎麼保存？", "o": ["讓磁鐵異極相吸、靠緊放", "讓同極靠在一起", "丟進熱水裡", "放在電腦旁邊"], "a": 0, "why": "有兩個以上的磁鐵時，可以讓磁鐵的異極相吸、靠緊。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的保存", "q": "保存磁鐵時，要避免什麼？", "o": ["碰到高溫的東西、受到敲打破裂", "吸在鐵片上", "異極相吸靠緊", "收進盒子裡"], "a": 0, "why": "要避免磁鐵與高溫物體接觸，也要避免受到敲打破裂。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的保存", "q": "現在磁力最強的合金磁鐵，是由哪三種金屬組成？", "o": ["釹、鐵、硼", "金、銀、銅", "鋁、錫、鉛", "鐵、木、紙"], "a": 0, "why": "合金磁鐵由釹、鐵、硼 3 種金屬組成。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的保存", "q": "合金磁鐵的磁力，大約是一般磁鐵的幾倍？", "o": ["10 倍", "2 倍", "100 倍", "一樣大"], "a": 0, "why": "合金磁鐵的磁力大約是一般磁鐵的 10 倍。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的妙用", "q": "釣魚遊戲是利用磁鐵的哪一個特性？", "o": ["磁鐵可以吸引鐵製品", "同極相斥", "水的浮力", "橡皮筋的彈力"], "a": 0, "why": "釣竿末端的磁鐵吸住小魚嘴上的鐵螺絲，是利用磁鐵吸引鐵製品。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的妙用", "q": "門擋、磁吸鉛筆盒在磁鐵兩面加上鐵片，是為了什麼？", "o": ["增強吸力", "讓磁鐵變重", "讓磁鐵比較漂亮", "減少磁力"], "a": 0, "why": "在磁鐵兩面加上鐵片，可以讓磁鐵的吸力增強。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 1, "u": "磁鐵的妙用", "q": "玩具火車的車廂可以連在一起，是利用磁鐵的什麼特性？", "o": ["異極相吸", "同極相斥", "浮力", "風力"], "a": 0, "why": "玩具火車利用磁鐵異極相吸的特性，將車廂吸在一起。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 2, "u": "陷阱：加鐵片", "q": "磁鐵兩面加上鐵片後，吸力變強了，原因是什麼？", "o": ["鐵片讓磁力集中，磁鐵本身的磁力沒有增加", "磁鐵的磁力變多了", "鐵片自己本來就有磁力", "鐵片變成了合金磁鐵"], "a": 0, "why": "課本說：磁鐵的磁力並沒有增加，只是鐵片具有使磁力集中的效果。", "trap": {"1": "磁鐵本身的磁力沒有變多喔，是鐵片把磁力集中起來。"}},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 2, "u": "陷阱：磁鐵在哪裡", "q": "跳棋能吸在鐵製的棋盤上，是因為什麼？", "o": ["棋子底部有磁鐵，棋盤是鐵製的", "整顆棋子都是鐵做的", "棋盤上塗了膠水", "棋子很輕"], "a": 0, "why": "磁吸跳棋是「棋子有磁鐵、棋盤是鐵製」，不是整顆棋子都是鐵。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 2, "u": "陷阱：磁鐵在哪裡", "q": "釣魚遊戲中，磁鐵裝在哪裡？", "o": ["釣竿上，小魚嘴上是鐵螺絲", "小魚嘴上，釣竿是木頭", "兩邊都沒有磁鐵", "裝在水裡"], "a": 0, "why": "釣竿上有磁鐵，魚嘴上是鐵螺絲，所以能把魚吸起來。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "u": "融會貫通：設計實驗", "q": "小明想知道兩個磁鐵哪一個磁力比較強，可以怎麼做？", "o": ["比較兩個磁鐵各能吸住幾個迴紋針", "比較兩個磁鐵的大小", "比較兩個磁鐵的顏色", "比較哪一個比較重"], "a": 0, "why": "用吸住迴紋針的數量就能比較磁力強弱。磁鐵大不一定比較強，例如合金磁鐵的磁力大約是一般磁鐵的 10 倍。", "trap": {"1": "大的磁鐵不一定比較強喔！要實際測一測才知道。"}},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "看圖・推理", "q": "甲、乙、丙是三個長條形磁鐵。甲的 N 極靠近乙的 A 端，互相推開；乙的 B 端靠近丙的 C 端，互相吸住。請問 C 端是什麼極？", "o": ["N 極", "S 極", "沒有磁極", "無法判斷"], "a": 0, "why": "第一步：互相推開表示同極，所以 A 端是 N 極。第二步：一個磁鐵兩端各有一個磁極，所以 B 端是 S 極。第三步：B（S 極）和 C 互相吸住，是異極相吸，所以 C 是 N 極。", "trap": {"1": "你可能只看到「吸住」就直接判斷了。先推出 A 是 N 極，再推出 B 是 S 極，最後 C 要跟 S 極相吸，才是 N 極。"}, "img": "<svg viewBox=\"0 0 620 130\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"620\" height=\"130\" rx=\"14\" fill=\"#F6F2FF\"/><text x=\"85\" y=\"40\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#3B3355\">甲</text><rect x=\"10\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#5B8DEF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><rect x=\"85.0\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#E5484D\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"47.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">S</text><text x=\"122.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">N</text><text x=\"195\" y=\"112\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#E5484D\">推開</text><text x=\"310\" y=\"40\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#3B3355\">乙</text><rect x=\"235\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><rect x=\"310.0\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"272.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">A</text><text x=\"347.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">B</text><text x=\"420\" y=\"112\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#22A06B\">吸住</text><text x=\"535\" y=\"40\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#3B3355\">丙</text><rect x=\"460\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><rect x=\"535.0\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"497.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">C</text><text x=\"572.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">D</text></svg>", "keep": true},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "看圖・推理", "q": "甲、乙、丙是三個長條形磁鐵。甲的 N 極靠近乙的 A 端，互相吸住；乙的 B 端靠近丙的 C 端，也互相吸住。請問 C 端是什麼極？", "o": ["N 極", "S 極", "沒有磁極", "無法判斷"], "a": 1, "why": "A 和甲的 N 極相吸（異極），A 是 S 極；乙的另一端 B 就是 N 極；B 和 C 互相吸住也是異極，所以 C 是 S 極。", "trap": {"0": "A 是 S 極沒錯，但 C 是跟 B 比，B 是 N 極，所以 C 要是 S 極才會相吸。"}, "img": "<svg viewBox=\"0 0 620 130\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"620\" height=\"130\" rx=\"14\" fill=\"#F6F2FF\"/><text x=\"85\" y=\"40\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#3B3355\">甲</text><rect x=\"10\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#5B8DEF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><rect x=\"85.0\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#E5484D\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"47.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">S</text><text x=\"122.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">N</text><text x=\"195\" y=\"112\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#22A06B\">吸住</text><text x=\"310\" y=\"40\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#3B3355\">乙</text><rect x=\"235\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><rect x=\"310.0\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"272.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">A</text><text x=\"347.5\" y=\"86.0\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">B</text><text x=\"420\" y=\"112\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#22A06B\">吸住</text><text x=\"535\" y=\"40\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#3B3355\">丙</text><rect x=\"460\" y=\"58\" width=\"75.0\" height=\"40\" fill=\"#C9C     {"l": "第二單元活動二 磁力有什麼特性", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "所有的金屬都可以被磁鐵吸住。", "a": 1, "why": "不是所有金屬都能被吸住，例如十元硬幣就吸不住。"}, {"s": "磁鐵可以隔著塑膠袋把鐵粉吸起來。", "a": 0}, {"s": "不鏽鋼做的東西，一定都能被磁鐵吸住。", "a": 1, "why": "「一定」是陷阱！做餐具的不鏽鋼通常吸不住，床墊彈簧的不鏽鋼才吸得住。"}, {"s": "每個磁鐵都有 N 極和 S 極。", "a": 0}], "why": "看到「所有、一定、都」要小心：金屬不一定都能被磁鐵吸住。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "圓形磁鐵的磁極，通常在圓圓的側邊。", "a": 1, "why": "圓形磁鐵的磁極在面積較大的兩面。"}, {"s": "磁鐵兩面加上鐵片後，磁鐵本身的磁力就增加了。", "a": 1, "why": "磁力沒有增加，是鐵片讓磁力集中。"}, {"s": "長條形磁鐵的中間，幾乎吸不住迴紋針。", "a": 0}, {"s": "拿磁鐵去敲打東西，不會影響磁鐵。", "a": 1, "why": "要避免磁鐵受到敲打破裂。"}], "why": "磁極位置：長條形、U 形在兩端，圓形在兩個大面；保存磁鐵要避免高溫和敲打。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "配合題・磁鐵的妙用", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 吸引鐵製品", "乙 加鐵片增強吸力", "丙 異極相吸"], "parts": [{"s": "釣魚遊戲", "a": 0}, {"s": "門擋", "a": 1}, {"s": "玩具火車的車廂連在一起", "a": 2}, {"s": "螺絲起子吸住螺絲", "a": 0}, {"s": "磁吸鉛筆盒", "a": 1}, {"s": "磁鐵掛鉤吸在白板上", "a": 0}], "why": "釣魚遊戲、螺絲起子、磁鐵掛鉤：吸引鐵製品；門擋、鉛筆盒：兩面加鐵片增強吸力；玩具火車：異極相吸。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 2, "ext": true, "u": "選出錯的", "q": "下面哪一個是「錯誤」的磁鐵保存方法？", "o": ["把磁鐵放在暖爐旁邊", "把一個磁鐵吸在鐵片上", "讓兩個磁鐵異極相吸、靠緊", "小心拿著，不讓它摔破"], "a": 0, "why": "磁鐵要避免和高溫的物體接觸，放在暖爐旁邊是錯的。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "素養題組", "q": "小安想最快把迴紋針挑出來，用哪一個工具最好？", "o": ["磁鐵", "吸管", "放大鏡", "直尺"], "a": 0, "why": "迴紋針是鐵做的，可以被磁鐵吸起來；色紙和橡皮擦不會被吸住。", "ctx": "美勞課後，小安的桌上有一堆東西混在一起：<b>迴紋針、碎色紙、橡皮擦屑</b>。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "素養題組", "q": "如果這堆東西裡還混了幾個十元硬幣，用磁鐵去吸，會怎樣？", "o": ["只有迴紋針被吸起來，硬幣留在桌上", "硬幣也會一起被吸起來", "什麼都吸不起來", "磁鐵會壞掉"], "a": 0, "why": "十元硬幣不能被磁鐵吸住，所以只有迴紋針會被吸起來。", "ctx": "美勞課後，小安的桌上有一堆東西混在一起：<b>迴紋針、碎色紙、橡皮擦屑</b>。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "推理", "q": "兩個圓形磁鐵疊在一起時吸得很緊，把其中一個翻面再疊上去，卻互相推開。這是為什麼？", "o": ["原本面對面的是異極，翻面後變成同極", "磁鐵壞掉了", "圓形磁鐵沒有磁極", "翻面後磁力不見了"], "a": 0, "why": "圓形磁鐵的磁極在兩個大面。翻面後，面對面的磁極從「異極」變成「同極」，就從相吸變成相斥。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 2, "ext": true, "u": "陷阱：判斷對錯", "q": "小美說：「十元硬幣吸不住，所以十元硬幣一定不是金屬。」她說得對嗎？", "o": ["不對，有些金屬本來就不能被磁鐵吸住", "對，吸不住的就不是金屬", "不對，十元硬幣其實吸得住", "不對，十元硬幣是塑膠做的"], "a": 0, "why": "磁鐵能吸住鐵、鈷、鎳等，但不是每種金屬都能被吸住。吸不住不代表不是金屬。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "推理", "q": "把磁吸跳棋的棋子，放在木頭桌子上，會怎樣？", "o": ["吸不住，因為木頭不含鐵", "吸得更緊", "棋子會變成鐵", "棋子會自己跳起來"], "a": 0, "why": "磁鐵要吸住鐵製或含鐵的東西，木頭沒有鐵，所以吸不住，就像便條紙不能用磁鐵固定在木門上。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "素養題組", "q": "第二次（加上鐵片）和第一次比，磁鐵外圍的鐵粉會怎樣？", "o": ["變得非常密集", "變得比較稀疏", "全部不見", "完全一樣"], "a": 0, "why": "加上鐵片後，磁鐵外圍的鐵粉變得非常密集。", "ctx": "小芸做實驗：在厚紙板上撒一層薄薄的鐵粉，紙板下方放一個磁鐵，觀察鐵粉的樣子。第二次，她在磁鐵兩側<b>夾上鐵片</b>，再做一次。"},
    {"l": "第二單元活動二 磁力有什麼特性", "lv": 3, "ext": true, "u": "素養題組", "q": "這個實驗可以說明什麼？", "o": ["鐵片能讓磁力集中，所以吸力變強", "鐵片讓磁鐵的磁力變多", "厚紙板有磁力", "鐵粉自己會移動"], "a": 0, "why": "加鐵片沒有讓磁力變多，而是讓磁力集中，所以局部的吸力變強。", "trap": {"1": "磁鐵本身的磁力沒有增加喔，是鐵片讓磁力集中。"}, "ctx": "小芸做實驗：在厚紙板上撒一層薄薄的鐵粉，紙板下方放一個磁鐵，觀察鐵粉的樣子。第二次，她在磁鐵兩側<b>夾上鐵片</b>，再做一次。"},

    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "水傳送動力", "q": "注射筒實驗：用力壓下裝滿水的甲注射筒活塞，連接的乙注射筒活塞會怎樣？", "o": ["往外移動", "往內縮進去", "完全不動", "變成磁鐵"], "a": 0, "why": "壓下甲注射筒活塞，乙注射筒的活塞會往外移動。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "水傳送動力", "q": "注射筒實驗證明了什麼？", "o": ["水可以傳送動力", "水有磁力", "水會產生彈力", "空氣有浮力"], "a": 0, "why": "手壓甲活塞的力，透過水傳送到乙活塞，也就是用水傳送動力。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：阿基米德", "q": "阿基米德提出的「浮力原理」：物體在液體中的浮力，等於什麼？", "o": ["排開的液體重量", "物體的顏色", "液體的溫度", "容器的大小"], "a": 0, "why": "阿基米德提出：物體在液體中的浮力等於排開的液體重量。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁浮列車", "q": "磁浮列車是利用什麼來推動？", "o": ["電磁鐵的排斥力和吸引力", "水的浮力", "風力", "橡皮筋的彈力"], "a": 0, "why": "磁浮列車利用磁鐵的排斥力和吸引力來推動，使用的是通電產生磁力的「電磁鐵」。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁浮列車", "q": "磁浮列車懸浮在軌道上、不接觸地面，有什麼好處？", "o": ["減少摩擦力，大大提高速度", "車票比較便宜", "不需要用電", "可以載更多水"], "a": 0, "why": "行駛時不接觸地面，可以減少車體和地面的摩擦力，提高速度。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁浮列車", "q": "「電磁鐵」是什麼樣的磁鐵？", "o": ["通電才會產生磁力", "永遠都有磁力，不用電", "用木頭做的", "會浮在水上的鐵"], "a": 0, "why": "電磁鐵是利用通電來產生磁力的磁鐵。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁力的大小事", "q": "磁鐵磁力作用的範圍，叫做什麼？", "o": ["磁場", "磁極", "作用點", "浮標"], "a": 0, "why": "磁鐵磁力作用的範圍稱為磁場，磁場中充滿看不見的磁力線。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁力的大小事", "q": "磁力線越密集，代表什麼？", "o": ["磁力越強", "磁力越弱", "鐵粉越少", "磁鐵越冷"], "a": 0, "why": "磁力線越密集，就代表磁力越強。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁力的大小事", "q": "地球內部的磁場，叫做什麼？", "o": ["地磁", "浮力", "風力", "磁浮"], "a": 0, "why": "地球本身就像一個大磁鐵，地球內部的磁場稱為地磁。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁力的大小事", "q": "指北針的指針箭頭（N 極），會指向哪個方向？", "o": ["北方", "南方", "東方", "西方"], "a": 0, "why": "指北針的 N 極會朝向北方。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁力的大小事", "q": "鴿子能從很遠的地方飛回家，是因為什麼？", "o": ["兩眼之間的突起內有磁性物質，能偵測地球磁場", "會看地圖", "記得每一棵樹", "跟著風飛"], "a": 0, "why": "鴿子兩眼之間的突起內具有磁性物質，能偵測地球磁場。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：磁力的大小事", "q": "冰箱門邊框裝上軟性磁條，有什麼功用？", "o": ["讓冰箱門更密合", "讓冰箱變冷", "讓門變重", "讓門變色"], "a": 0, "why": "利用磁條的吸力，使冰箱門更密合。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：科學玩具", "q": "線軸車轉緊瓶子裡的橡皮筋，放手後就往前滾，是利用什麼力？", "o": ["彈力", "浮力", "風力", "磁力"], "a": 0, "why": "線軸車是彈力的應用。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 1, "u": "充電站：科學玩具", "q": "自製水車是讓水柱碰觸扇葉而轉動，這是利用什麼？", "o": ["水的力量", "彈力", "磁力", "風力"], "a": 0, "why": "自製水車是水力的應用：水柱碰觸扇葉使它轉動。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "u": "陷阱：磁浮列車", "q": "磁浮列車的「浮」，是利用水的浮力嗎？", "o": ["不是，是利用電磁鐵的磁力", "是，利用水的浮力", "不是，是利用風力", "不是，是利用彈力"], "a": 0, "why": "磁浮列車利用電磁鐵的磁力懸浮，和水的浮力沒有關係。", "trap": {"1": "名字裡有「浮」，但它是靠磁力浮起來的，不是水的浮力喔。"}},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "u": "陷阱：沉下去的東西", "q": "沉在水底的物體，有沒有受到浮力？", "o": ["有，只是浮力不夠大", "沒有，沉下去就沒有浮力", "只有晚上才有", "只有浮在水面的東西才有"], "a": 0, "why": "沉入水底的物體仍然受到浮力，只是浮力不夠大，所以沉下去。", "trap": {"1": "沉在水底的東西還是有浮力，只是不夠把它托起來。"}},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "u": "陷阱：浮力方向", "q": "水中的物體受到的浮力，方向是哪裡？", "o": ["向上", "向下", "向左", "沒有方向"], "a": 0, "why": "浮力是水把物體往上托的力量，方向向上。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "配合題・生活中的力", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 彈力", "乙 風力", "丙 浮力", "丁 水傳送動力"], "parts": [{"s": "原子筆的筆心縮回", "a": 0}, {"s": "風箏在空中飄揚", "a": 1}, {"s": "釣魚浮標浮在水面", "a": 2}, {"s": "水槍射倒空罐", "a": 3}, {"s": "橡皮筋綁住色鉛筆", "a": 0}, {"s": "馬桶水箱裡的浮球", "a": 2}], "why": "彈簧、橡皮筋是彈力；風車、風箏是風力；浮板、浮球、浮標、郵輪是浮力；水車、水柱、水槍是水傳送動力。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "配合題・生活中的力", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 彈力", "乙 風力", "丙 浮力", "丁 水傳送動力"], "parts": [{"s": "郵輪載運旅客", "a": 2}, {"s": "風車轉動", "a": 1}, {"s": "流水推動水車", "a": 3}, {"s": "線軸車往前滾", "a": 0}, {"s": "浮板幫助游泳", "a": 2}, {"s": "水柱沖走地面的髒汙", "a": 3}], "why": "水的「浮力」是把東西往上托；水的「傳送動力」是水流動或被壓時推動東西，兩個不一樣喔。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "看圖：甲、乙兩支注射筒用塑膠管連起來，甲筒裝滿顏色水。判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "用力壓甲注射筒的活塞，乙注射筒的活塞會往外移動。", "a": 0}, {"s": "這個實驗是利用水的浮力。", "a": 1, "why": "這是水傳送動力，不是浮力。"}, {"s": "手壓甲活塞的力，透過水傳送到乙活塞。", "a": 0}, {"s": "流水推動水車轉動，也是水的力量讓物體移動。", "a": 0}], "why": "注射筒、水車、水柱、水槍，都是「水傳送動力」；浮板、浮標、郵輪才是「浮力」。", "img": "<svg viewBox=\"0 0 560 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"560\" height=\"150\" rx=\"14\" fill=\"#F2F8FF\"/><rect x=\"30\" y=\"50\" width=\"140\" height=\"44\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><rect x=\"34\" y=\"54\" width=\"132\" height=\"36\" fill=\"#F28B9B\"/><text x=\"100\" y=\"36\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">甲 注射筒（裝顏色水）</text><rect x=\"390\" y=\"50\" width=\"140\" height=\"44\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"460\" y=\"36\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">乙 注射筒（空的）</text><path d=\"M170 72 C 240 130, 320 130, 390 72\" stroke=\"#F28B9B\" stroke-width=\"9\" fill=\"none\"/><path d=\"M170 72 C 240 130, 320 130, 390 72\" stroke=\"#3B3355\" stroke-width=\"1.5\" fill=\"none\" stroke-dasharray=\"0\"/><rect x=\"10\" y=\"62\" width=\"20\" height=\"20\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2\"/><rect x=\"530\" y=\"62\" width=\"20\" height=\"20\" fill=\"#C9C2DA\" stroke=\"#3B3355\" stroke-width=\"2\"/><line x1=\"2\" y1=\"72\" x2=\"17.6\" y2=\"72.0\" stroke=\"#E5484D\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M26 72 L13.4 78.1 L13.4 65.9Z\" fill=\"#E5484D\"/><text x=\"20\" y=\"128\" font-size=\"15\" fill=\"#6E6290\">手往這邊壓</text></svg>"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "沉在水底的物體，完全沒有受到浮力。", "a": 1, "why": "「完全沒有」是陷阱！沉底的物體還是有浮力，只是不夠大。"}, {"s": "原本會沉的膠泥，捏成碗形以後，比較容易浮在水面上。", "a": 0}, {"s": "很重的東西，一定會沉到水底。", "a": 1, "why": "「一定」是陷阱！郵輪很重，還是能利用浮力浮在海上。"}, {"s": "水中物體受到的浮力，方向是向上。", "a": 0}], "why": "浮沉不是只看重量，形狀也有關係；沉底的東西也有浮力。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "看圖・浮力", "q": "四塊一樣重的膠泥捏成不同形狀（如圖），放進水裡，哪些比較容易浮起來？", "o": ["甲和乙", "只有甲", "丙和丁", "全部都會沉"], "a": 2, "why": "船形、碗形這種中間有空間的容器形狀，比較容易浮；實心的圓球和扁片會沉。", "trap": {"0": "甲、乙是實心的，放進水裡會沉。"}, "img": "<svg viewBox=\"0 0 560 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"560\" height=\"150\" rx=\"14\" fill=\"#FFF8EF\"/><circle cx=\"70\" cy=\"80\" r=\"28\" fill=\"#F07A52\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"70\" y=\"132\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#3B3355\">實心圓球</text><text x=\"70\" y=\"28\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">甲</text><rect x=\"160\" y=\"70\" width=\"100\" height=\"22\" rx=\"8\" fill=\"#F07A52\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><text x=\"210\" y=\"132\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#3B3355\">實心扁片</text><text x=\"210\" y=\"28\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">乙</text><path d=\"M300 66 L410 66 L392 104 L318 104Z\" fill=\"#F07A52\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M310 70 L400 70 L388 96 L322 96Z\" fill=\"#C85A3A\"/><text x=\"355\" y=\"132\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#3B3355\">船形</text><text x=\"355\" y=\"28\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">丙</text><path d=\"M445 64 Q490 120 535 64 Z\" fill=\"#F07A52\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M456 68 Q490 108 524 68Z\" fill=\"#C85A3A\"/><text x=\"490\" y=\"132\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#3B3355\">碗形</text><text x=\"490\" y=\"28\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">丁</text></svg>", "keep": true},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "推理", "q": "郵輪又大又重，為什麼還能浮在海上？", "o": ["船身做成中間有很大空間的容器形狀，浮力夠大", "郵輪一點重量都沒有", "海水把船吸住", "有磁鐵把船拉著"], "a": 0, "why": "就像膠泥捏成船形會浮一樣，郵輪的船身是中間有空間的容器形狀，得到的浮力夠大，就能浮在海上。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "推理", "q": "同一塊膠泥，從實心圓球改捏成船形後就浮起來了。這時候它的重量有沒有改變？", "o": ["重量沒變，是形狀改變後浮力變得夠大", "重量變輕了", "膠泥吸了很多水", "船形的膠泥有磁力"], "a": 0, "why": "課本說：原本沉在水中的物體，改變形狀後浮力變得夠大，就能浮在水面上。重量是一樣的。", "trap": {"1": "同一塊膠泥，沒有加也沒有拿掉，重量是一樣的喔。"}},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "ext": true, "u": "選出不是的", "q": "下面哪一個「不是」利用水傳送動力？", "o": ["浮板幫助游泳", "流水推動水車", "水柱沖走髒汙", "水槍射倒空罐"], "a": 0, "why": "浮板是利用水的浮力；水車、水柱、水槍才是水傳送動力。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "ext": true, "u": "充電站・陷阱", "q": "地球就像一個大磁鐵。地理的「北方」附近，是地磁的哪一極？", "o": ["S 極", "N 極", "沒有磁極", "一半 N 一半 S"], "a": 0, "why": "地磁的 S 極靠近地球的北方，N 極靠近地球的南方，剛好相反。", "trap": {"1": "很多人以為北方就是 N 極，其實地磁剛好相反：北方附近是地磁 S 極。"}},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "充電站・推理", "q": "指北針的 N 極，為什麼會指向北方？", "o": ["北方附近是地磁 S 極，異極相吸", "北方附近是地磁 N 極，同極相吸", "因為風從北方吹來", "因為指北針很輕"], "a": 0, "why": "地理北方附近是地磁 S 極，指北針的 N 極和它異極相吸，所以朝向北方。", "trap": {"1": "同極是相斥，不會相吸喔！北方附近其實是地磁 S 極。"}},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "ext": true, "u": "充電站・選出錯的", "q": "下面關於磁浮列車的說法，哪一個是「錯誤」的？", "o": ["磁浮列車是靠水的浮力浮起來的", "它使用通電會產生磁力的電磁鐵", "行駛時不會接觸地面", "可以減少摩擦力、提高速度"], "a": 0, "why": "磁浮列車是靠電磁鐵的磁力懸浮，跟水的浮力無關。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "充電站", "q": "在透明板上撒鐵粉，觀察長條形磁鐵，哪裡的鐵粉排列最密集？", "o": ["兩端磁極附近", "正中間", "每個地方都一樣", "都沒有鐵粉"], "a": 0, "why": "磁極附近磁力最強，磁力線最密集，所以鐵粉聚得最密。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 2, "ext": true, "u": "是非題組・充電站", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "磁浮列車使用的是通電會產生磁力的電磁鐵。", "a": 0}, {"s": "地磁的 N 極靠近地球的北方。", "a": 1, "why": "剛好相反：地磁 N 極靠近南方，S 極靠近北方。"}, {"s": "鴿子兩眼之間的突起內有磁性物質，能偵測地球磁場。", "a": 0}, {"s": "冰箱門的軟性磁條放在高溫的地方，也不會失去磁性。", "a": 1, "why": "磁條放在磁鐵、電腦旁或高溫環境中，會失去磁性。"}], "why": "充電站的重點：電磁鐵通電才有磁力；地磁方向和地理方向相反；磁條怕高溫和磁鐵。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "素養題組", "q": "一班的線軸車能往前跑，是利用什麼力？", "o": ["彈力", "磁力", "浮力", "風力"], "a": 0, "why": "轉緊的橡皮筋想恢復原狀，產生彈力，推動線軸車前進。", "ctx": "三年級園遊會有三個攤位：<br>一班「彈射小車」：轉緊瓶子裡的橡皮筋，放手讓線軸車往前跑。<br>二班「釣魚樂」：用綁著磁鐵的釣竿釣紙做的小魚。<br>三班「小船載重賽」：用膠泥捏小船，看誰的船能浮在水上。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "素養題組", "q": "二班的紙魚嘴巴上，要裝什麼才釣得起來？", "o": ["迴紋針等鐵製品", "塑膠珠子", "木頭片", "橡皮擦"], "a": 0, "why": "釣竿上是磁鐵，魚嘴要有鐵製品才能被吸住，就像課本的釣魚遊戲在魚嘴裝鐵螺絲。", "ctx": "三年級園遊會有三個攤位：<br>一班「彈射小車」：轉緊瓶子裡的橡皮筋，放手讓線軸車往前跑。<br>二班「釣魚樂」：用綁著磁鐵的釣竿釣紙做的小魚。<br>三班「小船載重賽」：用膠泥捏小船，看誰的船能浮在水上。"},
    {"l": "第二單元活動三 還有什麼不一樣的力", "lv": 3, "ext": true, "u": "素養題組", "q": "三班的膠泥要捏成什麼形狀，最容易浮在水上？", "o": ["中間有空間的船形", "實心的圓球", "實心的長條", "揉成很小的球"], "a": 0, "why": "做成中間有空間的容器形狀，比較容易浮在水面上。", "ctx": "三年級園遊會有三個攤位：<br>一班「彈射小車」：轉緊瓶子裡的橡皮筋，放手讓線軸車往前跑。<br>二班「釣魚樂」：用綁著磁鐵的釣竿釣紙做的小魚。<br>三班「小船載重賽」：用膠泥捏小船，看誰的船能浮在水上。"},
    {"l": "第一單元活動一 植物是什麼", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "校園裡的樟樹和仙丹花，都是生物中的植物。", "a": 0}, {"s": "植物的身體有根、莖、葉，但沒有花、果實和種子。", "a": 1, "why": "植物的身體分為根、莖、葉、花、果實和種子六個部分。"}, {"s": "植物會利用陽光、水等，自己製造養分。", "a": 0}, {"s": "動物和植物一樣，都能自己製造養分。", "a": 1, "why": "動物不能自己製造養分，要從外界攝取，所以多數動物要移動去覓食。"}], "why": "生物包含動物和植物；植物會自己製造養分、不會移動，動物要移動去覓食。"},
    {"l": "第一單元活動一 植物是什麼", "lv": 3, "ext": true, "u": "配合題・分類", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 非生物", "乙 動物", "丙 植物"], "parts": [{"s": "鞦韆", "a": 0}, {"s": "蝴蝶", "a": 1}, {"s": "南美蟛蜞菊", "a": 2}, {"s": "石頭", "a": 0}, {"s": "龜", "a": 1}, {"s": "榕樹", "a": 2}], "why": "沒有生命的是非生物；會移動覓食的是動物；不會移動、能自己製造養分的是植物。"},
    {"l": "第一單元活動一 植物是什麼", "lv": 3, "ext": true, "u": "配合題・怎麼觀察", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 直接看得到", "乙 要挖開泥土", "丙 要剖開果實"], "parts": [{"s": "莖", "a": 0}, {"s": "根", "a": 1}, {"s": "種子", "a": 2}, {"s": "花", "a": 0}, {"s": "葉", "a": 0}, {"s": "果實", "a": 0}], "why": "莖、葉、花、果實容易直接觀察；根要挖開泥土；種子要剖開果實。"},
    {"l": "第一單元活動一 植物是什麼", "lv": 3, "ext": true, "u": "素養題組", "q": "你應該怎麼提醒弟弟？", "o": ["這些是有毒植物，不要碰汁液、不要放進嘴巴，摸過要洗手", "可以放進嘴巴，嚐一口沒關係", "應該把它們全部拔掉", "看一眼就會中毒，要馬上跑開"], "a": 0, "why": "黃金葛、姑婆芋是課本介紹的有毒植物。只要避免觸摸汁液或食用，摸過後洗手，就不會受到傷害。", "trap": {"2": "有毒植物不用拔掉，了解特性、避免碰汁液或食用就好，還能美化環境。", "3": "看一眼不會中毒，只要不碰汁液、不吃就好。"}, "ctx": "弟弟在公園看到<b>黃金葛</b>和<b>姑婆芋</b>，想摘葉子來玩，還想放進嘴巴咬咬看。"},
    {"l": "第一單元活動一 植物是什麼", "lv": 2, "ext": true, "u": "推理", "q": "長春花的果實成熟後裂開，露出黑色的小顆粒。這些小顆粒是什麼？", "o": ["種子", "花粉", "根", "葉子"], "a": 0, "why": "長春花細長夾狀的果實成熟後裂開，露出的黑色小顆粒就是種子，種子在果實裡面。"},
    {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "黑板樹的一個節上長出三片以上的葉子，是輪生。", "a": 0}, {"s": "判斷葉序，要數整株植物總共有幾片葉子。", "a": 1, "why": "葉序要看「一個節」上長幾片葉子，不是數整株。"}, {"s": "喬木和灌木都是木本植物。", "a": 0}, {"s": "鬚根可以深入土壤的深處生長。", "a": 1, "why": "鬚根長在土壤淺層；能深入土壤的是軸根。"}], "why": "葉序看「一個節」：1 片互生、2 片對生、3 片以上輪生。"},
    {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "tf": true, "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "秋天低溫破壞葉綠素，其他色素的顏色就表現出來了。", "a": 0}, {"s": "牽牛花的莖很柔軟，但能自己直立生長。", "a": 1, "why": "牽牛花是藤本莖，無法直立，要依靠其他物體攀爬。能直立的柔軟莖是草本莖。"}, {"s": "仙人掌肥厚的莖，可以儲存水分。", "a": 0}, {"s": "植物吸水實驗用膠泥封住瓶口，是為了把植物固定住。", "a": 1, "why": "膠泥是為了避免水分從瓶口散失，影響實驗結果。"}], "why": "草本莖柔軟「能直立」，藤本莖柔軟「不能直立」，這是常考的陷阱。"},
    {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 3, "ext": true, "u": "配合題・莖的種類", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 木本莖", "乙 草本莖", "丙 藤本莖"], "parts": [{"s": "木棉", "a": 0}, {"s": "長春花", "a": 1}, {"s": "絲瓜", "a": 2}, {"s": "樟樹", "a": 0}, {"s": "大花咸豐草", "a": 1}, {"s": "牽牛花", "a": 2}], "why": "木本莖：木棉、樟樹、小葉欖仁；草本莖：長春花、大花咸豐草；藤本莖：牽牛花、絲瓜。"},
    {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 3, "ext": true, "u": "配合題・莖的特徵", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 木本莖", "乙 草本莖", "丙 藤本莖"], "parts": [{"s": "外觀粗壯，摸起來很堅硬", "a": 0}, {"s": "矮小但能直立，向四面八方長出很多枝條", "a": 1}, {"s": "無法直立，要依靠其他物體攀爬", "a": 2}, {"s": "有些表面有瘤刺", "a": 0}, {"s": "直立高大，不容易被其他植物遮住陽光", "a": 0}], "why": "木本莖粗硬、直立高大；草本莖細軟但能直立、枝條多；藤本莖細軟、要攀爬。"},
    {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 3, "ext": true, "u": "配合題・特別的根", "t": "multi", "legend": true, "q": "請幫每一小題選出正確的代號。", "o": ["甲 塊根", "乙 氣生根", "丙 板根"], "parts": [{"s": "甘藷（地瓜）", "a": 0}, {"s": "印度橡膠樹", "a": 1}, {"s": "銀葉樹", "a": 2}, {"s": "可以儲存水分和養分", "a": 0}, {"s": "可以吸收空氣中的水分", "a": 1}, {"s": "擴展抓地面積，避免傾倒", "a": 2}], "why": "甘藷的塊根儲存水分和養分；印度橡膠樹的氣生根吸收空氣中的水分；銀葉樹的板根擴展抓地面積。"},
    {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 2, "ext": true, "u": "看圖・葉序", "q": "這根枝條的葉序是哪一種？", "o": ["互生", "對生", "輪生"], "a": 1, "why": "看一個節（深綠色小點）上長幾片葉子：這裡每個節長 2 片，是對生，例如桂花、福木。", "img": "<svg viewBox=\"0 0 200 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"200\" height=\"230\" rx=\"14\" fill=\"#F4FBF2\"/><path d=\"M100 220 L100 20\" stroke=\"#6B8F4E\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"50\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"44\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-20 130 44)\"/><ellipse cx=\"70\" cy=\"44\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(20 70 44)\"/><circle cx=\"100\" cy=\"105\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"99\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-20 130 99)\"/><ellipse cx=\"70\" cy=\"99\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(20 70 99)\"/><circle cx=\"100\" cy=\"160\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"154\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-20 130 154)\"/><ellipse cx=\"70\" cy=\"154\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(20 70 154)\"/></svg>", "keep": true},
    {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 2, "ext": true, "u": "看圖・葉序", "q": "下面哪一張圖是「互生」？", "o": ["<div><svg viewBox=\"0 0 200 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"200\" height=\"230\" rx=\"14\" fill=\"#F4FBF2\"/><path d=\"M100 220 L100 20\" stroke=\"#6B8F4E\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"50\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"44\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-20 130 44)\"/><circle cx=\"100\" cy=\"105\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"70\" cy=\"99\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(20 70 99)\"/><circle cx=\"100\" cy=\"160\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"154\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-20 130 154)\"/></svg></div>", "<div><svg viewBox=\"0 0 200 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"200\" height=\"230\" rx=\"14\" fill=\"#F4FBF2\"/><path d=\"M100 220 L100 20\" stroke=\"#6B8F4E\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"50\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"44\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-20 130 44)\"/><ellipse cx=\"70\" cy=\"44\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(20 70 44)\"/><circle cx=\"100\" cy=\"105\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"99\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-20 130 99)\"/><ellipse cx=\"70\" cy=\"99\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(20 70 99)\"/><circle cx=\"100\" cy=\"160\" r=\"5\" fill=\"#4E6B37\"/><ellipse cx=\"130\" cy=\"154\" rx=\"34\" ry=\"13\" fill=\"#7CC47A\" stroke=\"#3B     {"l": "第一單元活動二 植物如何獲取陽光和水", "lv": 3, "ext": true, "u": "看圖・植物吸水", "q": "把黃金葛的根泡在水裡，用紅筆畫出水位，再用膠泥封住瓶口（如圖）。一星期後，水位最可能怎樣？", "o": ["比紅線高", "和紅線一樣高", "比紅線低"], "a": 2, "why": "植物的根會吸收水分，所以水位會下降，比紅線低。", "img": "<svg viewBox=\"0 0 220 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"220\" height=\"260\" rx=\"14\" fill=\"#F2F8FF\"/><path d=\"M70 110 L70 240 L150 240 L150 110 Q150 96 130 92 L90 92 Q70 96 70 110Z\" fill=\"#E6F2FF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M72 150 L148 150 L148 238 L72 238Z\" fill=\"#9CCBF2\"/><line x1=\"60\" y1=\"150\" x2=\"160\" y2=\"150\" stroke=\"#E5484D\" stroke-width=\"4\"/><text x=\"166\" y=\"156\" font-size=\"15\" fill=\"#E5484D\" font-weight=\"700\">紅線</text><path d=\"M110 92 L110 200 M110 200 q-12 20 -20 30 M110 200 q10 18 18 32\" stroke=\"#C9A35A\" stroke-width=\"3\" fill=\"none\"/><rect x=\"86\" y=\"80\" width=\"48\" height=\"16\" rx=\"6\" fill=\"#E07A5F\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"140\" y=\"112\" font-size=\"14\" fill=\"#6E6290\">膠泥封口</text><ellipse cx=\"80\" cy=\"50\" rx=\"16\" ry=\"28\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(-40 80 50)\"/><ellipse cx=\"138\" cy=\"50\" rx=\"16\" ry=\"28\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(40 138 50)\"/><ellipse cx=\"110\" cy=\"38\" rx=\"16\" ry=\"28\" fill=\"#7CC47A\" stroke=\"#3B3355\" stroke-width=\"2\" transform=\"rotate(0 110 50)\"/></svg>", "keep": true},

    {"l": "第一課 在天晴了的時候", "lv": 2, "u": "形近字", "q": "「從高處直瀉而下的水流」是「（　）布」，括號裡應填哪個字？", "o": ["瀑", "曝", "爆", "暴"], "a": 0, "why": "瀑布有水，所以是水部的「瀑」；曬太陽的「曝」是日部；「爆」是火部。"},
    {"l": "第一課 在天晴了的時候", "lv": 2, "u": "形近字", "q": "「衣服拿到太陽下（　）曬」，括號裡應填哪個字？", "o": ["曝", "瀑", "爆", "暴"], "a": 0, "why": "在陽光下曬，用日部的「曝」。"},
    {"l": "第一課 在天晴了的時候", "lv": 2, "u": "形近字", "q": "「空氣中懸浮煙塵微粒，天色陰暗混濁」叫做什麼？", "o": ["霾", "霧", "霜", "露"], "a": 0, "why": "霾是煙塵微粒；霧是空氣中微小水滴凝結。", "trap": {"1": "霧是小水滴，霾是煙塵微粒，兩個不一樣。"}},
    {"l": "第一課 在天晴了的時候", "lv": 2, "u": "語意", "q": "「在天晴了的時候」比「在天晴的時候」多了一個「了」，表示什麼？", "o": ["天氣由雨天轉為雨過初晴", "天氣一直都很晴朗", "又開始下雨了", "天色已經黑了"], "a": 0, "why": "「了」表示狀態改變：原本下雨，現在剛放晴。"},
    {"l": "第一課 在天晴了的時候", "lv": 2, "u": "句式", "q": "「到小徑中去走走吧！在天晴了的時候」是哪一種句式？", "o": ["倒裝句", "疑問句", "排比句", "設問句"], "a": 0, "why": "原本順序是「在天晴了的時候，到小徑中去走走吧！」，前後對調是倒裝。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "u": "寫作手法", "q": "第一段景物描寫的順序是什麼？", "o": ["由下而上：泥路→小草→小白菊→木葉間的鳳蝶", "由上而下：雲→鳳蝶→小白菊→泥路", "由遠而近：山→溪→路→草", "依照時間：早上→中午→晚上"], "a": 0, "why": "第一段從地上的泥路寫到小草、小白菊，再往上寫到樹葉間的鳳蝶，是由下而上。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "u": "主旨", "q": "這首詩主要想表達什麼？", "o": ["雨過初晴是走到戶外、感受天地生機的好時機", "雨中漫步讓人覺得淒涼", "烈日下要待在家裡", "陰天最適合一個人出門"], "a": 0, "why": "詩人邀請大家在雨過天晴時走進自然，感受萬物一新的閒適。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "u": "寫作手法", "q": "作者兩次使用「閒遊」，有什麼作用？", "o": ["前後呼應，凸顯自在閒適的感覺", "為了湊字數", "表示作者很無聊", "表示天氣不好"], "a": 0, "why": "鳳蝶閒遊、雲影也閒遊，前後呼應，點出全詩自在悠閒的情境。"},
    {"l": "第一課 在天晴了的時候", "lv": 2, "ext": true, "u": "短文填字（考卷題型）", "t": "multi", "q": "短文裡括號中的注音，正確的國字是哪一個？", "ctx": "颱風過後，連日的陰<b>（ㄇㄞˊ）</b>終於散去。我和弟弟<b>（ㄕㄜˋ）</b>水走過小溪，看見溪面在風中泛起一圈圈<b>（ㄩㄣˋ）</b>皺。路邊的小白菊不再膽<b>（ㄑㄩㄝˋ）</b>，花瓣上的<b>（ㄔㄣˊ）</b>垢也都被雨水洗淨了。", "o": null, "parts": [{"s": "陰（ㄇㄞˊ）", "o": ["霾", "埋", "買"], "a": 0, "why": "陰霾：雨部的「霾」。"}, {"s": "（ㄕㄜˋ）水", "o": ["涉", "步", "設"], "a": 0, "why": "涉水：渡水，水部的「涉」。"}, {"s": "（ㄩㄣˋ）皺", "o": ["暈", "運", "韻"], "a": 0, "why": "暈皺：日部的「暈」。"}, {"s": "膽（ㄑㄩㄝˋ）", "o": ["怯", "卻", "缺"], "a": 0, "why": "膽怯：心部的「怯」。"}, {"s": "（ㄔㄣˊ）垢", "o": ["塵", "陳", "沉"], "a": 0, "why": "塵垢：土部的「塵」。"}], "why": "看注音寫國字時，先想詞語的意思，再決定部首：天氣用雨部、水有關用水部、心情用心部、灰土用土部。", "perpart": true},
    {"l": "第一課 在天晴了的時候", "lv": 2, "ext": true, "u": "改錯字（考卷題型）", "t": "multi", "q": "下面這句話裡有一個錯字。", "ctx": "「窗臺上積滿了厚厚的塵后，看起來很久沒人打掃了。」", "o": null, "perpart": true, "why": "「塵垢」的「垢」是土部，指髒汙；「后」是王后的后。", "parts": [{"s": "哪一個字寫錯了？", "o": ["積", "塵", "后", "掃"], "a": 2, "keep": true}, {"s": "應該改成哪一個字？", "o": ["垢", "詬", "後"], "a": 0}]},
    {"l": "第一課 在天晴了的時候", "lv": 2, "ext": true, "u": "改錯字（考卷題型）", "q": "「夏天陽光很強，把棉被拿出去爆曬一下就乾了。」句中的錯字應該改成什麼？", "o": ["曝", "瀑", "暴", "抱"], "a": 0, "why": "在太陽下曬是「曝曬」，日部；「爆」是火部，表示爆炸。"},
    {"l": "第一課 在天晴了的時候", "lv": 2, "ext": true, "u": "讀音相同", "q": "下列哪一組「」中的字，讀音相同？", "o": ["「曝」曬／「瀑」布", "「暈」車／「暈」皺", "「涉」水／「步」道", "陰「霾」／濃「霧」"], "a": 0, "why": "曝、瀑都讀 ㄆㄨˋ。暈車 ㄩㄣ／暈皺 ㄩㄣˋ；涉 ㄕㄜˋ／步 ㄅㄨˋ；霾 ㄇㄞˊ／霧 ㄨˋ。", "trap": {"1": "同一個「暈」字，在這兩個詞裡讀音不同喔。"}},
    {"l": "第一課 在天晴了的時候", "lv": 3, "ext": true, "u": "字義相同", "q": "下列哪一個「涉」的意思，和「涉過溪流」的「涉」相同？", "o": ["跋山「涉」水", "「涉」及", "「涉」獵", "「涉」世未深"], "a": 0, "why": "跋山涉水的涉是走路渡水；涉及是牽連；涉獵是瀏覽；涉世是經歷。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "ext": true, "u": "摹寫判斷", "q": "下列哪一句使用的感官摹寫，和其他三句「不同」？", "o": ["給雨潤過的泥路，一定是涼爽又溫柔", "炫耀著新綠的小草", "把牠的飾彩的智慧書頁", "看山間移動的暗綠"], "a": 0, "why": "「涼爽又溫柔」是觸覺；其他三句寫顏色、樣子，是視覺摹寫。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "ext": true, "u": "修辭配合題", "t": "multi", "q": "請幫每一小題選出正確的代號。", "o": ["甲 擬人", "乙 譬喻", "丙 對偶"], "parts": [{"s": "新陽推開了陰霾了", "a": 0}, {"s": "赤著腳，攜著手", "a": 2}, {"s": "把牠的飾彩的智慧書頁，曝著陽光一開一收", "a": 1}, {"s": "不再膽怯的小白菊，慢慢的抬起它們的頭", "a": 0}, {"s": "踏著新泥，涉過溪流", "a": 2}], "why": "擬人：把景物寫得像人（推開、膽怯、抬頭）；譬喻：把翅膀比作書頁；對偶：字數相等、詞性相對的兩句。", "legend": true},
    {"l": "第一課 在天晴了的時候", "lv": 2, "ext": true, "u": "標點符號", "q": "關於本課的標點符號，下列敘述哪一個「錯誤」？", "o": ["「——雲的腳跡——」的破折號表示聲音拉長", "「該到小徑中去走走：」的冒號用來總起下文", "「到小徑中去走走吧！」的驚嘆號帶有熱情邀請的語氣", "「——雲的腳跡——」的破折號用來補充說明「暗綠」"], "a": 0, "why": "這對破折號是夾注，用來補充說明，不是聲音拉長。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "ext": true, "u": "照樣造句", "q": "哪一句的句型和「給雨潤過的泥路，一定是涼爽又溫柔」相同？", "o": ["被汗浸溼的衣服，一定是潮溼又沉重", "衣服溼了，變得很重", "泥路很涼爽，也很溫柔", "我喜歡走在溫柔的泥路上"], "a": 0, "why": "句型是「被（給）……過的＋名詞，一定是＋形容詞＋又＋形容詞」。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "ext": true, "u": "短語結構", "q": "「炫耀著新綠的小草」是「動詞＋著＋形容詞＋的＋名詞」。下列哪一個結構相同？", "o": ["舒展著嫩綠的細芽", "俯瞰田野的老鷹", "一盆茂盛的植栽", "慢慢的抬起頭"], "a": 0, "why": "舒展（動詞）＋著＋嫩綠（形容詞）＋的＋細芽（名詞）。「俯瞰田野的老鷹」是「動詞＋名詞＋的＋名詞」。"},
    {"l": "第一課 在天晴了的時候", "lv": 3, "ext": true, "u": "閱讀推論", "q": "小白菊「試試寒，試試暖，然後一瓣瓣的綻透」，表現出什麼？", "o": ["花朵小心試探天氣，再慢慢完全開放的樣子", "花怕冷，所以一直不肯開", "天氣忽冷忽熱，讓花凋謝了", "作者把花摘下來"], "a": 0, "why": "用擬人寫小白菊試探冷暖，最後一瓣一瓣完全綻開，充滿生機。"},
    {"l": "第二課 珍珠鳥", "lv": 1, "u": "作者與文體", "q": "〈珍珠鳥〉的作者是誰？", "o": ["馮驥才", "戴望舒", "杜甫", "白居易"], "a": 0, "why": "〈珍珠鳥〉是馮驥才的作品。"},

    {"l": "第二課 珍珠鳥", "lv": 1, "u": "課文內容", "q": "有人說珍珠鳥是一種什麼樣的鳥？", "o": ["怕人的鳥", "很兇的鳥", "會說話的鳥", "不會飛的鳥"], "a": 0, "why": "「有人說，這是一種怕人的鳥。」"},

    {"l": "第二課 珍珠鳥", "lv": 1, "u": "課文內容", "q": "聽到藤蔓裡傳出幼鳥的叫聲，作者怎麼做？", "o": ["沒有掀開葉片往裡看", "馬上掀開來看", "拿相機拍照", "把幼鳥送給朋友"], "a": 0, "why": "作者沒有掀開葉片，連添食加水時也不直視，以免嚇到牠們。"},
    {"l": "第二課 珍珠鳥", "lv": 1, "u": "課文內容", "q": "小珍珠鳥第一次從葉間探出小腦袋，是在多久以後？", "o": ["三個月後", "一個月後", "一年後", "一星期後"], "a": 0, "why": "「三個月後，忽然有一小腦袋從葉間探出來。」"},
    {"l": "第二課 珍珠鳥", "lv": 1, "u": "課文內容", "q": "小珍珠鳥的樣子是什麼？", "o": ["紅嘴紅腳，灰藍色的毛，還沒有生出圓圓白點", "全身白色", "黑嘴黑腳", "黃色的羽毛"], "a": 0, "why": "牠像父母一樣紅嘴紅腳、灰藍色的毛，只是尚未生出珍珠似的圓圓白點。"},

    {"l": "第二課 珍珠鳥", "lv": 1, "u": "課文內容", "q": "小珍珠鳥在屋裡玩時，只要大鳥在籠裡生氣的叫一聲，牠會怎樣？", "o": ["立即飛回籠裡去", "飛出窗外", "躲到書架後面", "叫得更大聲"], "a": 0, "why": "「只要大鳥在籠子裡生氣的叫一聲，牠立即飛回籠裡去。」"},
    {"l": "第二課 珍珠鳥", "lv": 1, "u": "課文內容", "q": "打開窗子時，小珍珠鳥會怎樣？", "o": ["最多只在窗框上站一會兒，絕不飛出去", "馬上飛走", "躲進籠子", "停在作者頭上"], "a": 0, "why": "作者不去理會牠，久了即使打開窗子，牠也絕不飛出去。"},
    {"l": "第二課 珍珠鳥", "lv": 1, "u": "課文內容", "q": "小珍珠鳥蹦到作者的杯子上做什麼？", "o": ["俯下頭來喝茶", "洗澡", "睡覺", "啄杯子"], "a": 0, "why": "牠蹦到杯子上，俯下頭來喝茶，再偏過臉看看作者的反應。"},

    {"l": "第二課 珍珠鳥", "lv": 1, "u": "主旨", "q": "作者最後寫下的感受是什麼？", "o": ["信賴，往往能創造出美好的境界", "小鳥都很怕人", "養鳥很麻煩", "鳥應該關在籠子裡"], "a": 0, "why": "「信賴，往往能創造出美好的境界。」"},

    {"l": "第二課 珍珠鳥", "lv": 1, "u": "詞語", "q": "「不動聲色」是什麼意思？", "o": ["心裡的感受不表現出來，從容冷靜", "大聲叫喊", "動作很大", "臉色很難看"], "a": 0, "why": "不動聲色：內心情感不表現在言語動作上。"},

    {"l": "第二課 珍珠鳥", "lv": 1, "u": "生字部首", "q": "「免」的部首是什麼？", "o": ["儿", "刀", "口", "丿"], "a": 0, "why": "免：儿部，總共 7 畫。"},
    {"l": "第二課 珍珠鳥", "lv": 1, "u": "生字部首", "q": "「顫」總共幾畫？", "o": ["22 畫", "13 畫", "20 畫", "21 畫"], "a": 0, "why": "顫：頁部，部首外 13 畫，總共 22 畫。", "trap": {"1": "13 畫是部首外的筆畫，還要加上「頁」的 9 畫。"}},
    {"l": "第二課 珍珠鳥", "lv": 2, "u": "形近字", "q": "「比賽的（　）判」，括號裡應填哪個字？", "o": ["裁", "栽", "載", "哉"], "a": 0, "why": "裁判的「裁」下面是衣；種植的「栽」下面是木。"},
    {"l": "第二課 珍珠鳥", "lv": 2, "u": "形近字", "q": "「（　）山遍野」，括號裡應填哪個字？", "o": ["漫", "蔓", "慢", "曼"], "a": 0, "why": "漫山遍野：到處都是，用水部的「漫」；藤蔓用艸部的「蔓」。"},
    {"l": "第二課 珍珠鳥", "lv": 2, "u": "形近字", "q": "「羨（　）」，括號裡應填哪個字？", "o": ["慕", "暮", "幕", "募"], "a": 0, "why": "羨慕是心裡嚮往，下面是「㣺」；暮色的「暮」下面是日；簾幕的「幕」下面是巾。"},
    {"l": "第二課 珍珠鳥", "lv": 2, "u": "形近字", "q": "「投筆從（　）」，括號裡應填哪個字？", "o": ["戎", "絨", "賊", "戒"], "a": 0, "why": "從戎是當兵，用「戎」；絨毛的「絨」是糸部。"},
    {"l": "第二課 珍珠鳥", "lv": 2, "u": "一字多義", "q": "「賴床」的「賴」是什麼意思？", "o": ["延宕停留", "信任、倚靠", "推諉誣指", "好、不差"], "a": 0, "why": "賴床是拖延不起床。信賴、仰賴的「賴」才是信任倚靠。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "u": "結構", "q": "小珍珠鳥和作者的關係，是怎麼一步步改變的？", "o": ["初識→熟悉→親近→信賴", "信賴→親近→熟悉→初識", "熟悉→初識→信賴→親近", "一開始就很親近"], "a": 0, "why": "從初識、熟悉、親近，到最後在肩頭熟睡的信賴。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "u": "結構", "q": "小珍珠鳥活動的地方，依序是哪裡？", "o": ["籠子四周→屋裡（櫃頂、書架）→書桌→作者的肩頭", "肩頭→書桌→籠子→屋外", "書桌→籠子→窗外→樹林", "只在籠子裡"], "a": 0, "why": "空間由籠子四周、屋內各處，到書桌、稿紙，最後落在作者肩頭。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "u": "閱讀推論", "q": "從哪一個細節最能看出作者懂得愛護動物？", "o": ["聽到幼鳥叫聲，不掀開葉片窺看", "打開鳥籠讓鳥飛走", "每天把鳥抓出來玩", "用手指戳小鳥"], "a": 0, "why": "作者克制好奇心，連添食加水都不直視，怕嚇到牠們。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "u": "寫作手法", "q": "開頭說珍珠鳥「怕人」，結尾小鳥卻在作者肩頭熟睡。這是什麼寫作手法？", "o": ["對比", "譬喻", "誇飾", "排比"], "a": 0, "why": "用「怕人」和「安心熟睡」形成強烈對比，突顯信賴的可貴。"},
    {"l": "第二課 珍珠鳥", "lv": 2, "ext": true, "u": "短文填字（考卷題型）", "t": "multi", "q": "短文裡括號中的注音，正確的國字是哪一個？", "ctx": "陽臺上那盆植<b>（ㄗㄞ）</b>長得異常茂盛，<b>（ㄊㄥˊ）</b>蔓爬滿了窗框。傍晚天色入<b>（ㄇㄨˋ）</b>，小鳥從籠子的縫<b>（ㄒㄧˋ）</b>鑽進去，安心的睡了。我們漸漸熟<b>（ㄒㄧ）</b>了，牠也越來越信<b>（ㄌㄞˋ）</b>我。", "o": null, "parts": [{"s": "植（ㄗㄞ）", "o": ["栽", "裁", "載"], "a": 0, "why": "植栽是種植的植物，下面是「木」。"}, {"s": "（ㄊㄥˊ）蔓", "o": ["藤", "騰", "謄"], "a": 0, "why": "藤蔓是植物，用艸部的「藤」。"}, {"s": "入（ㄇㄨˋ）", "o": ["暮", "幕", "慕"], "a": 0, "why": "暮是傍晚，下面是「日」。"}, {"s": "縫（ㄒㄧˋ）", "o": ["隙", "細", "係"], "a": 0, "why": "縫隙是裂縫，用阜部的「隙」。"}, {"s": "熟（ㄒㄧ）", "o": ["悉", "惜", "習"], "a": 0, "why": "熟悉：心部的「悉」。"}, {"s": "信（ㄌㄞˋ）", "o": ["賴", "籟", "瀨"], "a": 0, "why": "信賴：貝部的「賴」。"}], "why": "形近字靠意思判斷：種植→木、傍晚→日、裂縫→阜、知道明白→心、倚靠→貝。", "perpart": true},
    {"l": "第二課 珍珠鳥", "lv": 2, "ext": true, "u": "改錯字（考卷題型）", "q": "「經過老師細心的指導，我對這套軟體越來越熟番了。」句中的錯字應改成什麼？", "o": ["悉", "習", "惜", "翻"], "a": 0, "why": "熟悉：心部的「悉」。「番」是三番兩次的番。"},
    {"l": "第二課 珍珠鳥", "lv": 2, "ext": true, "u": "改錯字（考卷題型）", "q": "「小貓的胸前長著長長的賊毛，摸起來好柔軟。」句中的錯字應改成什麼？", "o": ["絨", "戎", "茸", "容"], "a": 0, "why": "絨毛：糸部的「絨」；「賊」是小偷。"},
    {"l": "第二課 珍珠鳥", "lv": 2, "ext": true, "u": "讀音相同", "q": "下列哪一組「」中的字，讀音相同？", "o": ["「暮」色／羨「慕」", "植「栽」／「裁」判", "「絨」毛／「賊」頭", "「添」加／「舔」一口"], "a": 0, "why": "暮、慕都讀 ㄇㄨˋ。栽 ㄗㄞ／裁 ㄘㄞˊ；絨 ㄖㄨㄥˊ／賊 ㄗㄟˊ；添 ㄊㄧㄢ／舔 ㄊㄧㄢˇ。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "ext": true, "u": "字義相同", "q": "下列哪一個「賴」的意思，和「仰賴」的「賴」相同？", "o": ["信「賴」", "「賴」床", "誣「賴」", "還不「賴」"], "a": 0, "why": "仰賴、信賴都是倚靠、信任。賴床是拖延；誣賴是冤枉別人；不賴是不錯。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "ext": true, "u": "句型", "q": "下列哪一句「先是……然後……再……」用得正確？", "o": ["弟弟先是把書包放好，然後去洗手，再坐下來寫功課", "弟弟先是很高，然後很胖，再很帥", "先是因為下雨，然後所以比賽取消，再好", "弟弟先是寫完功課，然後先是去洗澡"], "a": 0, "why": "「先是……然後……再……」用來寫連續、有順序的動作。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "ext": true, "u": "句型", "q": "下列哪一句「起先……隨後……」用得正確？", "o": ["起先他只敢在岸邊踢水，隨後才慢慢游到深水區", "起先下雨了，隨後所以比賽取消", "起先他很努力，隨後雖然失敗", "起先隨後，他去上學"], "a": 0, "why": "「起先……隨後……」表示事情先後發展的順序。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "ext": true, "u": "修辭配合題", "t": "multi", "q": "請幫每一小題選出正確的代號。", "o": ["甲 視覺摹寫", "乙 聽覺摹寫", "丙 譬喻"], "parts": [{"s": "從中傳出又細又亮的叫聲", "a": 1}, {"s": "整個身子好像一顆鬆軟的球兒", "a": 2}, {"s": "銀灰色的眼皮蓋住了眸子", "a": 0}, {"s": "跳動的小紅爪子在紙上發出細微的嚓嚓聲響", "a": 1}, {"s": "一半成了黑影，一半被照透，色彩交雜", "a": 0}], "why": "看到顏色、光影是視覺；聽到聲音是聽覺；用「好像、似的」把一樣東西比作另一樣，是譬喻。", "legend": true},
    {"l": "第二課 珍珠鳥", "lv": 3, "ext": true, "u": "閱讀推論", "q": "「我手中的筆不覺停了，生怕嚇跑牠。」這句話表現出作者什麼樣的心情？", "o": ["怕驚擾小鳥，珍惜牠的信任", "不想再寫作了", "自己很害怕小鳥", "手寫得太累了"], "a": 0, "why": "小鳥落在肩上，作者連筆都不敢動，表現愛護和珍惜。"},
    {"l": "第二課 珍珠鳥", "lv": 3, "ext": true, "u": "主旨應用", "q": "下列哪一個情境，最符合「信賴，往往能創造出美好的境界」？", "o": ["新同學起初怕生，大家耐心陪伴、不勉強他，後來他主動加入遊戲", "比賽輸了，大家互相責怪", "弟弟偷吃餅乾，被媽媽處罰", "下雨天大家都待在家裡"], "a": 0, "why": "就像作者不驚擾小鳥、給牠空間，慢慢建立信任，才有美好的結果。"},
    {"l": "第三課 客至", "lv": 1, "u": "作者與文體", "q": "〈客至〉的作者是誰？", "o": ["杜甫", "李白", "戴望舒", "馮驥才"], "a": 0, "why": "〈客至〉是唐代詩人杜甫的作品。"},
    {"l": "第三課 客至", "lv": 1, "u": "作者與文體", "q": "杜甫被後世尊稱為什麼？", "o": ["詩聖", "詩仙", "詩佛", "詩鬼"], "a": 0, "why": "杜甫被尊為「詩聖」，作品反映現實社會，被稱為「詩史」。", "trap": {"1": "「詩仙」是李白喔。"}},
    {"l": "第三課 客至", "lv": 1, "u": "作者與文體", "q": "〈客至〉屬於哪一種詩體？", "o": ["七言律詩", "五言絕句", "現代詩", "七言絕句"], "a": 0, "why": "每句七個字、共八句，是七言律詩。", "trap": {"3": "絕句只有四句，〈客至〉有八句。"}},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「舍南舍北皆春水」的「舍」是什麼意思？", "o": ["房屋，指杜甫的草堂", "放棄", "宿舍的老師", "市集"], "a": 0, "why": "舍是房屋，這裡指杜甫在成都的草堂。"},
    {"l": "第三課 客至", "lv": 1, "u": "課文內容", "q": "平日只看見什麼每天飛來？", "o": ["群鷗（成群的水鳥）", "客人", "鄰家老翁", "蝴蝶"], "a": 0, "why": "「但見群鷗日日來」：只看到成群的水鳥天天飛來。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「花徑」是什麼意思？", "o": ["長滿花草的小路", "花瓶", "花園的大門", "花朵的直徑"], "a": 0, "why": "花徑是長滿花草的小路。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「花徑不曾緣客掃」的「緣」是什麼意思？", "o": ["因為", "邊緣", "綠色", "緣分"], "a": 0, "why": "緣＝因為、由於。花徑不曾因為客人來而打掃。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「蓬門」是什麼意思？", "o": ["用蓬草編成的門，形容房屋簡陋", "豪華的大門", "城門", "寺廟的門"], "a": 0, "why": "蓬門是用蓬草編成的門，表示房子很簡陋。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「蓬門今始為君開」的「君」指誰？", "o": ["對客人的尊稱", "皇帝", "作者自己", "鄰家老翁"], "a": 0, "why": "君是對客人的尊稱。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「盤飧」是什麼意思？", "o": ["盤中的菜餚", "盤子", "酒杯", "市集"], "a": 0, "why": "飧是煮熟的飯菜，盤飧就是盤中的菜餚。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「無兼味」是什麼意思？", "o": ["菜色簡單，沒有多種菜", "味道很淡", "菜很鹹", "菜不好吃"], "a": 0, "why": "兼味是多種菜色，「無兼味」形容菜色簡單。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「舊醅」是什麼？", "o": ["存放了一段時間、沒有過濾的酒", "新釀的好酒", "茶", "湯"], "a": 0, "why": "醅是沒有過濾的酒；舊醅顯出主人家貧與樸質。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「肯與鄰翁相對飲」的「肯」是什麼意思？", "o": ["願意（客氣詢問客人的意思）", "一定", "不要", "已經"], "a": 0, "why": "肯＝願意，帶有向客人客氣徵詢的意思。"},
    {"l": "第三課 客至", "lv": 1, "u": "注釋", "q": "「隔籬呼取盡餘杯」的「盡餘杯」是什麼意思？", "o": ["把剩下的酒全部喝完", "把杯子打破", "把杯子收起來", "再倒滿一杯"], "a": 0, "why": "盡餘杯：把剩下的酒喝光。"},
    {"l": "第三課 客至", "lv": 1, "u": "課文內容", "q": "作者想隔著籬笆叫誰來一起喝酒？", "o": ["隔壁的老翁", "成群的水鳥", "市集的商人", "作者的家人"], "a": 0, "why": "「肯與鄰翁相對飲，隔籬呼取盡餘杯。」"},
    {"l": "第三課 客至", "lv": 1, "u": "生字部首", "q": "「舍」的部首是什麼？", "o": ["舌", "人", "口", "土"], "a": 0, "why": "舍：舌部，總共 8 畫。"},
    {"l": "第三課 客至", "lv": 1, "u": "生字部首", "q": "「飧」的部首是什麼？", "o": ["食", "夕", "人", "良"], "a": 0, "why": "飧：食部，總共 12 畫。"},
    {"l": "第三課 客至", "lv": 1, "u": "生字部首", "q": "「醅」的部首是什麼？", "o": ["酉", "立", "口", "咅"], "a": 0, "why": "醅：酉部，和酒有關，總共 15 畫。"},
    {"l": "第三課 客至", "lv": 1, "u": "生字部首", "q": "「兼」的部首是什麼？", "o": ["八", "一", "又", "彐"], "a": 0, "why": "兼：八部，總共 10 畫。"},
    {"l": "第三課 客至", "lv": 1, "u": "生字部首", "q": "「籬」總共幾畫？", "o": ["25 畫", "19 畫", "24 畫", "23 畫"], "a": 0, "why": "籬：竹部，部首外 19 畫，總共 25 畫。", "trap": {"1": "19 畫是部首外的筆畫，要加上竹部的 6 畫。"}},
    {"l": "第三課 客至", "lv": 2, "u": "形近字", "q": "「依依不（　）」，括號裡應填哪個字？", "o": ["捨", "舍", "舒", "啥"], "a": 0, "why": "捨棄、依依不捨用手部的「捨」；房舍用「舍」。"},
    {"l": "第三課 客至", "lv": 2, "u": "形近字", "q": "「考（　）」，括號裡應填哪個字？", "o": ["慮", "濾", "盧", "虜"], "a": 0, "why": "考慮、思慮用心部的「慮」；過濾用水部的「濾」。"},
    {"l": "第三課 客至", "lv": 2, "u": "形近字", "q": "「（　）伴」，括號裡應填哪個字？", "o": ["陪", "醅", "賠", "培"], "a": 0, "why": "陪伴用阜部的「陪」；醅是酉部，指沒過濾的酒。"},
    {"l": "第三課 客至", "lv": 2, "u": "形近字", "q": "「（　）列商品」，括號裡應填哪個字？", "o": ["陳", "陣", "陝", "東"], "a": 0, "why": "陳列是排列擺設；陣是行列、隊伍，像陣雨、對陣。"},
    {"l": "第三課 客至", "lv": 2, "u": "倒裝句", "q": "「花徑不曾緣客掃」原本的語序應該是什麼？", "o": ["不曾緣客掃花徑", "花徑緣客不曾掃", "客不曾掃花徑", "掃花徑不曾緣客"], "a": 0, "why": "原意是「不曾緣客掃花徑」：不曾因為客人來而打掃花徑。"},
    {"l": "第三課 客至", "lv": 2, "u": "讀音", "q": "「舍南舍北」的「舍」讀什麼？", "o": ["ㄕㄜˋ", "ㄕㄜˇ", "ㄕㄜˊ", "ㄕㄜ"], "a": 0, "why": "房舍的舍讀 ㄕㄜˋ；捨棄的捨讀 ㄕㄜˇ。"},
    {"l": "第三課 客至", "lv": 3, "u": "閱讀推論", "q": "哪一句最能看出作者住的地方清幽、平常很少人來？", "o": ["但見群鷗日日來", "肯與鄰翁相對飲", "隔籬呼取盡餘杯", "樽酒家貧只舊醅"], "a": 0, "why": "平常只有水鳥天天來，表示很少有人造訪。"},
    {"l": "第三課 客至", "lv": 3, "u": "結構", "q": "「盤飧市遠無兼味，樽酒家貧只舊醅」寫的是哪一個部分？", "o": ["待客", "無客", "迎客", "陪客"], "a": 0, "why": "首聯無客、頷聯迎客、頸聯待客、尾聯陪客。這兩句寫準備的菜和酒，是待客。"},
    {"l": "第三課 客至", "lv": 3, "u": "修辭", "q": "〈客至〉中，哪兩聯是對偶句？", "o": ["頷聯和頸聯", "首聯和尾聯", "首聯和頷聯", "只有尾聯"], "a": 0, "why": "「花徑不曾緣客掃／蓬門今始為君開」和「盤飧市遠無兼味／樽酒家貧只舊醅」是對偶。"},
    {"l": "第三課 客至", "lv": 3, "u": "主旨", "q": "〈客至〉全詩傳達出什麼樣的情感？", "o": ["真情流露，自然不造作", "悲傷時事，憂國憂民", "氣勢磅礴，豪放灑脫", "孤單寂寞，不想見人"], "a": 0, "why": "雖然菜少酒舊，主人仍真心熱情的招待客人。"},
    {"l": "第三課 客至", "lv": 2, "ext": true, "u": "結構配合題", "t": "multi", "q": "請幫每一小題選出正確的代號。", "o": ["甲 無客", "乙 迎客", "丙 待客", "丁 陪客"], "parts": [{"s": "舍南舍北皆春水，但見群鷗日日來", "a": 0}, {"s": "花徑不曾緣客掃，蓬門今始為君開", "a": 1}, {"s": "盤飧市遠無兼味，樽酒家貧只舊醅", "a": 2}, {"s": "肯與鄰翁相對飲，隔籬呼取盡餘杯", "a": 3}], "why": "首聯寫平日沒客人；頷聯打掃開門迎接；頸聯準備菜和酒；尾聯找鄰翁一起陪客人喝酒。", "legend": true},
    {"l": "第三課 客至", "lv": 2, "ext": true, "u": "選出錯的", "q": "依據〈客至〉，下列關於作者的描述，哪一個「錯誤」？", "o": ["作者家裡很熱鬧，常常有客人來", "作者特地為客人打掃花徑、打開蓬門", "作者只能準備簡單的菜和舊酒", "作者想請鄰家老翁一起喝酒助興"], "a": 0, "why": "「但見群鷗日日來」「花徑不曾緣客掃」都表示平常很少有客人來。"},
    {"l": "第三課 客至", "lv": 3, "ext": true, "u": "閱讀推論", "q": "作者為什麼說「菜色簡單」？下面哪一個原因「正確」？", "o": ["住家離市集太遠，買菜不方便", "作者不喜歡客人", "客人只吃素", "作者忘記買菜"], "a": 0, "why": "「盤飧市遠無兼味」：離市集遠，所以菜色不多；「樽酒家貧只舊醅」：家裡窮，只有舊酒。"},
    {"l": "第三課 客至", "lv": 3, "ext": true, "u": "閱讀推論", "q": "「花徑不曾緣客掃，蓬門今始為君開」表示什麼？", "o": ["平常很少有客人，這位客人很受重視", "作者很懶惰，從來不打掃", "門壞了，今天才修好", "客人自己打開門走進來"], "a": 0, "why": "平常不曾為誰打掃，今天特地打掃、開門，表示對客人的重視。"},
    {"l": "第三課 客至", "lv": 3, "ext": true, "u": "閱讀推論", "q": "「肯與鄰翁相對飲」中的「肯」，帶有什麼語氣？", "o": ["客氣的詢問客人願不願意", "命令客人一定要喝", "生氣的拒絕", "自言自語"], "a": 0, "why": "肯＝願意。作者先客氣的問客人，願意的話再請鄰翁來。"},
    {"l": "第三課 客至", "lv": 2, "ext": true, "u": "短文填字（考卷題型）", "t": "multi", "q": "短文裡括號中的注音，正確的國字是哪一個？", "ctx": "爺爺住在山腳下的小屋，屋外圍著竹<b>（ㄌㄧˊ）</b>笆。屋子雖然簡<b>（ㄌㄡˋ）</b>，爺爺總是盡其所能招待客人。泡茶前，他會先把茶葉渣過<b>（ㄌㄩˋ）</b>掉，再把點心整齊的<b>（ㄔㄣˊ）</b>列在桌上。", "o": null, "parts": [{"s": "竹（ㄌㄧˊ）", "o": ["籬", "離", "璃"], "a": 0, "why": "籬笆用竹子編成，所以是竹部的「籬」。"}, {"s": "簡（ㄌㄡˋ）", "o": ["陋", "漏", "露"], "a": 0, "why": "簡陋：阜部的「陋」；漏水才用水部的「漏」。"}, {"s": "過（ㄌㄩˋ）", "o": ["濾", "慮", "律"], "a": 0, "why": "過濾和水有關，用水部的「濾」。"}, {"s": "（ㄔㄣˊ）列", "o": ["陳", "陣", "沉"], "a": 0, "why": "陳列是排列擺設。"}], "why": "先想語詞的意思，再選部首：竹編的用竹部、和水有關用水部。", "perpart": true},
    {"l": "第三課 客至", "lv": 2, "ext": true, "u": "改錯字（考卷題型）", "q": "「這間房子雖然簡漏，卻打掃得乾乾淨淨。」句中的錯字應改成什麼？", "o": ["陋", "露", "樓", "落"], "a": 0, "why": "簡陋是房子狹小粗糙，用阜部的「陋」；「漏」是漏水。"},
    {"l": "第三課 客至", "lv": 2, "ext": true, "u": "改錯字（考卷題型）", "q": "「哥哥做事總是深謀遠濾，很少出錯。」句中的錯字應改成什麼？", "o": ["慮", "律", "綠", "旅"], "a": 0, "why": "深謀遠慮是想得很周到，用心部的「慮」。"},
    {"l": "第三課 客至", "lv": 2, "ext": true, "u": "讀音相同", "q": "下列哪一組「」中的字，讀音相同？", "o": ["過「濾」／考「慮」", "房「舍」／不「捨」", "舊「醅」／「陪」伴", "「緣」分／翠「綠」"], "a": 0, "why": "濾、慮都讀 ㄌㄩˋ。舍 ㄕㄜˋ／捨 ㄕㄜˇ；醅 ㄆㄟ／陪 ㄆㄟˊ；緣 ㄩㄢˊ／綠 ㄌㄩˋ。"},
    {"l": "第三課 客至", "lv": 3, "ext": true, "u": "語詞運用", "q": "下列哪一句的語詞用得「正確」？", "o": ["讀著遊子的家書，字裡行間流露出對家人的思念", "這碗泡麵難吃得無與倫比，大家都很喜歡", "他盡其所能的睡了一整天，什麼都沒做", "字裡行間的公園，有很多人在散步"], "a": 0, "why": "字裡行間指文字之間流露的情感。無與倫比是好得沒得比；盡其所能是用盡所有能力。"},
    {"l": "第三課 客至", "lv": 3, "ext": true, "u": "句型", "q": "下列哪一句「因……只好……」用得正確？", "o": ["因颱風來襲，離島航班只好全部取消", "因他很高，只好很聰明", "因只好下雨，我們去露營", "因天氣晴朗，只好去爬山"], "a": 0, "why": "「因……只好……」：因為發生某個原因，不得不做某件事。「天氣晴朗」是好事，不是不得不。"},
