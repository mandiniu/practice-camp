<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練習營">
<meta name="theme-color" content="#F7F0FF">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<title>小學生練習營</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: character panel on top (phones and tablets, any orientation); side-by-side only on wide desktop screens.
   One idol-stage look shared by every grade. */
:root{
  /* 偶像舞台風（所有年級共用）：淡紫底、白卡片、桃粉色重點 */
  --ground:#F7F0FF; --card:#FFFFFF; --soft:#F6EEFF; --ink:#2E2445; --muted:#6E6290; --line:#E6D8F7;
  --accent:#E8408E; --accent-ink:#FFFFFF; --accent2:#7B5CFF;
  --good:#22A06B; --bad:#E5484D; --gold:#C98B0A; --sun:#FFD45C;
  --stage-a:#EFE4FF; --stage-b:#FFE3F1;
  --display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
@media (max-width:1400px){.wrap{grid-template-columns:1fr}}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
h2{color:var(--accent)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

/* side panel */
.side{background:var(--card);border-radius:22px;padding:18px;border:2px solid var(--line);position:sticky;top:12px}
@media (max-width:1400px){
  .side{position:static;display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:16px;align-items:start}
  .brand{grid-column:1/-1}
  #sideBody{display:contents}
  #sideBody>.stage{grid-row:span 6}
  #sideBody>.sub{grid-column:2}
  .side .who{margin-top:12px}
}
@media (max-width:520px){.side{grid-template-columns:130px minmax(0,1fr)}.side .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.side .stat b{font-size:1.1rem}}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--accent)}
.stage{margin-top:12px;background:linear-gradient(var(--stage-a) 0 70%,var(--stage-b) 70%);border-radius:18px;overflow:hidden;display:grid;place-items:center;max-width:100%}
.stage .av{width:86%}
.stage.full .av{width:100%}
.av{display:block;cursor:pointer;transform-origin:50% 92%}
.av svg{display:block;width:100%;height:auto}
.idle{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
.bounce{animation:squish .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1,1)}25%{transform:scale(1.14,.84)}55%{transform:scale(.9,1.12) translateY(-9%)}80%{transform:scale(1.04,.96)}100%{transform:scale(1,1)}}
.droop{animation:droop .9s ease}
@keyframes droop{0%{transform:scale(1)}35%{transform:scale(1.12,.8)}70%{transform:scale(1.08,.86)}100%{transform:scale(1)}}
.who{display:flex;align-items:center;gap:8px;margin-top:12px}
.who input{font:inherit;font-family:var(--display);font-weight:700;font-size:1.2rem;border:2px dashed transparent;border-radius:10px;padding:2px 6px;width:100%;min-width:0;background:transparent;color:var(--ink)}
.who input:hover{border-color:var(--line)}
.chip{flex:none;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:color-mix(in srgb,var(--accent) 18%,var(--card));color:var(--accent)}
.rank{margin-top:10px;background:var(--soft);border-radius:14px;padding:10px 12px}
.rank b{font-family:var(--display);font-size:1.05rem}
.rank p{margin:2px 0 6px;font-size:.82rem;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.coin b{color:var(--gold)}
.medalrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--sun);color:#22313D}
.mini.off{background:transparent;color:var(--muted);border:2px dashed var(--line)}

/* main */
.main{min-width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:22px}
.panel h2{font-size:1.5rem}
.sub{color:var(--muted);margin:4px 0 16px}
.section-t{font-family:var(--display);font-size:1.05rem;margin:20px 0 10px}

.btn{background:var(--ink);color:var(--card);border-radius:12px;padding:10px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.hot{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}

.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.subjects{grid-template-columns:1fr}}
.subj{text-align:left;border-radius:18px;padding:16px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:color-mix(in srgb,var(--c) 16%,var(--card));border:2px solid transparent;transition:transform .15s}
.subj:hover{transform:translateY(-2px);border-color:var(--c)}
.glyph{width:56px;height:56px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.6rem}
.subj h3{font-size:1.2rem}
.subj p{margin:0;font-size:.85rem;color:var(--muted)}
.subj .ver{font-size:.78rem;font-weight:700;color:var(--c);letter-spacing:.04em}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,var(--card));margin:6px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--card));color:var(--c,var(--accent))}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--ink)}
.question{font-family:var(--display);font-size:1.45rem;font-weight:700;margin:18px 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-size:1.1rem;font-weight:500;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 20%,var(--card));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--card));border-color:var(--bad)}
.feedback{margin-top:16px;border-radius:16px;padding:16px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.feedback.good{background:color-mix(in srgb,var(--good) 16%,var(--card))}
.feedback.bad{background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.feedback h3{font-size:1.15rem}
.feedback p{margin:4px 0 0}
.why{background:var(--card);border-radius:10px;padding:10px 12px;margin-top:8px}
.why b{color:var(--accent)}
.note{font-size:.82rem;color:var(--muted)}
@media (max-width:520px){.feedback{grid-template-columns:1fr}.feedback .av{width:64px}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.item .av{width:100%;max-width:130px;cursor:default}
.item h4{font-size:1rem}
.item small{color:var(--muted);font-size:.78rem;line-height:1.4;min-height:2.2em}
.item .btn{width:100%;padding:8px 10px;font-size:.92rem}
.lock{font-size:.78rem;color:var(--bad);font-weight:700}
.slotname{font-size:.72rem;letter-spacing:.08em;color:var(--muted)}

/* designer */
.designer{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px;align-items:start}
@media (max-width:640px){.designer{grid-template-columns:1fr}.designer .stage{max-width:260px;margin-inline:auto}}
.optrow{margin-bottom:14px}
.optrow h4{font-size:.95rem;margin-bottom:8px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.choice{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:7px 14px;font-weight:700}
.choice[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--card))}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{background:var(--soft);border:3px solid transparent;border-radius:18px;padding:10px;text-align:center;font-family:var(--display);font-weight:700}
.pcard .av{cursor:pointer}
.pcard small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:.8rem}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.pcard.locked{opacity:.55}

.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kid{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:18px;padding:10px}
.kid:hover{border-color:var(--accent)}
.kid b{display:block;font-family:var(--display);font-size:1.15rem}
.kid small{color:var(--muted);font-size:.82rem}
.kid .stage{margin:0}
.addkid{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.addkid input{font:inherit;border:2px solid var(--line);border-radius:12px;padding:9px 12px;flex:1 1 180px;min-width:0;background:var(--card);color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.segb{border-radius:10px;padding:7px 14px;font-weight:700;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}

.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.medal{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--soft);border-radius:16px;padding:12px;border:2px solid var(--line)}
.medal .m{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--sun);color:#22313D}
.medal.off .m{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.medal p{margin:0;font-size:.82rem;color:var(--muted)}
.revgroup{background:color-mix(in srgb,var(--c) 14%,var(--card));border-radius:16px;padding:14px;margin-top:12px}
.revgroup ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.revgroup li{background:var(--card);border-radius:10px;padding:8px 10px}
.empty{text-align:center;color:var(--muted)}
.empty .av{width:120px;margin:0 auto}
.result{text-align:center}
.result .av{width:150px;margin:0 auto}
.result .big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--good)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lesson{text-align:left;border-radius:16px;padding:14px;background:var(--soft);border:2px solid var(--line);display:grid;gap:4px}
.lesson:hover{border-color:var(--c)}
.lesson .pill{justify-self:start}
.lesson b{font-family:var(--display);font-size:1.15rem}
.lmeta{font-size:.82rem;color:var(--muted)}
.qtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lvtag{border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:800;color:#fff}
.lvtag.lv2{background:#E5484D}
.lvtag.lv3{background:linear-gradient(90deg,#8E6CFF,#3E8FD6)}
.reqs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:.85rem}
.reqs li{display:grid;grid-template-columns:18px 1fr auto;gap:4px;color:var(--muted)}
.reqs li.ok{color:var(--good)}
.reqs em{font-style:normal;font-variant-numeric:tabular-nums}
.season{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.75rem;font-weight:700;background:#F28C28;color:#fff;margin-left:6px;vertical-align:middle}
.item .season{margin:0}
.season.off{background:var(--line);color:var(--muted)}
.qcount{font-size:.85rem;color:var(--muted);font-weight:700}
.subj.empty-subj{opacity:.6;cursor:default}
.subj.empty-subj:hover{transform:none;border-color:transparent}
.levels{display:grid;gap:6px}
.lvrow{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:12px;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:.9rem;color:var(--muted)}
.lvrow b{font-family:var(--display);color:var(--ink)}
.lvrow.done{background:color-mix(in srgb,var(--good) 14%,var(--card))}
.kidname{font-family:var(--display);font-size:1.25rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip{cursor:pointer;border:none}
.field{font:inherit;width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card);color:var(--ink)}
.cloud{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.cloud[data-state="ok"]{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
.cloud[data-state="error"]{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.furchip{display:inline-flex;align-items:center;gap:6px}
.furchip i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.season.reward{background:var(--accent2)}
.medal .rw{color:var(--accent);font-weight:700;margin-top:2px}
.choice:disabled{opacity:.5;cursor:not-allowed}
#addKid{display:grid;gap:4px}
#addKid .btn{justify-self:start}
.exam{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--card)),color-mix(in srgb,var(--accent2) 10%,var(--card)));border:2px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:18px;padding:16px;margin-bottom:6px}
.exam h3{font-size:1.25rem;color:var(--accent)}
.examscope{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.examscope li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:6px 10px;font-size:.9rem}
.examscope em{font-style:normal;color:var(--muted);font-size:.82rem;text-align:right}
@media (max-width:520px){.examscope li{grid-template-columns:auto 1fr}.examscope em{grid-column:1/-1;text-align:left}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 延伸題：題組、是非、配合、看圖 */
.lvtag.ext{background:linear-gradient(90deg,#F2994A,#E8408E)}
.btn.ext{background:linear-gradient(90deg,#F2994A,#E8408E);color:#fff}
.lesson .lbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.lesson .lbtns .btn{padding:8px 14px;font-size:.95rem}
.bar.ext i{background:linear-gradient(90deg,#F2994A,#E8408E)}
.lvtag.gift{background:linear-gradient(90deg,#14A3B8,#7B5CFF)}
.btn.gift{background:linear-gradient(90deg,#14A3B8,#7B5CFF);color:#fff}
.bar.gift i{background:linear-gradient(90deg,#14A3B8,#7B5CFF)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.8em;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.frx{display:none}
.lesson .reqs{margin-top:2px}
.ctx{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;line-height:1.7;font-size:1.05rem}
.ctx table{border-collapse:collapse;width:100%;margin-top:6px;font-size:.95rem}
.ctx td,.ctx th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.qimg{display:flex;justify-content:center;margin:0 0 14px}
.qimg svg{width:100%;max-width:520px;height:auto}
.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.pics .opt{display:grid;justify-items:center;gap:4px;text-align:center;padding:8px}
.opts.pics .opt svg{width:100%;max-width:220px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.legend span{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.mparts{display:grid;gap:10px}
.mpart{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.mpart.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.mpart.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.ms{font-size:1.08rem;line-height:1.55}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{min-width:52px;border-radius:12px;padding:8px 14px;font-weight:800;font-size:1.05rem;background:var(--card);border:2px solid var(--line);color:var(--ink)}
.mchips.tf .mchip{min-width:72px;font-size:1.2rem}
.mchip.sel{background:var(--accent2);border-color:var(--accent2);color:#fff}
.mchip.ans{box-shadow:0 0 0 3px var(--good)}
.mpart.wrong .mchip.sel:not(.ans){background:var(--bad);border-color:var(--bad)}
.pwhy{font-size:.92rem;background:var(--card);border-radius:10px;padding:6px 10px}
/* 錯題本紀錄 */
.wstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
@media (max-width:520px){.wstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ws{border-radius:14px;padding:10px;text-align:center;background:var(--soft);font-size:.85rem;color:var(--muted);display:grid}
.ws b{font-size:1.5rem;color:var(--ink);font-family:var(--display)}

<script>
// 題庫：只收錄家長上傳的課本資料出的題目。
// 鍵值是「年級+學期」，例如 "3上"。l = 課次，lv = 1 基礎／2 陷阱／3 融會貫通
// 新增課本內容時，只需要替換這個檔案。
window.BANK = {
 "3上":{
  chinese:[
    {l:"第一課 字的小旅行",lv:1,u:"字形組合",q:"心的小船載著「自」己，會變成哪一個字？",o:["息", "您", "忌", "念"],a:0,why:"「自」放在「心」的上面，就變成「息」。課文說小船只載自己，會變得愛休息，小船就停下來不航行了。",trap:{"1": "「您」是心的小船載著「你」。", "2": "「忌」是心上面載「己」，不是「自」。"}},
    {l:"第一課 字的小旅行",lv:1,u:"字形組合",q:"心的小船上面放「己」，會變成哪一個字？",o:["記", "妒", "忌", "己"],a:2,why:"「己」加在「心」的上面就是「忌」，是忌妒的「忌」，心部。",trap:{"1": "「妒」也是忌妒的妒，但它是女部，裡面沒有心。", "0": "「記」是言部，和心沒有關係。"}},
    {l:"第一課 字的小旅行",lv:1,u:"字形組合",q:"心的小船載著「你」，「你」會變成什麼字？",o:["您", "念", "忘", "息"],a:0,why:"「你」的下面加上「心」就是「您」。心上有你，表示尊敬和關心別人，大家一起去看美麗新世界。",trap:{"1": "「念」是「今」加上「心」。"}},
    {l:"第一課 字的小旅行",lv:1,u:"口訣",q:"爺爺的口訣「心是一葉舟」，「一葉舟」是指心字的哪一筆？",o:["三個點", "中間的臥鉤", "第一點", "最後一點"],a:1,why:"心字中間彎彎的那一筆叫「臥鉤」，形狀像一艘小船，就是「一葉舟」；三個點像細雨落在小船的前、中、後。",trap:{"0": "三個點是「細雨」，落在小船的前、中、後。"}},
    {l:"第一課 字的小旅行",lv:1,u:"課文理解",q:"為什麼心的小船「只載自己」不好？",o:["小船太重會沉下去", "會變得愛休息、忌妒別人，快樂就不見了", "爺爺不准", "船上沒有位子"],a:1,why:"只載自己會變成「息」和「忌」：愛休息讓小船停下來，忌妒別人讓心裡不快樂，就看不到美麗的世界。"},
    {l:"第一課 字的小旅行",lv:1,u:"課文理解",q:"心的小船載著「你」，為什麼很好？",o:["因為船比較快", "心裡有別人，彼此關心，一起看美麗新世界", "因為可以休息", "因為不用划船"],a:1,why:"心中有別人，懂得關心和尊重，就能和大家一起航向美麗新世界，這也是這一課的主旨。"},
    {l:"第一課 字的小旅行",lv:1,u:"部首",q:"「航」這個字的部首是什麼？",o:["亢", "舟", "方", "船"],a:1,why:"「航」是舟部，部首外 4 畫，總共 10 畫。和船、飛機行走有關，例如領航、導航。",trap:{"0": "「亢」是右邊表示讀音的部分，不是部首。", "3": "「船」是一個字，不是部首；「航」和「船」的部首都是「舟」。"}},
    {l:"第一課 字的小旅行",lv:1,u:"部首",q:"「灑」這個字的部首是什麼？",o:["西", "鹿", "水（氵）", "雨"],a:2,why:"「灑」是水部，因為灑水、湯灑了都和水有關。部首外 19 畫，總共 22 畫。"},
    {l:"第一課 字的小旅行",lv:1,u:"部首",q:"「妒」這個字的部首是什麼？",o:["戶", "女", "心", "口"],a:1,why:"「妒」是女部，部首外 4 畫，總共 7 畫。注意「忌」才是心部。",trap:{"0": "「戶」是右邊的部分，部首要看左邊的「女」。", "2": "「忌妒」的「忌」才是心部，「妒」是女部。"}},
    {l:"第一課 字的小旅行",lv:1,u:"部首",q:"「失」這個字的部首是什麼？",o:["人", "丿", "大", "夫"],a:2,why:"「失」是大部，部首外 2 畫，總共 5 畫。例如遺失、迷失方向。"},
    {l:"第一課 字的小旅行",lv:1,u:"筆畫",q:"「讓」這個字總共有幾畫？",o:["17 畫", "22 畫", "24 畫", "20 畫"],a:2,why:"「讓」是言部，部首「言」7 畫，加上部首外 17 畫，總共 24 畫。",trap:{"0": "17 畫是「部首外」的筆畫，還要加上「言」的 7 畫。"}},
    {l:"第一課 字的小旅行",lv:1,u:"字義",q:"「記載」的「載」是什麼意思？",o:["用車子裝東西", "記錄", "開車", "下雨"],a:1,why:"「載」有兩個意思：裝運，例如載客、載貨；記錄，例如記載、刊載。「記載」是把事情記錄下來。",trap:{"0": "這是「載客、載貨」的意思，「記載」的載是記錄。"}},
    {l:"第一課 字的小旅行",lv:1,u:"詞語",q:"「忌妒」是什麼意思？",o:["很喜歡別人", "看到別人比自己好，心裡不平、不舒服", "害怕下雨", "很想休息"],a:1,why:"「忌妒」是對才能或運氣比自己好的人心裡不平。課文提醒我們，心裡只想著自己就容易忌妒別人。"},
    {l:"第一課 字的小旅行",lv:1,u:"詞語",q:"「消失」的相反詞是哪一個？",o:["不見", "出現", "遺失", "離開"],a:1,why:"「消失」是不見了，「出現」是產生、顯現出來，兩個意思相反。",trap:{"0": "「不見」和「消失」意思相近，是相似詞。", "2": "「遺失」也是不見了，是相似詞。"}},
    {l:"第一課 字的小旅行",lv:1,u:"成語",q:"「滿載而歸」比喻什麼？",o:["車子太重", "收穫很多", "東西掉光了", "趕快回家"],a:1,why:"「滿載而歸」是裝得滿滿的回來，比喻收穫很豐富。這裡的「載」是裝運的意思。"},
    {l:"第一課 字的小旅行",lv:1,u:"成語",q:"「木已成舟」是什麼意思？",o:["木頭可以做船", "事情已經成定局，沒辦法改變了", "要努力造船", "船是木頭做的"],a:1,why:"木頭已經做成船了，不能再變回木頭，比喻事情已經成為事實，沒辦法改變。成語要看比喻的意思。",trap:{"0": "這是字面的意思，成語要看它比喻什麼。"}},
    {l:"第一課 字的小旅行",lv:1,u:"心部",q:"下面哪個字的「心」寫在左邊，變成「忄」？",o:["愛", "悲", "快", "念"],a:2,why:"「心」在字的左邊時寫成「忄」，例如快、愉。「愛、悲、念」的心都在下面。"},
    {l:"第一課 字的小旅行",lv:1,u:"句型",q:"「小船輕輕走」的句子結構，和哪一句一樣？",o:["烏龜慢慢爬", "細雨灑輕舟", "小鳥在飛", "我愛小船"],a:0,why:"「小船輕輕走」是「名詞＋疊字＋動作」。「烏龜慢慢爬」也是：烏龜（名詞）＋慢慢（疊字）＋爬（動作）。",trap:{"1": "「細雨灑輕舟」是「名詞＋動詞＋名詞」，沒有疊字。"}},
    {l:"第一課 字的小旅行",lv:1,u:"句型",q:"「細雨灑輕舟」的句子結構，和哪一句一樣？",o:["微風輕輕吹", "烈日照大地", "小鳥高高飛", "火車慢慢開"],a:1,why:"「細雨灑輕舟」是「名詞＋動詞＋名詞」：細雨／灑／輕舟。「烈日照大地」是烈日／照／大地，結構一樣。",trap:{"0": "「微風輕輕吹」有疊字，是「小船輕輕走」那種句型。"}},
    {l:"第一課 字的小旅行",lv:1,u:"句型",q:"下面哪一句是「疑問句」？",o:["爺爺教我寫心字。", "小船上要載什麼呢？", "心是一葉舟。", "我們一起去看美麗新世界！"],a:1,why:"疑問句是用疑問的語氣提出問題，句子最後用問號「？」。其他句子是平直說明事情的陳述句，或表達心情的句子。"},
    {l:"第一課 字的小旅行",lv:2,u:"陷阱：「不是」",q:"下面哪一個字「不是」心部？",o:["忌", "念", "您", "妒"],a:3,why:"「妒」是女部。忌、念、您下面都有「心」，是心部。「忌妒」兩個字常常一起出現，但部首不一樣，考試很愛考！",trap:{"0": "「忌」下面有心，是心部喔。看清楚題目問的是「不是」。"}},
    {l:"第一課 字的小旅行",lv:2,u:"陷阱：一字多義",q:"下面哪一句的「載」，和「記載」的「載」意思一樣？",o:["爸爸開車載我上學", "卡車載滿了西瓜", "報紙刊載了比賽結果", "我們滿載而歸"],a:2,why:"「記載、刊載」的載是「記錄」；「載我、載滿、滿載而歸」的載是「裝運」。同一個字在不同詞語裡，意思可能不一樣。",trap:{"3": "「滿載而歸」雖然有載，但這裡是裝得滿滿的意思，是裝運，不是記錄。"}},
    {l:"第一課 字的小旅行",lv:2,u:"陷阱：一字多義",q:"下面哪一句的「讓」，是「謙退、推辭」的意思？",o:["老師讓我們排好隊", "媽媽讓我去買醬油", "遇到該做的事，他當仁不讓", "這首歌讓人想哭"],a:2,why:"「當仁不讓」的讓是謙讓、推辭：遇到該做的事，不推給別人。其他三句的「讓」都是「使、叫」的意思。"},
    {l:"第一課 字的小旅行",lv:2,u:"陷阱：筆畫比較",q:"下面哪一組的兩個字，總筆畫一樣多？",o:["字、舟", "忌、失", "航、讓", "妒、字"],a:0,why:"字 6 畫、舟 6 畫，一樣多。忌 7 畫、失 5 畫；航 10 畫、讓 24 畫；妒 7 畫、字 6 畫。",trap:{"3": "妒是 7 畫，字是 6 畫，差了一畫。"}},
    {l:"第一課 字的小旅行",lv:2,u:"陷阱：部首",q:"「舟」這個字的部首是什麼？",o:["丿", "丶", "舟", "月"],a:2,why:"「舟」本身就是部首，部首外 0 畫，總共 6 畫。有些字自己就是部首，例如舟、心、水。",trap:{"0": "第一筆是撇，但「舟」整個字就是部首，不是撇。"}},
    {l:"第一課 字的小旅行",lv:2,u:"陷阱：句子判斷",q:"課文中的句子，哪一句「不是」疑問句？",o:["只載自己好不好？", "小船上要載什麼呢？", "不好，不好！", "心的小船要載什麼？"],a:2,why:"「不好，不好！」是回答問題、表達強烈語氣的句子，不是在提問。課文先用疑問句問「好不好？」，再用這句回答。"},
    {l:"第一課 字的小旅行",lv:2,u:"陷阱：主旨",q:"〈字的小旅行〉這一課，最想告訴我們什麼？",o:["要學會寫心字", "下雨天不要划船", "心裡要有別人，學會關心和尊重", "休息是不好的"],a:2,why:"課文用「心」字當小船來想像，但真正想說的是：心裡只想著自己會不快樂，心裡有別人才能一起看見美麗的世界。",trap:{"0": "寫心字只是故事的開頭，作者藉著心字說出更重要的道理。", "3": "課文說的是「愛休息、停下不航行」，指的是只顧自己、不想前進，不是說休息不好。"}},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：造新字",q:"照課文的方法，心的小船載著「今」天，會變成哪個字？可能代表什麼？",o:["念：把今天的事記在心裡", "令：命令別人", "吟：大聲唱歌", "今：就是今天"],a:0,why:"「今」放在「心」上面就是「念」，像把今天發生的事、心情放進心裡，所以有想念、記住的意思。"},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：生活推理",q:"小明只想著自己要得第一名，看到同學考得比他好就很生氣。他的「心的小船」像是載了什麼、變成哪個字？",o:["載了「你」，變成「您」", "載了「己」，變成「忌」", "載了「今」，變成「念」", "什麼都沒載"],a:1,why:"只想著自己、看到別人比自己好就不開心，就是「忌妒」。心上放了「己」就變成「忌」，課文說這樣會讓快樂消失。"},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：生活應用",q:"下面哪一個做法，最像課文說的「讓你變成您」？",o:["自己先玩完再說", "看到同學跌倒，主動扶他去健康中心", "把好吃的藏起來", "不理會別人的意見"],a:1,why:"「您」是心上有你：關心、尊重別人。主動幫助跌倒的同學，就是心裡有別人的表現。"},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：寫作手法",q:"作者為什麼把「心」字想像成一艘小船，而不是直接說「要關心別人」？",o:["因為作者喜歡划船", "用有趣的字形想像，讓道理更好懂、更好記", "因為心字很難寫", "因為課本規定要寫船"],a:1,why:"作者把心字的形狀想像成小船，再讓小船載不同的字，變出新字和新的意思。這種有趣的想像，讓「關心別人」的道理更容易記住。"},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：成語應用",q:"小美考試前都沒準備，考完才後悔，媽媽說：「現在說什麼都沒用了。」最適合用哪一個成語？",o:["滿載而歸", "木已成舟", "塞翁失馬", "當仁不讓"],a:1,why:"考試已經考完，結果不能改變了，就是「木已成舟」：木頭已經做成船，事情成為事實無法改變。",trap:{"2": "「塞翁失馬」是壞事後來變成好事，小美的情況沒有變好。"}},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：成語應用",q:"小強沒趕上公車只好走路，結果在路上遇到好久不見的好朋友。這最適合用哪一個成語？",o:["木已成舟", "洋洋灑灑", "塞翁失馬", "投鼠忌器"],a:2,why:"沒趕上公車是損失，卻因此遇到好朋友，是因禍得福，所以是「塞翁失馬」。"},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：成語應用",q:"哥哥去海邊撿了一大袋漂亮的貝殼回家，可以說他：",o:["滿載而歸", "洋洋灑灑", "當仁不讓", "木已成舟"],a:0,why:"裝得滿滿的回來，收穫很多，就是「滿載而歸」。「洋洋灑灑」是形容文章或說話很長。",trap:{"1": "「洋洋灑灑」用來形容文章、說話很長，不是形容東西很多。"}},
    {l:"第一課 字的小旅行",lv:3,u:"融會貫通：仿寫",q:"用「小船輕輕走」的句型（名詞＋疊字＋動作）仿寫，哪一句寫對了？",o:["白雲飄", "慢慢的白雲", "白雲慢慢飄", "白雲在天上"],a:2,why:"「白雲（名詞）＋慢慢（疊字）＋飄（動作）」，和「小船＋輕輕＋走」一樣。其他句子少了疊字，或順序不對。",trap:{"1": "疊字放在名詞前面，變成「慢慢的白雲」，順序不對，也沒有動作。"}},
    {l:"第二課 妙故事點點名",lv:1,u:"字音",q:"「答應」的「答」要怎麼念？",o:["ㄉㄚˊ", "ㄉㄚ", "ㄉㄚˇ", "ㄉㄚˋ"],a:1,why:"「答」有兩個讀音：答應、滴滴答答念 ㄉㄚ；答案、回答、答謝念 ㄉㄚˊ。",trap:{"0": "ㄉㄚˊ 是「回答、答案」的念法，「答應」要念一聲 ㄉㄚ。"}},
    {l:"第二課 妙故事點點名",lv:1,u:"字音",q:"「回答」的「答」要怎麼念？",o:["ㄉㄚ", "ㄉㄚˊ", "ㄉㄚˇ", "ㄉㄚˋ"],a:1,why:"回答、答案、答謝的「答」念 ㄉㄚˊ；答應、滴滴答答念 ㄉㄚ。"},
    {l:"第二課 妙故事點點名",lv:1,u:"字音",q:"「搖晃」的「晃」要怎麼念？",o:["ㄏㄨㄤˇ", "ㄏㄨㄤ", "ㄏㄨㄤˋ", "ㄏㄨㄤˊ"],a:2,why:"晃動、搖晃的「晃」念 ㄏㄨㄤˋ，意思是搖擺、搖動；明晃晃、亮晃晃才念 ㄏㄨㄤˇ。",trap:{"0": "ㄏㄨㄤˇ 是「明晃晃、亮晃晃」的念法。"}},
    {l:"第二課 妙故事點點名",lv:1,u:"部首",q:"「窗」這個字的部首是什麼？",o:["宀", "穴", "囪", "心"],a:1,why:"「窗」是穴部，部首外 7 畫，總共 12 畫。",trap:{"0": "上面看起來像「宀」，但多了兩點變成「穴」，窗是穴部。", "2": "「囪」是煙囪的囪，是字裡的一部分，不是部首。"}},
    {l:"第二課 妙故事點點名",lv:1,u:"部首",q:"「穫」這個字的部首是什麼？",o:["犬", "禾", "艹", "又"],a:1,why:"「穫」是禾部，和農作物有關，例如收穫。部首外 14 畫，總共 19 畫。",trap:{"0": "有「犬」的是獲得、獲勝的「獲」。"}},
    {l:"第二課 妙故事點點名",lv:1,u:"部首",q:"「賽」這個字的部首是什麼？",o:["宀", "貝", "寸", "土"],a:1,why:"「賽」是貝部，部首外 10 畫，總共 17 畫。例如比賽、球賽、競賽。"},
    {l:"第二課 妙故事點點名",lv:1,u:"部首",q:"「傘」這個字的部首是什麼？",o:["十", "人", "木", "从"],a:1,why:"「傘」是人部，部首外 10 畫，總共 12 畫。例如雨傘、降落傘。"},
    {l:"第二課 妙故事點點名",lv:1,u:"部首",q:"「追」這個字的部首是什麼？",o:["止", "辵（⻌）", "口", "自"],a:1,why:"「追」左下的「⻌」就是辵部，部首外 6 畫，總共 10 畫，和走路、移動有關。"},
    {l:"第二課 妙故事點點名",lv:1,u:"部首",q:"「霧」這個字的部首是什麼？",o:["雨", "務", "力", "攵"],a:0,why:"「霧」是雨部，部首外 11 畫，總共 19 畫。霧是接近地面的水蒸氣遇冷凝結成小水滴，和雨、天氣有關。"},
    {l:"第二課 妙故事點點名",lv:1,u:"成語",q:"「霧裡看花」是什麼意思？",o:["在霧裡賞花很美", "看不清楚；比喻看不清楚事情的真相", "花長在霧裡", "早上去看花"],a:1,why:"「霧裡看花」原本形容視線模糊看不清楚，後來比喻看不清楚事情的真相。"},
    {l:"第二課 妙故事點點名",lv:1,u:"成語",q:"「歪打正著」是什麼意思？",o:["打歪了就要重打", "方法不對或沒有用心，卻剛好得到好的結果", "打球要打正", "做事很認真所以成功"],a:1,why:"「歪打正著」是本來無意去做，或方法不對，卻僥倖得到好的結果。",trap:{"3": "認真努力而成功，不是「歪打正著」，歪打正著是「僥倖」碰對了。"}},
    {l:"第二課 妙故事點點名",lv:1,u:"詞語",q:"「手忙腳亂」是形容什麼？",o:["手腳受傷", "做事慌亂，沒有條理", "跳舞很好看", "動作很整齊"],a:1,why:"「手忙腳亂」形容做事慌亂、沒有條理，就像課文裡剛睡醒、慌慌張張下車的王叔叔。"},
    {l:"第二課 妙故事點點名",lv:1,u:"詞語",q:"「飛也似的」是形容什麼？",o:["真的在飛", "走路或跑步速度非常快", "像鳥一樣唱歌", "慢慢的走"],a:1,why:"「飛也似的」形容行走或奔跑的速度極快，好像在飛一樣，不是真的飛起來。"},
    {l:"第二課 妙故事點點名",lv:1,u:"詞語",q:"「參加夏令營，讓我收穫滿滿。」這裡的「收穫」是什麼意思？",o:["割取成熟的稻子", "得到很多成果", "買了很多東西", "把東西收起來"],a:1,why:"「收穫」原本是割取成熟的農作物，也泛指得到成果或利益。參加夏令營沒有割稻子，是學到很多、得到很多。",trap:{"0": "這是「收穫」原本的意思，但夏令營沒有在割稻，這裡是得到成果。"}},
    {l:"第二課 妙故事點點名",lv:1,u:"詞語",q:"「專心」是什麼意思？",o:["一個人在家", "專一心思，集中心力", "心裡很難過", "只喜歡一種東西"],a:1,why:"「專心」是專一心思、集中心力。老師提醒以樂，上課要專心才能有收穫。"},
    {l:"第二課 妙故事點點名",lv:1,u:"課文內容",q:"以樂最近為什麼常常看著窗戶外面？",o:["外面在下雨", "窗外有一株大樹，常常有小鳥飛過去", "他在找媽媽", "他看不清楚黑板"],a:1,why:"課文說窗外有一株大樹，常常有小鳥飛過去，所以以樂常常看著窗外。"},
    {l:"第二課 妙故事點點名",lv:1,u:"課文內容",q:"老師為什麼請以樂回答「霧裡看花」的意思？",o:["以樂舉手", "老師發現他正看著窗戶外面", "以樂是班長", "以樂最會成語"],a:1,why:"老師發現以樂上課看著窗外，就點名請他回答，用這個方法提醒他要專心。"},
    {l:"第二課 妙故事點點名",lv:1,u:"課文內容",q:"王叔叔為什麼一坐上公車就睡著了？",o:["公車很舒服", "他加班到很晚，太累了", "他生病了", "他想做夢"],a:1,why:"王叔叔加班到很晚才下班，因為太累了，一下子就睡著了。"},
    {l:"第二課 妙故事點點名",lv:1,u:"課文內容",q:"王叔叔下車後，為什麼有人追著他大喊「那是我的雨傘，快還來！」？",o:["王叔叔忘了付錢", "王叔叔手忙腳亂，拿走了別人的雨傘", "那個人想跟他借傘", "那個人是他的朋友"],a:1,why:"王叔叔剛被晃醒，手忙腳亂、慌慌張張的抓起雨傘下車，結果拿錯了別人的傘。"},
    {l:"第二課 妙故事點點名",lv:1,u:"句型",q:"「雖然他張大眼睛看著黑板，可是（　）。」括號要接哪一句才對？",o:["他找到答案了", "怎麼也找不到答案", "所以他很高興", "因為他很專心"],a:1,why:"「雖然……可是……」是轉折句，後面要接和前面想法相反的結果：張大眼睛看黑板，卻還是找不到答案。",trap:{"0": "前面「張大眼睛看」，後面「找到了」並沒有轉折，不適合用「可是」。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：讀音",q:"下面哪一個「答」要念 ㄉㄚ？",o:["答案", "回答", "答謝", "答應"],a:3,why:"只有「答應」念 ㄉㄚ。答案、回答、答謝都念 ㄉㄚˊ。",trap:{"2": "「答謝」是回報別人的恩惠，念 ㄉㄚˊ，不要跟答應弄混。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：讀音",q:"「這盞亮晃晃的燈因為地震而搖晃。」兩個「晃」依序怎麼念？",o:["ㄏㄨㄤˋ、ㄏㄨㄤˋ", "ㄏㄨㄤˇ、ㄏㄨㄤˋ", "ㄏㄨㄤˋ、ㄏㄨㄤˇ", "ㄏㄨㄤˇ、ㄏㄨㄤˇ"],a:1,why:"「亮晃晃」形容光很亮，念 ㄏㄨㄤˇ；「搖晃」是搖動，念 ㄏㄨㄤˋ。",trap:{"2": "順序反了：亮晃晃是三聲，搖晃是四聲。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：形近字",q:"「時間早（　）經過了。」括號要填哪個字？",o:["己", "已", "以", "意"],a:1,why:"「已」是已經，表示時間過了。「己」是自己、知己。兩個字只差一點點：已的右上是半封口的。",trap:{"0": "「己」是自己的己，不是已經的已。", "2": "「以」念起來一樣，但「已經」要用「已」。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：形近字",q:"「上課要（　）心，才能有收穫。」括號要填哪個字？",o:["傳", "專", "轉", "團"],a:1,why:"「專心」的專是一心一意的意思。「傳」是傳球、流傳，多了人字旁。",trap:{"0": "「傳」是傳球、流傳的傳，左邊多了人字旁。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：形近字",q:"「秋天到了，農夫忙著收（　）稻子。」括號要填哪個字？",o:["獲", "護", "穫", "讓"],a:2,why:"「收穫」的穫是禾部，和農作物有關。獲得、獲勝的「獲」是犬部；保護的「護」是言部。",trap:{"0": "「獲」是獲得、獲勝；收割農作物要用禾部的「穫」。", "1": "「護」是保護、護理的護。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：形近字",q:"「工廠的煙（　）冒出白白的煙。」括號要填哪個字？",o:["窗", "囪", "悤", "匆"],a:1,why:"「煙囪」的囪是排煙的通道；「窗」是窗戶、天窗，上面多了「穴」。",trap:{"0": "「窗」是窗戶的窗，排煙的是「煙囪」。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：形近字",q:"「海邊有一座高高的燈（　）。」括號要填哪個字？",o:["搭", "塔", "答", "踏"],a:1,why:"「燈塔、水塔」的塔是土部；「搭檔、搭配」的搭是提手旁。"},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：部首",q:"「亂」這個字的部首是什麼？",o:["爪", "乙", "又", "冂"],a:1,why:"「亂」的部首是右邊的「乙」，部首外 12 畫，總共 13 畫。這個字的部首很容易猜錯。",trap:{"0": "左上看起來像「爪」，但部首是右邊那一筆「乙」。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：標點",q:"以樂說「我……看不清楚。」這裡的刪節號「……」表示什麼？",o:["話還沒說完", "說話吞吞吐吐、斷斷續續", "很生氣", "在問問題"],a:1,why:"以樂緊張、找不到答案，所以說話吞吞吐吐、斷斷續續。課文說兩則故事的刪節號作用不一樣：「忙中有錯」裡的刪節號才是表示話還沒說完。",trap:{"0": "「話還沒說完」是另一則故事「忙中有錯」裡刪節號的作用。"}},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：哪個錯",q:"下面關於課文的說法，哪一個是「錯」的？",o:["以樂上課常看窗外", "王叔叔加班到很晚", "以樂原本就知道「霧裡看花」的意思", "王叔叔拿錯了別人的雨傘"],a:2,why:"以樂其實找不到答案，只是緊張的說「看不清楚」，剛好說對了，所以叫「歪打正著」。"},
    {l:"第二課 妙故事點點名",lv:2,u:"陷阱：理解",q:"老師說以樂「這次你說對了」，是因為什麼？",o:["以樂上課很認真", "以樂說的「看不清楚」剛好就是霧裡看花的意思", "以樂看了課本", "以樂舉手回答"],a:1,why:"以樂是緊張又找不到答案，才說「我……看不清楚」，沒想到剛好就是「霧裡看花」的意思，這就是歪打正著。"},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：成語應用",q:"弟弟不會這題，隨便猜了一個答案，沒想到竟然猜對了。這最適合用哪一個詞語？",o:["霧裡看花", "歪打正著", "手忙腳亂", "一馬當先"],a:1,why:"隨便猜、方法不對，卻剛好得到好的結果，就是「歪打正著」，和以樂的故事一樣。"},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：成語應用",q:"這部偵探片情節很懸疑，觀眾怎麼猜都猜不出真相。可以說觀眾像在：",o:["霧裡看花", "飛也似的", "歪打正著", "手忙腳亂"],a:0,why:"看不清楚事情的真相，就是「霧裡看花」。"},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：詞語應用",q:"突然下雨了，大家急急忙忙、亂成一團的收拾野餐墊上的東西。最適合用哪一個詞語？",o:["專心", "飛也似的", "手忙腳亂", "收穫"],a:2,why:"急忙又沒有條理，就是「手忙腳亂」。"},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：詞語應用",q:"哥哥聽到冰淇淋車的音樂，（　）衝出門外，一下子就不見人影。括號最適合填：",o:["霧裡看花", "飛也似的", "歪打正著", "手忙腳亂"],a:1,why:"「一下子就不見人影」表示跑得非常快，最適合「飛也似的」。",trap:{"3": "哥哥是跑得很快，不是慌亂沒有條理。"}},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：推論詞義",q:"課文說王叔叔夢見短跑比賽，「一馬當先的他，眼看著終點就在眼前」。由這句話推想，「一馬當先」最可能是什麼意思？",o:["騎著一匹馬", "跑在最前面、領先大家", "跑得最慢", "馬上就要跌倒"],a:1,why:"從「眼看著終點就在眼前」可以推想，他正跑在最前面、領先大家。用前後文推想詞語意思，是這一課要學的方法。"},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：句型",q:"下面哪一句「雖然……可是……」用得正確？",o:["雖然下雨了，可是我們還是去爬山", "雖然下雨了，所以我們不去爬山", "雖然肚子餓，因此我去吃飯", "因為他很努力，可是考了一百分"],a:0,why:"「雖然……可是……」前後的意思要相反、有轉折：下雨了本來不適合爬山，可是還是去了。",trap:{"1": "「雖然」要配「可是」，不能配「所以」。"}},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：課文理解",q:"第二則故事為什麼叫做「忙中有錯」？",o:["王叔叔工作太忙", "王叔叔在慌忙中拿錯了別人的雨傘", "公車司機開錯路", "王叔叔夢到比賽輸了"],a:1,why:"王叔叔被晃醒後手忙腳亂、慌慌張張，在忙亂中拿錯了雨傘，所以叫「忙中有錯」。"},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：寫作手法",q:"課文用了很多四字詞語，例如手忙腳亂、慌慌張張、霧裡看花，這樣寫有什麼好處？",o:["讓字數變多", "讓文章讀起來更精采、生動", "讓故事變得很難懂", "因為課本規定"],a:1,why:"四字詞語讓情境、人物的動作和個性更生動，文章讀起來更精采。"},
    {l:"第二課 妙故事點點名",lv:3,u:"融會貫通：標點應用",q:"「我……我不是故意打破杯子的……」這句話裡的刪節號，最可能表示什麼？",o:["說話吞吞吐吐、很緊張", "大聲喊叫", "問別人問題", "很開心"],a:0,why:"打破杯子很緊張，所以說話斷斷續續、吞吞吐吐，和以樂說「我……看不清楚」的用法一樣。"},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「店」這個字的部首是什麼？",o:["厂", "广", "占", "口"],a:1,why:"「店」是广部，部首外 5 畫，總共 8 畫。例如商店、書店。",trap:{"0": "「厂」少了上面一點，「店」是有一點的「广」。"}},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「闆」這個字的部首是什麼？",o:["品", "口", "門", "木"],a:2,why:"「闆」是門部，部首外 9 畫，總共 17 畫。老闆是商店的主人。"},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「機」這個字的部首是什麼？",o:["木", "幾", "人", "戈"],a:0,why:"「機」是木部，部首外 12 畫，總共 16 畫。例如飛機、客機。",trap:{"1": "「幾」是右邊表示讀音的部分。"}},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「繞」這個字的部首是什麼？",o:["堯", "糸", "土", "兀"],a:1,why:"「繞」是糸部，部首外 12 畫，總共 18 畫，有圍著轉動、纏束的意思，例如繞圈子、纏繞。"},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「留」這個字的部首是什麼？",o:["刀", "田", "口", "卯"],a:1,why:"「留」是田部，部首外 5 畫，總共 10 畫。例如停留、保留。"},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「獅」這個字的部首是什麼？",o:["犬（犭）", "師", "巾", "刀"],a:0,why:"「獅」左邊的「犭」是犬部，部首外 10 畫，總共 13 畫，和動物有關。"},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「實」這個字的部首是什麼？",o:["貝", "宀", "毋", "十"],a:1,why:"「實」是宀部，部首外 11 畫，總共 14 畫。例如實在、果實。"},
    {l:"第三課 繞口令村",lv:1,u:"部首",q:"「扶」這個字的部首是什麼？",o:["夫", "手（扌）", "大", "木"],a:1,why:"「扶」是手部，部首外 4 畫，總共 7 畫。用手撐著人或東西不讓它倒，例如攙扶。"},
    {l:"第三課 繞口令村",lv:1,u:"課文內容",q:"課文裡的「我」叫什麼名字？是做什麼的？",o:["小金，旅行家", "小綠，送花的人", "小力，老闆", "小金，船長"],a:0,why:"課文第一句：我叫小金，是個旅行家。"},
    {l:"第三課 繞口令村",lv:1,u:"課文內容",q:"小金的船為什麼會在海上迷失方向？",o:["船壞了", "突如其來的暴風雨", "他睡著了", "地圖不見了"],a:1,why:"由於突如其來的暴風雨，船在海上迷失了方向，風雨過後停在一座沒到過的小島。"},
    {l:"第三課 繞口令村",lv:1,u:"課文內容",q:"老闆說，飯後有哪兩種有名的水果？",o:["柿子和桃子", "蘋果和香蕉", "柿子和獅子", "桃子和猴子"],a:0,why:"老闆說今天有兩種水果：柿子和桃子，都是繞口令村有名的水果。",trap:{"2": "獅子是動物，是繞口令裡和「柿子」音很像的詞。", "3": "猴子是繞口令裡被桃子撞到的動物，不是水果。"}},
    {l:"第三課 繞口令村",lv:1,u:"課文內容",q:"小金在店裡的牆上看到什麼？",o:["一隻大公雞", "一架飛機", "一隻獅子", "一棵桃樹"],a:0,why:"小金看到一家店，牆上有隻「大公雞」，老闆說店裡最好吃的是「灰雞」。"},
    {l:"第三課 繞口令村",lv:1,u:"詞語",q:"什麼是「繞口令」？",o:["一種語文遊戲，把字音容易弄混的字編成句子讓人快讀", "一首很長的歌", "一種村子的名字而已", "一種很難的數學題"],a:0,why:"繞口令是一種語文遊戲，把聲、韻、調容易混淆的字編成句子，念起來很有節奏感。"},
    {l:"第三課 繞口令村",lv:1,u:"課文內容",q:"練習繞口令有什麼好處？",o:["可以變得很會吃", "讓發音更清楚，也能體會語文的樂趣", "可以跑得更快", "可以認識很多水果"],a:1,why:"朵朵說：練習繞口令可以讓發音變得更清楚，也可以體會語文的樂趣。"},
    {l:"第三課 繞口令村",lv:1,u:"詞語",q:"「迷失」是什麼意思？",o:["找到了", "迷惑而無法分辨，失去方向", "很喜歡", "很開心"],a:1,why:"「迷失」是迷惑而無法分辨、失去方向。小金的船遇到暴風雨，就在海上迷失了方向。"},
    {l:"第三課 繞口令村",lv:1,u:"詞語",q:"「我們用料實在」，這裡的「實在」是什麼意思？",o:["真實、不虛假", "非常多", "很貴", "很好看"],a:0,why:"「實在」是真實、不虛假。用料實在就是用的材料真材實料、不偷工減料。"},
    {l:"第三課 繞口令村",lv:1,u:"字音",q:"「暴風雨」的「暴」要怎麼念？",o:["ㄅㄠˋ", "ㄆㄨˋ", "ㄅㄠˇ", "ㄆㄠˋ"],a:0,why:"暴風雨、暴飲暴食的「暴」念 ㄅㄠˋ；「暴露」的暴念 ㄆㄨˋ。"},
    {l:"第三課 繞口令村",lv:1,u:"名詞分類",q:"下面哪一個詞是表示「地點」的名詞？",o:["老闆", "小島", "柿子", "兩個多月前"],a:1,why:"小島是地點。老闆是人物，柿子是事物，兩個多月前是時間。"},
    {l:"第三課 繞口令村",lv:1,u:"名詞分類",q:"下面哪一個詞是表示「人物」的名詞？",o:["飛機", "繞口令村", "老闆", "十多天"],a:2,why:"老闆是人物。飛機是事物，繞口令村是地點，十多天是時間。"},
    {l:"第三課 繞口令村",lv:1,u:"詞語辨析",q:"和「老闆」意思相對的詞語是哪一個？",o:["夥計", "店長", "主人", "客人"],a:0,why:"「老闆」是產權的所有人，「夥計」是受僱做事的人，兩個相對。",trap:{"2": "「主人」和老闆的意思很接近，不是相對的詞。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：形近字",q:"「這件衣服的布（　）摸起來很舒服。」括號要填哪個字？",o:["科", "料", "抖", "斗"],a:1,why:"「布料、用料、材料」的料是斗部，表示可以使用的材料。「科」是科學、科技；「抖」是發抖、抖動。",trap:{"0": "「科」是科學的科，左邊是禾，不是米。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：形近字",q:"「我最喜（　）吃柿子。」括號要填哪個字？",o:["觀", "歡", "權", "勸"],a:1,why:"「喜歡」的歡右邊是「欠」；「參觀」的觀右邊是「見」。看部件就能分辨。",trap:{"0": "右邊是「見」的「觀」，是參觀、觀賞，和眼睛看有關。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：形近字",q:"「我們到美術館參（　）。」括號要填哪個字？",o:["歡", "觀", "罐", "灌"],a:1,why:"「參觀」是實地觀覽，要用眼睛看，所以是右邊有「見」的觀。",trap:{"0": "「歡」是喜歡的歡，右邊是「欠」。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：形近字",q:"「元宵節晚上，我們一起猜燈（　）。」括號要填哪個字？",o:["迷", "謎", "米", "咪"],a:1,why:"「猜謎、燈謎」的謎是言部，和說話、猜題有關；「迷失、入迷」的迷是辵部。",trap:{"0": "「迷」是迷失、入迷，猜題要用言字旁的「謎」。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：形近字",q:"「（　）於下大雨，比賽只好延期。」括號要填哪個字？",o:["甲", "田", "由", "申"],a:2,why:"「由於」表示原因，用「由」。「甲」是甲蟲、龜甲；「田」是田地、農田。三個字長得很像，看清楚上下有沒有出頭。"},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：形近字",q:"「看到老奶奶跌倒，他趕緊把她（　）起來。」括號要填哪個字？",o:["抉", "扶", "夫", "快"],a:1,why:"「攙扶」的扶是用手撐住人不讓他倒；「抉」是抉擇的抉，右邊是「夬」。"},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：讀音",q:"下面哪一個「幾」要念 ㄐㄧ？",o:["幾個", "幾天", "幾乎", "好幾個"],a:2,why:"「幾乎」的幾念 ㄐㄧ；幾個、幾天的幾念 ㄐㄧˇ，是在問數量。"},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：部首",q:"「料」這個字的部首是什麼？",o:["米", "斗", "十", "禾"],a:1,why:"「料」是斗部，部首外 6 畫，總共 10 畫。很多人以為是米部，要特別小心。",trap:{"0": "左邊雖然是「米」，但「料」的部首是右邊的「斗」。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：部首",q:"「觀」這個字的部首是什麼？",o:["隹", "見", "艹", "口"],a:1,why:"「觀」是見部，部首外 18 畫，總共 25 畫，和看有關，例如參觀、觀賞。"},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：細節",q:"小金在繞口令村停留了多久？",o:["兩個多月", "十多天", "一天", "一年"],a:1,why:"課文最後說「我在那裡停留十多天」。「兩個多月前」是遇到暴風雨的時間，不是停留的時間。",trap:{"0": "「兩個多月前」是暴風雨發生的時間，不是在村子裡停留的時間。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：細節",q:"小金在老闆那兒聽到幾個繞口令？",o:["兩個", "三個", "四個", "一個"],a:1,why:"老闆說了三個：灰雞、柿子、桃子。小孩說的送花繞口令不是在店裡聽到的，加起來全課才是四個。",trap:{"0": "水果有兩種，但老闆還說了「灰雞」的繞口令。", "2": "四個是整課的繞口令，題目只問在老闆那兒聽到的。"}},
    {l:"第三課 繞口令村",lv:2,u:"陷阱：名詞分類",q:"「我在那裡停留十多天」，「十多天」是哪一類名詞？",o:["人物", "地點", "時間", "事物"],a:2,why:"「十多天」表示時間的長短，是時間名詞。「那裡」才是地點。"},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：因果",q:"「由於突如其來的暴風雨，因此我的船在海上迷失了方向。」這句話的「原因」是什麼？",o:["船迷失了方向", "突如其來的暴風雨", "我是旅行家", "船停在小島"],a:1,why:"「由於」後面接原因，「因此」後面接結果：暴風雨是原因，迷失方向是結果。",trap:{"0": "這是「因此」後面的結果，不是原因。"}},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：句型",q:"下面哪一句「由於……因此……」用得正確？",o:["由於天氣太差，因此單車之旅只好延期", "由於天氣太差，可是我們出發了", "由於我很開心，雖然下雨了", "由於肚子餓，但是不想吃"],a:0,why:"「由於」說原因，「因此」說結果，前後要有因果關係：天氣差，所以延期。"},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：課文理解",q:"那個地方為什麼叫做「繞口令村」？",o:["因為村子很繞路", "因為這裡的人說話喜歡用繞口令", "因為村子有很多獅子", "因為村長叫繞口令"],a:1,why:"小孩、老闆說話都是繞口令，這裡的人喜歡用繞口令說話，所以叫繞口令村。"},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：繞口令特點",q:"「是柿子不是獅子，不是石子是柿子」為什麼念起來容易打結？",o:["因為句子很長", "因為柿子、獅子、石子的字音很相近", "因為有很多水果", "因為要大聲念"],a:1,why:"繞口令是用字音相近的詞語寫成的。柿子、獅子、石子念起來很像，快讀時就容易弄混。"},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：繞口令特點",q:"下面哪一句最像「繞口令」？",o:["今天天氣很好", "小貓抓小毛，小毛抓小貓", "我喜歡吃桃子", "老闆很熱情"],a:1,why:"繞口令是把字音容易弄混的字編在一起反覆念。「小貓、小毛」音很像又顛倒重複，最像繞口令。"},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：課文理解",q:"上岸撞到小金的小孩，為什麼急急忙忙說了一段送花的繞口令？",o:["他在練習比賽", "有人正在送花，他趕著去拿一朵花", "他迷路了", "他要找老闆"],a:1,why:"小綠和小力正在送花，小孩趕著去，也想拿到一朵花，所以說話又急又快。"},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：詞語辨析",q:"「搜救隊準備出發，（　）今天在山中迷失方向的登山客。」括號要填哪個詞？",o:["迷失", "尋找", "停留", "參觀"],a:1,why:"登山客「迷失」方向，搜救隊要去「尋找」他們。迷失和尋找是一組相對的詞。",trap:{"0": "迷失的是登山客，搜救隊是去找人。"}},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：詞語辨析",q:"「他是個做事實在的人，絕不會（　）理由來推託責任。」括號要填哪個詞？",o:["真實", "虛構", "誠實", "參觀"],a:1,why:"「實在」是真實不虛假，「虛構」是憑空編出來的。做事實在的人，不會虛構理由。"},
    {l:"第三課 繞口令村",lv:3,u:"融會貫通：課文理解",q:"課文最後說「直到現在，我還常常想起那裡呢！」可以看出小金的心情是：",o:["很害怕那個地方", "覺得那段經歷很有趣，很懷念", "想趕快忘記", "很生氣"],a:1,why:"常常想起，表示這段旅程讓他印象深刻、覺得有趣又懷念。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"部首",q:"「葵」這個字的部首是什麼？",o:["艸（艹）", "癶", "天", "大"],a:0,why:"「葵」是艸部，部首外 9 畫，總共 13 畫。向日葵是植物；海葵雖然是海裡的動物，字還是艸部。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"部首",q:"「觸」這個字的部首是什麼？",o:["虫", "角", "蜀", "刀"],a:1,why:"「觸」是角部，部首外 13 畫，總共 20 畫，有碰、撞的意思，例如接觸、觸手。",trap:{"0": "右邊的「蜀」裡面有虫，但部首是左邊的「角」。"}},
    {l:"第四課 小丑魚和海葵",lv:1,u:"部首",q:"「擺」這個字的部首是什麼？",o:["罒", "手（扌）", "去", "能"],a:1,why:"「擺」是手部，部首外 15 畫，總共 18 畫。擺動、搖擺都和動作有關。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"部首",q:"「露」這個字的部首是什麼？",o:["路", "足", "雨", "口"],a:2,why:"「露」是雨部，部首外 13 畫，總共 21 畫。露珠是水氣凝結的小水滴，和雨、天氣有關。",trap:{"0": "「路」是下面表示讀音的部分。"}},
    {l:"第四課 小丑魚和海葵",lv:1,u:"部首",q:"「懷」這個字的部首是什麼？",o:["衣", "心（忄）", "目", "十"],a:1,why:"「懷」是心部，部首外 16 畫，總共 19 畫，表示心中存有某種念頭，例如不懷好意。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"部首",q:"「欺」這個字的部首是什麼？",o:["其", "欠", "八", "甘"],a:1,why:"「欺」是欠部，部首外 8 畫，總共 12 畫。例如欺負、欺騙。",trap:{"0": "「其」是左邊表示讀音的部分。"}},
    {l:"第四課 小丑魚和海葵",lv:1,u:"部首",q:"「痛」這個字的部首是什麼？",o:["疒", "用", "甬", "广"],a:0,why:"「痛」是疒部，和生病、身體不舒服有關，部首外 7 畫，總共 12 畫。",trap:{"3": "「广」少了左邊的兩點，「疒」才是和生病有關的部首。"}},
    {l:"第四課 小丑魚和海葵",lv:1,u:"字音",q:"「露出」的「露」要怎麼念？",o:["ㄌㄨˋ", "ㄌㄡˋ", "ㄌㄨˊ", "ㄌㄡˊ"],a:1,why:"露出、露面、露馬腳的「露」念 ㄌㄡˋ；透露、露珠、甘露念 ㄌㄨˋ。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"詞語",q:"「不懷好意」是什麼意思？",o:["心裡很快樂", "心裡存有不好的念頭", "不喜歡好東西", "很懷念朋友"],a:1,why:"「不懷好意」是心裡面存有不好的念頭，就像想吃掉小丑魚的黃色大魚。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"詞語",q:"海葵的「觸手」是什麼？",o:["海葵的花瓣", "身體前端可以伸縮的感覺和捕食器官", "小丑魚的手", "海葵的根"],a:1,why:"觸手是腔腸動物身體前端的感覺與捕食器官，可以自由伸縮。海葵的觸手裡有毒刺。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"詞語",q:"「危險」是什麼意思？",o:["很好玩", "不安全，可能會受到傷害", "很漂亮", "很安靜"],a:1,why:"「危險」是不安全、有遭受損害的可能。小丑魚遇到危險時，海葵都會出面幫忙。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"課文內容",q:"一大片海葵在大海中形成了什麼？",o:["一座山", "一個巨大的花園城堡", "一條河", "一艘船"],a:1,why:"課文說海葵有的像紅寶石、綠寶石，有的像花、像樹，形成一個巨大的花園城堡。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"課文內容",q:"黃色大魚看到小丑魚時，小丑魚正在做什麼？",o:["睡覺", "和朋友玩躲貓貓", "找食物", "游回家"],a:1,why:"小丑魚正開心的和朋友在花園城堡玩躲貓貓。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"課文內容",q:"海葵用什麼方法趕走黃色大魚？",o:["大聲叫", "抓準時機射出刺針", "請鯊魚幫忙", "把大魚綁起來"],a:1,why:"等大魚靠近時，海葵抓準時機射出刺針，大魚痛得哇哇叫，只好游走。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"課文內容",q:"黃色大魚為什麼要「好聲好氣」的跟小丑魚說話？",o:["他很有禮貌", "想獲得小丑魚的信任", "他喜歡交朋友", "他迷路了"],a:1,why:"大魚心中早有想法，好聲好氣是為了讓小丑魚相信他、降低戒心。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"課文內容",q:"小丑魚最後對海葵說了什麼？",o:["我不要再跟你玩了", "謝謝你！每當我遇到危險，都是你出面幫忙", "你的觸手好可怕", "大魚是我的好朋友"],a:1,why:"小丑魚很感動，感謝海葵每次在他遇到危險時都出面幫忙。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"課文內容",q:"海葵說：「我的觸手雖然美麗，卻是……」後面是什麼？",o:["很軟的", "有毒的", "會發光的", "很短的"],a:1,why:"海葵的觸手雖然美麗，卻是有毒的，所以大魚被刺到會痛。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"詞語",q:"「擺動」是什麼意思？",o:["擺在桌上", "搖擺移動", "停下來", "擺地攤"],a:1,why:"「擺動」是搖擺移動，例如大魚輕輕擺動尾巴。「擺地攤」的擺是陳列、布置。",trap:{"3": "「擺地攤」的擺是陳列的意思，「擺動」是搖動。"}},
    {l:"第四課 小丑魚和海葵",lv:1,u:"詞語",q:"「感動」是什麼意思？",o:["心裡受到觸動而很有感覺", "覺得很生氣", "覺得很無聊", "動來動去"],a:0,why:"「感動」是情緒因受外界刺激而有所震撼。小丑魚被海葵保護，所以很感動。"},
    {l:"第四課 小丑魚和海葵",lv:1,u:"課文主旨",q:"這一課最想告訴我們什麼？",o:["海裡很危險", "朋友有困難時主動伸出援手，互相幫助", "不要玩躲貓貓", "大魚都很壞"],a:1,why:"主旨是朋友有困難時能主動幫忙，也要認識自己的優點，和別人互助合作。"},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：部首",q:"「射」這個字的部首是什麼？",o:["身", "寸", "弓", "矢"],a:1,why:"「射」是寸部，部首外 7 畫，總共 10 畫。左邊雖然是「身」，部首卻是右邊的「寸」。",trap:{"0": "左邊是「身」，但「射」的部首是寸。"}},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：部首",q:"「毒」這個字的部首是什麼？",o:["母", "毋", "土", "生"],a:1,why:"「毒」是毋部，部首外 4 畫，總共 8 畫。下面看起來像「母」，其實是「毋」。",trap:{"0": "下面不是「母」，是少了兩點、中間一撇穿過的「毋」。"}},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：部首",q:"「危」這個字的部首是什麼？",o:["厂", "卩", "人", "刀"],a:1,why:"「危」是卩部，部首外 4 畫，總共 6 畫。"},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：部首",q:"「丑」這個字的部首是什麼？",o:["丑", "一", "丨", "乙"],a:1,why:"「丑」是一部，部首外 3 畫，總共 4 畫。小丑是戲劇裡扮演滑稽人物的角色。",trap:{"0": "「丑」本身不是部首，它屬於一部。"}},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：讀音",q:"下面哪一個「露」要念 ㄌㄨˋ？",o:["露出", "露面", "露馬腳", "露珠"],a:3,why:"露珠、透露、甘露念 ㄌㄨˋ；露出、露面、露馬腳念 ㄌㄡˋ。"},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：形近字",q:"「大魚露出不（　）好意的笑容。」括號要填哪個字？",o:["壞", "懷", "壤", "環"],a:1,why:"「不懷好意」的懷是心部，表示心裡存著念頭。「壞」是壞人、破壞；「壤」是土壤。",trap:{"0": "「壞」是土部，是壞人的壞；不懷好意要用心部的「懷」。"}},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：形近字",q:"「老師（　）許我們下課去操場玩。」括號要填哪個字？",o:["準", "准", "淮", "隼"],a:1,why:"「准許、批准」用兩點水的「准」；「準備、標準」用三點水下面有十的「準」。",trap:{"0": "「準」是準備、標準的準；允許要用「准」。"}},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：形近字",q:"「廟口正在演木（　）戲。」括號要填哪個字？",o:["遇", "偶", "愚", "寓"],a:1,why:"「木偶、偶然」的偶是人部；遇到的「遇」是辵部；愚笨的「愚」是心部；寓言的「寓」是宀部。"},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：形近字",q:"「見到師長要鞠（　）問好。」括號要填哪個字？",o:["射", "躺", "躬", "窮"],a:2,why:"「鞠躬」的躬右邊是「弓」；「射」是寸；「躺」右邊是「尚」。三個字左邊都是「身」，要看右邊。"},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：哪個錯",q:"下面關於課文的說法，哪一個是「錯」的？",o:["海葵像紅寶石、綠寶石", "大魚好聲好氣的說話", "海葵的觸手美麗又安全", "小丑魚感謝海葵"],a:2,why:"海葵說觸手雖然美麗，卻是有毒的，所以不是安全的。"},
    {l:"第四課 小丑魚和海葵",lv:2,u:"陷阱：近義詞",q:"下面哪一個詞語，意思和「不懷好意」最接近？",o:["好聲好氣", "居心不良", "和樂融融", "挺身而出"],a:1,why:"「不懷好意」和「居心不良」都是心裡存著壞念頭。「好聲好氣」只是說話的樣子，大魚是用好聲好氣來掩飾居心不良。",trap:{"0": "大魚雖然好聲好氣，但那只是說話的態度，不代表心裡的想法。"}},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：生活應用",q:"放學時陌生人好聲好氣的說要帶你去買糖果，最好怎麼做？",o:["跟他走，因為他很客氣", "想到他可能不懷好意，拒絕並告訴大人", "收下糖果再說", "跟他聊天"],a:1,why:"就像課文裡的大魚，說話客氣不代表心裡是好意。遇到陌生人邀約，要拒絕並告訴大人。"},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：句型",q:"下面哪一句「一……就……」用得正確？",o:["小狗一看到主人回來，就搖著尾巴撲上去", "小狗一看到主人，可是不理他", "一下雨了，所以帶傘", "小狗就看到主人一回來"],a:0,why:"「一……就……」是承接句，表示前面的事一發生，後面的事馬上接著發生。"},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：句型",q:"下面哪一句「有的……有的……有的……」用得正確？",o:["公園裡的孩子很多，有的在玩沙，有的在溜滑梯，有的在追逐嬉戲", "公園裡有的孩子", "有的玩沙所以溜滑梯", "公園裡的孩子有的很多"],a:0,why:"這個句型用來分別說明同一群人或東西的不同樣子，像課文寫海葵「有的像紅寶石，有的像綠寶石……」。"},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：句型",q:"「他雖然年紀小，做起事來（　）非常有條理。」括號要填哪個字？",o:["就", "卻", "所以", "因為"],a:1,why:"「雖然……卻……」是轉折句，前後意思相反：年紀小，可是做事有條理。就像海葵的觸手雖然美麗，卻是有毒的。"},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：仿寫",q:"「張開大大的嘴巴」的結構是「動作＋疊字＋的＋東西」，哪一個仿寫正確？",o:["伸著長長的脖子", "嘴巴張開", "大嘴巴", "張開嘴巴大大"],a:0,why:"「伸著（動作）長長（疊字）的脖子（東西）」，和「張開大大的嘴巴」結構一樣。"},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：仿寫",q:"「大魚輕輕擺動尾巴」的結構是「誰＋疊字＋動作＋身體部位」，哪一個仿寫正確？",o:["小貓慢慢睜大眼睛", "小貓的眼睛", "慢慢的小貓", "小貓睜眼睛慢慢"],a:0,why:"「小貓（誰）慢慢（疊字）睜大（動作）眼睛（身體部位）」，結構完全一樣。"},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：情節",q:"故事的氣氛是怎麼變化的？",o:["一直都很開心", "從開心熱鬧，變得緊張危險，最後平安", "一直都很可怕", "從難過變開心"],a:1,why:"一開始小丑魚開心玩耍，大魚出現後變得驚險，海葵出手後才化解危機。"},
    {l:"第四課 小丑魚和海葵",lv:3,u:"融會貫通：生活應用",q:"看到同學被欺負，下面哪個做法最像課文裡的海葵？",o:["假裝沒看到", "一起嘲笑他", "挺身而出保護他，或請老師幫忙", "跑去告訴全班看熱鬧"],a:2,why:"海葵在小丑魚遇到危險時出面幫忙，朋友有困難時主動伸出援手，就是這課的主旨。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"部首",q:"「操」這個字的部首是什麼？",o:["木", "口", "手（扌）", "品"],a:2,why:"「操」是手部，部首外 13 畫，總共 16 畫。例如早操、大會操。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"部首",q:"「練」這個字的部首是什麼？",o:["糸", "東", "木", "火"],a:0,why:"「練」是糸部，部首外 9 畫，總共 15 畫，例如練習、練舞。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"部首",q:"「習」這個字的部首是什麼？",o:["白", "羽", "日", "冫"],a:1,why:"「習」是羽部，部首外 5 畫，總共 11 畫。小鳥反覆拍動翅膀練飛，就是「習」。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"部首",q:"「努」這個字的部首是什麼？",o:["女", "又", "力", "奴"],a:2,why:"「努」是力部，部首外 5 畫，總共 7 畫，表示盡力。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"部首",q:"「秒」這個字的部首是什麼？",o:["少", "禾", "木", "小"],a:1,why:"「秒」是禾部，部首外 4 畫，總共 9 畫。六十秒是一分鐘。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"部首",q:"「場」這個字的部首是什麼？",o:["土", "日", "易", "勿"],a:0,why:"「場」是土部，部首外 9 畫，總共 12 畫，表示寬廣平坦的空地，例如操場。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"部首",q:"「絲」這個字的部首是什麼？",o:["糸", "幺", "小", "一"],a:0,why:"「絲」是糸部，部首外 6 畫，總共 12 畫，例如絲帶、絲巾。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文內容",q:"課文主角「我」是誰？",o:["班長", "黃老師", "李文貴", "王叔叔"],a:2,why:"課文用第一人稱「我」來寫，主角是李文貴。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文內容",q:"李文貴練習大會操時遇到什麼難題？",o:["他不會跑步", "中間那段動作太快，常常左右不分", "他忘了帶絲帶", "他生病了"],a:1,why:"中間那段動作快得像飛轉的秒針，他經常左右不分，使得後面整排同學都跳錯。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文內容",q:"桌上的字條是誰留的？約李文貴去哪裡？",o:["老師，約他去辦公室", "班長，約他第二節下課到司令臺", "媽媽，約他回家", "同學，約他去福利社"],a:1,why:"字條寫著：第二節下課後，請不要忘記到司令臺來！是班長留的。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文內容",q:"班長想出什麼辦法幫李文貴分清左右？",o:["在地上畫線", "把絲帶綁在右手", "請老師站在旁邊", "戴上手套"],a:1,why:"只要記得有絲帶是右手，沒絲帶是左手，就簡單多了。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文內容",q:"練習時，旁邊的同學幫忙喊什麼？",o:["一、二、一、二", "左、右、左、右", "絲帶、沒絲帶", "加油、加油"],a:2,why:"同學幫忙喊「絲帶」、「沒絲帶」，提醒大家哪邊是右、哪邊是左。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文內容",q:"故事最後，班上其他同學做了什麼？",o:["回教室休息", "也在手上綁絲帶，全班一起練習", "嘲笑李文貴", "去找老師"],a:1,why:"全班同學通通跑來，手上也綁著絲帶，陪李文貴一起練大會操。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"詞語",q:"「鬆了一口氣」是什麼意思？",o:["呼吸變快", "緊張或擔心的心情放下來", "把氣球放掉", "很生氣"],a:1,why:"事情告一段落，緊張或擔憂的心情放了下來，就是鬆了一口氣。李文貴知道班長只是要練大會操，就鬆了一口氣。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"詞語",q:"「翩翩起舞」是什麼意思？",o:["跳得很累", "輕盈愉快的跳起舞來", "跌倒了", "站著不動"],a:1,why:"「翩翩起舞」是輕盈愉悅的跳起舞來，課文用來形容絲帶像彩蝶一樣飛舞。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"詞語",q:"「通通」是什麼意思？",o:["全部、所有", "一點點", "通過", "打電話"],a:0,why:"「通通」是全部、所有，例如「班上同學通通跑來了」。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"詞語",q:"「必定」是什麼意思？",o:["可能", "一定", "不會", "也許"],a:1,why:"「必定」是一定，表示肯定的推斷或堅決的態度。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"詞語",q:"「指導」是什麼意思？",o:["指示引導", "手指頭", "指責", "導遊"],a:0,why:"「指導」是指示引導，例如指導大會操的黃老師。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文內容",q:"課文開頭說「十月太陽像金球高高掛」，大家練大會操練得怎樣？",o:["很偷懶", "很努力，跳得滿身汗", "都在聊天", "一下子就跳完了"],a:1,why:"大家都很努力，跳得滿身汗。"},
    {l:"第五課 飛舞的絲帶",lv:1,u:"課文主旨",q:"這一課最想告訴我們什麼？",o:["大會操很難", "同學互相合作、陪伴，一起面對問題", "絲帶很漂亮", "不要練習"],a:1,why:"同學們一起想辦法、陪伴李文貴練習，凸顯彼此的默契和情誼，最後一句「有大家的陪伴，真好！」就是主旨。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：部首",q:"「段」這個字的部首是什麼？",o:["殳", "几", "又", "一"],a:0,why:"「段」是殳部，部首外 5 畫，總共 9 畫，例如一段話、一段路。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：部首",q:"「整」這個字的部首是什麼？",o:["束", "正", "攴", "止"],a:2,why:"「整」是攴部，部首外 12 畫，總共 16 畫。很多人會猜「正」或「束」。",trap:{"1": "下面雖然有「正」，但「整」的部首是右上的「攴」。"}},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：部首",q:"「必」這個字的部首是什麼？",o:["丿", "心", "丶", "必"],a:1,why:"「必」是心部，部首外只有 1 畫，總共 5 畫。看起來不像，卻是心部。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：部首",q:"「鬆」這個字的部首是什麼？",o:["木", "公", "髟", "彡"],a:2,why:"「鬆」是髟部，部首外 8 畫，總共 18 畫。上面整塊「髟」才是部首。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：形近字",q:"「大家都很（　）力練習。」括號要填哪個字？",o:["怒", "努", "奴", "弩"],a:1,why:"「努力」的努是力部；「怒氣」的怒是心部，和生氣有關。",trap:{"0": "「怒」下面是心，是生氣的意思。"}},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：形近字",q:"「十月太（　）像金球高高掛。」括號要填哪個字？",o:["場", "揚", "陽", "湯"],a:2,why:"「太陽」的陽是阜部（左邊耳朵旁）。操場的「場」是土部；表揚的「揚」是手部；熱湯的「湯」是水部。",trap:{"0": "「場」是操場的場，左邊是土。"}},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：形近字",q:"「請把這段課文（　）寫一遍。」括號要填哪個字？",o:["秒", "抄", "妙", "炒"],a:1,why:"「抄寫」的抄是提手旁，用手寫；「秒針」的秒是禾部。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：形近字",q:"「我最討（　）下雨天。」括號要填哪個字？",o:["壓", "厭", "猒", "靨"],a:1,why:"「討厭」的厭下面沒有土；「壓住」的壓下面有土。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：細節",q:"絲帶要綁在哪一隻手？",o:["左手", "右手", "兩隻手", "頭上"],a:1,why:"班長說：請把絲帶綁在右手，有絲帶是右手，沒絲帶是左手。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：哪個錯",q:"下面關於課文的說法，哪一個是「錯」的？",o:["李文貴常常左右不分", "班長直接當面告訴李文貴要練習", "同學幫忙喊口令", "全班最後都綁上絲帶"],a:1,why:"班長是在桌上留字條，約他到司令臺，不是當面說。所以李文貴才覺得很神祕、心情不安。"},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：句子種類",q:"下面哪一句是「祈使句」（請求或要別人做事）？",o:["有大家的陪伴，真好！", "請把絲帶綁在右手。", "練習幾次後，我們都跳對了。", "十月太陽高高掛。"],a:1,why:"「請把絲帶綁在右手」是請別人做事，是祈使句。「有大家的陪伴，真好！」是表達強烈感受的感嘆句。",trap:{"0": "這句是表達感受的感嘆句，不是要別人做事。"}},
    {l:"第五課 飛舞的絲帶",lv:2,u:"陷阱：詞語辨析",q:"「這個任務十分（　），儘管他已經比別人努力，還是沒準時完成。」括號要填哪個詞？",o:["努力", "費力", "利用", "功用"],a:1,why:"「費力」是耗費精力或體力，說的是任務很吃力；「努力」是說人很認真。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：修辭",q:"「我的心好像被一塊大石頭壓住了。」這句話表示李文貴的心情怎樣？",o:["很開心", "心情很沉重、很擔心", "肚子痛", "真的被石頭壓到"],a:1,why:"這是譬喻，把擔心的感覺比成被大石頭壓住，表示心情沉重。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：修辭",q:"「中間那段動作快得像飛轉的秒針」想表達什麼？",o:["動作非常快", "動作很慢", "跳舞時要看手錶", "秒針壞了"],a:0,why:"秒針一直快速轉動，用它來比喻動作快到跟不上。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：仿寫",q:"「絲帶像彩蝶翩翩起舞」的結構是「東西像東西＋疊字＋動作」，哪一個仿寫正確？",o:["落葉像雪花紛紛飄落", "落葉在地上", "雪花很冷", "紛紛的落葉"],a:0,why:"「落葉像雪花紛紛飄落」：落葉像雪花＋紛紛（疊字）＋飄落（動作），結構一樣。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：課文理解",q:"為什麼全班同學最後都在手上綁絲帶？",o:["因為老師規定", "不讓李文貴那一排看起來奇怪，陪伴他", "因為絲帶很漂亮", "因為下雨了"],a:1,why:"李文貴擔心只有他們那排綁絲帶很奇怪，全班就一起綁上，用行動陪伴他。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：心情",q:"李文貴收到字條、走去司令臺時的心情是？",o:["很興奮", "懷著不安的心情", "很生氣", "很想睡覺"],a:1,why:"班長為什麼這麼神祕？他不知道原因，所以懷著不安的心情去司令臺。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：詞語應用",q:"「氣象局預報鋒面會接近，（　）下午就轉涼了。」括號要填哪個詞？",o:["竟然", "果然", "雖然", "終於"],a:1,why:"事情和預料的一樣用「果然」；出乎意料才用「竟然」。氣象局先預報了，所以是果然。",trap:{"0": "「竟然」是沒想到、出乎意料，這裡已經有預報，用「果然」。"}},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：詞語應用",q:"「回到教室，我的桌上（　）有張字條。」括號最適合填哪個詞？",o:["果然", "竟然", "必定", "終於"],a:1,why:"李文貴沒想到桌上會有字條，出乎意料，所以用「竟然」。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：句型",q:"下面哪一句「只要……就……」用得正確？",o:["只要你肯努力付出，就一定會有收穫", "只要下雨，可是我還是出門", "只要我很餓，因為吃飯", "只要就努力"],a:0,why:"「只要……就……」是條件句：只要做到前面的條件，就會有後面的結果。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：詞語辨析",q:"「各類能源如果可被善加（　），就能發揮最大的功用。」括號要填哪個詞？",o:["功用", "利用", "費力", "努力"],a:1,why:"「利用」是發揮物資的功用；後面已經有「功用」了，前面要填動作「利用」。"},
    {l:"第五課 飛舞的絲帶",lv:3,u:"融會貫通：生活應用",q:"如果班上同學練舞一直跳錯，下面哪個做法最像課文裡的同學？",o:["笑他跳不好", "叫他不要參加", "一起想辦法，陪他多練習幾次", "跟老師告狀"],a:2,why:"課文裡的同學想辦法、喊口令、陪著練習，用合作和陪伴幫同學解決問題。"},
    {l:"第六課 小女生",lv:1,u:"部首",q:"「蓋」這個字的部首是什麼？",o:["皿", "艸（艹）", "去", "土"],a:1,why:"「蓋」是艸部，部首外 10 畫，總共 14 畫，例如蓋被子、蓋房子。",trap:{"0": "下面是「皿」，但「蓋」的部首是上面的艸。"}},
    {l:"第六課 小女生",lv:1,u:"部首",q:"「柔」這個字的部首是什麼？",o:["矛", "木", "又", "十"],a:1,why:"「柔」是木部，部首外 5 畫，總共 9 畫，例如柔軟、溫柔。",trap:{"0": "上面的「矛」不是部首，部首是下面的「木」。"}},
    {l:"第六課 小女生",lv:1,u:"部首",q:"「揉」這個字的部首是什麼？",o:["木", "柔", "手（扌）", "矛"],a:2,why:"「揉」是手部，部首外 9 畫，總共 12 畫，用手反覆搓動，例如揉眼睛、揉麵團。"},
    {l:"第六課 小女生",lv:1,u:"課文內容",q:"課文裡的「小女生」其實是什麼？",o:["作者的妹妹", "作者家的一隻貓", "鄰居的小孩", "一隻小狗"],a:1,why:"課文最後說小女生是一隻黏人的「膠水貓」，是作者家裡的寵物貓。"},
    {l:"第六課 小女生",lv:1,u:"課文內容",q:"作者在家的時候，小女生會怎樣？",o:["躲起來睡覺", "緊緊的跟在作者身邊", "跑到外面玩", "不理作者"],a:1,why:"只要作者在家，牠都會緊緊的跟在作者身邊。"},
    {l:"第六課 小女生",lv:1,u:"課文內容",q:"小女生「心情好」的時候，聽到作者叫牠會怎麼做？",o:["不理作者", "邊走邊回應，一唱一和", "生氣的看著作者", "跑走"],a:1,why:"心情好的時候，作者叫一聲，牠喵一下，一唱一和，高高低低。"},
    {l:"第六課 小女生",lv:1,u:"課文內容",q:"小女生「心情不好」的時候，聽到作者叫牠會怎麼做？",o:["大聲喵喵叫", "安安靜靜的走來，用大眼睛不高興的看著作者", "跑去躲起來", "跳到桌上"],a:1,why:"心情不好時，牠會安安靜靜的走來，不高興的看著作者，像在說「到底什麼事啊？」"},
    {l:"第六課 小女生",lv:1,u:"課文內容",q:"小女生平時喜歡怎樣躺在沙發上？",o:["側躺", "四腳朝天的躺著", "趴著", "坐著"],a:1,why:"牠喜歡四腳朝天的躺在沙發上，露出毛茸茸的肚子。"},
    {l:"第六課 小女生",lv:1,u:"課文內容",q:"作者說小女生毛茸茸的肚子看起來像什麼？",o:["一顆球", "蓋上了一條白色小被子", "一朵雲", "一塊蛋糕"],a:1,why:"露出一條毛茸茸的肚子，看起來像蓋上了一條白色小被子。"},
    {l:"第六課 小女生",lv:1,u:"詞語",q:"作者為什麼說小女生是「膠水貓」？",o:["牠喜歡吃膠水", "牠很黏人，緊緊跟著作者", "牠的毛很黏", "牠是白色的"],a:1,why:"小女生總是緊緊跟在作者身邊，就像膠水一樣黏人。"},
    {l:"第六課 小女生",lv:1,u:"詞語",q:"「哪怕」是什麼意思？",o:["害怕", "就算是、即使", "哪裡", "怕黑"],a:1,why:"「哪怕」是就算是、即使。例如：哪怕正在角落睡得香甜，牠也會奮力睜開眼睛。",trap:{"0": "「哪怕」的怕不是害怕，整個詞是「就算是」的意思。"}},
    {l:"第六課 小女生",lv:1,u:"詞語",q:"「奮力」是什麼意思？",o:["生氣", "鼓起力量、盡力", "很累", "用力打"],a:1,why:"「奮力」是鼓起力量、盡力。小女生睡得很香，還是奮力睜開眼睛走過來。"},
    {l:"第六課 小女生",lv:1,u:"詞語",q:"「黏人」是什麼意思？",o:["用膠水黏東西", "緊纏著人、不肯放開", "不喜歡人", "咬人"],a:1,why:"「黏人」是緊纏著人、不肯放鬆，就像小女生一直跟在作者身邊。"},
    {l:"第六課 小女生",lv:1,u:"字音",q:"「回應」的「應」要怎麼念？",o:["ㄧㄥ", "ㄧㄥˋ", "ㄧㄥˊ", "ㄧㄥˇ"],a:1,why:"回應、答應、適應念 ㄧㄥˋ；應該、應有盡有念 ㄧㄥ。"},
    {l:"第六課 小女生",lv:1,u:"字音",q:"「應該」的「應」要怎麼念？",o:["ㄧㄥ", "ㄧㄥˋ", "ㄧㄥˊ", "ㄧㄥˇ"],a:0,why:"應該、應有盡有的「應」念一聲 ㄧㄥ。"},
    {l:"第六課 小女生",lv:1,u:"課文主旨",q:"這一課最想告訴我們什麼？",o:["貓很會睡覺", "要善待小動物", "不要養貓", "要買沙發"],a:1,why:"作者和貓溫馨相處，把牠當成重要的家人，主旨是要善待小動物。"},
    {l:"第六課 小女生",lv:1,u:"標點",q:"「我上洗手間，牠會喵喵叫；我關門洗澡，牠就叫得更大聲。」中間的「；」叫做什麼？",o:["逗號", "句號", "分號", "冒號"],a:2,why:"「；」是分號，用來分開兩個意思相關、結構相似的句子。"},
    {l:"第六課 小女生",lv:1,u:"詞語",q:"「柔細」是什麼意思？",o:["又硬又粗", "柔軟細微", "很長", "很亂"],a:1,why:"「柔細」是柔軟細微，作者摸小女生柔細的毛。"},
    {l:"第六課 小女生",lv:1,u:"課文內容",q:"小女生更喜歡把前腳放在哪裡？",o:["桌上", "作者的大腿上", "窗戶上", "碗裡"],a:1,why:"牠更喜歡把前腳放在作者的大腿上，輕輕的喵個不停，像在陪大家說話。"},
    {l:"第六課 小女生",lv:1,u:"詞語",q:"「一家人七嘴八舌講整晚」，「七嘴八舌」最可能是什麼意思？",o:["有七張嘴", "很多人你一句我一句，說個不停", "吃很多東西", "很安靜"],a:1,why:"大家你一句我一句的說，連小女生也跟著喵，所以十分熱鬧。"},
    {l:"第六課 小女生",lv:2,u:"陷阱：部首",q:"「平」這個字的部首是什麼？",o:["一", "干", "丷", "十"],a:1,why:"「平」是干部，部首外 2 畫，總共 5 畫。很多人會以為是一部。",trap:{"0": "第一筆是橫，但「平」的部首是「干」。"}},
    {l:"第六課 小女生",lv:2,u:"陷阱：部首",q:"「毛」這個字的部首是什麼？",o:["手", "毛", "丿", "乙"],a:1,why:"「毛」自己就是部首，部首外 0 畫，總共 4 畫。",trap:{"0": "「毛」和「手」很像，但毛的最後一筆是往右彎上去的。"}},
    {l:"第六課 小女生",lv:2,u:"陷阱：部首",q:"「肚」這個字的部首是什麼？",o:["月", "肉", "土", "日"],a:1,why:"「肚」左邊看起來像「月」，其實是「肉」字變成的偏旁，所以是肉部。和身體有關的字，例如肚、腳、胸，多是肉部。",trap:{"0": "左邊看起來像月，但和身體有關的「月」字旁，其實是肉部。"}},
    {l:"第六課 小女生",lv:2,u:"陷阱：讀音",q:"「他既然答應參加，應該就會準時出席。」兩個「應」依序怎麼念？",o:["ㄧㄥ、ㄧㄥˋ", "ㄧㄥˋ、ㄧㄥ", "ㄧㄥˋ、ㄧㄥˋ", "ㄧㄥ、ㄧㄥ"],a:1,why:"「答應」念 ㄧㄥˋ，「應該」念 ㄧㄥ。"},
    {l:"第六課 小女生",lv:2,u:"陷阱：形近字",q:"「我摸摸牠（　）細的毛。」括號要填哪個字？",o:["揉", "柔", "糅", "鞣"],a:1,why:"「柔細、溫柔」的柔是木部，形容東西軟；「揉」多了提手旁，是用手搓的動作。",trap:{"0": "「揉」是用手搓的動作，形容毛很軟要用「柔」。"}},
    {l:"第六課 小女生",lv:2,u:"陷阱：形近字",q:"「哪（　）睡得再香，牠也會睜開眼睛。」括號要填哪個字？",o:["柏", "伯", "怕", "拍"],a:2,why:"「哪怕」的怕是心部；「伯父」的伯是人部；「柏樹」的柏是木部。"},
    {l:"第六課 小女生",lv:2,u:"陷阱：形近字",q:"「我關門洗（　）。」括號要填哪個字？",o:["操", "澡", "噪", "躁"],a:1,why:"洗澡要用水，是三點水的「澡」。「操場」的操是手部；「噪音」的噪是口部；「急躁」的躁是足部。"},
    {l:"第六課 小女生",lv:2,u:"陷阱：形近字",q:"「春天到了，山上的（　）鵑花開了。」括號要填哪個字？",o:["肚", "社", "杜", "吐"],a:2,why:"「杜鵑」的杜是木部，和植物有關；「肚子」的肚是肉部；「社區」的社是示部。"},
    {l:"第六課 小女生",lv:2,u:"陷阱：形近字",q:"「牠半睜著眼，一（　）很享受的樣子。」括號要填哪個字？",o:["幅", "副", "福", "富"],a:1,why:"「一副」形容臉上的表情或神態；「篇幅、幅寬」的幅是巾部。"},
    {l:"第六課 小女生",lv:2,u:"陷阱：細節",q:"課文是在哪裡才「直接說出」小女生是一隻貓？",o:["第一段", "第二段", "第三段", "最後一段"],a:3,why:"前面只寫牠喵喵叫、四腳朝天，直到最後一段才說牠是「膠水貓」。"},
    {l:"第六課 小女生",lv:2,u:"陷阱：詞語辨析",q:"「觀賞螢火蟲對我來說是件（　）特別的事。」括號要填哪個詞？",o:["平常", "非常", "平時", "暫時"],a:1,why:"「非常」是特別、不尋常；「平常」是普通、平凡。這句是說很特別。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：拆詞法",q:"用拆詞法想一想：「奮力」的「奮」是鼓起、振作，「力」是力量，合起來是什麼意思？",o:["休息", "鼓起力量、盡力", "力氣很小", "生氣"],a:1,why:"把詞拆成兩個字，從字義推測：鼓起力量，也就是盡力。這是這課要學的拆詞法。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：標點應用",q:"下面哪一句的分號「；」用得正確？",o:["哥哥喜歡打球；姐姐喜歡畫畫。", "我今天；去學校。", "你吃飯了嗎；", "媽媽說；快來吃飯。"],a:0,why:"分號用來分開兩個意思相關、結構相似的句子，像「哥哥喜歡打球」和「姐姐喜歡畫畫」。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：句型",q:"下面哪一句「哪怕……也……」用得正確？",o:["哪怕成功的機會很低，我也要堅持到最後", "哪怕下雨，所以我不出門", "哪怕我很高興，因為放假", "我也要哪怕"],a:0,why:"「哪怕……也……」表示就算有前面的情況，還是會做後面的事。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：句型",q:"「小女生是一隻黏人的膠水貓，也是我重要的家人。」用了哪種句型？",o:["因為……所以……", "是……也是……", "雖然……可是……", "一……就……"],a:1,why:"「是……也是……」是並列句，用來說出同一個對象的兩種身分或特點。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：成語應用",q:"他走路時踩到自己的褲管，跌了個（　）。括號最適合填：",o:["七嘴八舌", "四腳朝天", "一唱一和", "高高低低"],a:1,why:"跌倒時手腳朝上，就是「四腳朝天」，課文用來形容小女生躺在沙發上的樣子。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：成語應用",q:"老師一宣布戶外教學的地點，大家就（　）的討論起來。括號最適合填：",o:["四腳朝天", "七嘴八舌", "安安靜靜", "慢慢"],a:1,why:"很多人你一句我一句說個不停，就是「七嘴八舌」。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：仿寫",q:"「安安靜靜的走來」的結構是「疊字＋的＋動作」，哪一個仿寫正確？",o:["匆匆忙忙的離開", "安靜的貓", "走來安靜", "很安靜"],a:0,why:"「匆匆忙忙（疊字）的離開（動作）」，和「安安靜靜的走來」結構一樣。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：寫作手法",q:"作者為什麼要把貓取名叫「小女生」？最可能的原因是？",o:["因為牠喜歡穿裙子", "牠像小女生一樣愛撒嬌、黏人，像可愛的小孩", "因為作者不知道牠是貓", "因為牠會說話"],a:1,why:"作者把貓寫得像人一樣有心情、會回應、會陪家人說話，取名「小女生」讓牠更像家人。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：生活應用",q:"下面哪一個是「善待小動物」的做法？",o:["拉牠的尾巴", "溫柔的摸摸牠，按時餵牠、陪牠", "把牠關在小箱子裡", "對牠大吼大叫"],a:1,why:"像作者一樣溫柔對待、陪伴小動物，把牠當成家人，就是善待小動物。"},
    {l:"第六課 小女生",lv:3,u:"融會貫通：詞語辨析",q:"「他今天表現只是（　）失常，很快就能發揮平時的水準。」括號要填哪個詞？",o:["平時", "暫時", "非常", "平常"],a:1,why:"「暫時」是短時間；後面說很快就能恢復，所以是暫時失常。"},
  ],
  science:[
    {l:"第一單元活動一 植物是什麼",lv:1,u:"生物與非生物",q:"自然環境中有哪兩大類？",o:["動物和石頭", "生物和非生物", "植物和花", "陽光和水"],a:1,why:"課本說：自然環境中有生物和非生物，生物中包含動物和植物。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"生物與非生物",q:"校園裡下面哪一個是「非生物」？",o:["樟樹", "蝴蝶", "石頭", "白頭翁"],a:2,why:"石頭沒有生命，是非生物。鞦韆、單槓、椅子也是非生物。樟樹是植物，蝴蝶和白頭翁是動物。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"動物與植物",q:"下面哪一個是植物？",o:["蝴蝶", "榕樹", "龜", "魚"],a:1,why:"榕樹、樟樹、仙丹花、南美蟛蜞菊都是植物，不會移動位置，可以自己製造養分。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"動物與植物",q:"下面哪一個是動物？",o:["仙丹花", "樟樹", "白頭翁", "南美蟛蜞菊"],a:2,why:"白頭翁是鳥，屬於動物，可以自由移動和覓食。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"動物與植物",q:"植物會利用什麼來製造養分？",o:["石頭和沙子", "陽光、水等", "別的動物", "鞦韆"],a:1,why:"植物會利用陽光、水等來製造養分，所以不用移動去找食物。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"動物與植物",q:"動物要怎麼得到營養？",o:["自己製造", "從外界攝取，大多要移動去覓食", "只要晒太陽", "把根伸進土裡"],a:1,why:"動物不像植物能自己製造養分，需要從外界攝取營養，所以多數動物必須移動去覓食。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"動物與植物",q:"植物的根伸入土壤中，可以幫助植物做什麼？",o:["走路", "固定植物", "開花", "發光"],a:1,why:"幾乎所有植物都停在固定位置生長，根伸入土壤中可以固定植物。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"植物的身體",q:"植物的身體分為哪幾個部分？",o:["頭、身體、腳", "根、莖、葉、花、果實、種子", "葉、花、刺", "根、葉、翅膀"],a:1,why:"植物的身體分為根、莖、葉、花、果實和種子六個部分。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"植物的身體",q:"植物的哪一個部分，要「挖開泥土」才能觀察到？",o:["葉", "花", "根", "莖"],a:2,why:"根長在土裡，要挖開泥土才能觀察到。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"植物的身體",q:"植物的哪一個部分，要「剖開果實」才能看到？",o:["種子", "花", "葉", "莖"],a:0,why:"種子藏在果實裡面，要剖開果實才能看到。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"植物的身體",q:"下面哪一組是植物「容易直接觀察到」的部分？",o:["根和種子", "莖、葉、花和果實", "只有根", "只有種子"],a:1,why:"莖、葉、花和果實長在外面，容易直接觀察；根和種子要挖開泥土或剖開果實才看得到。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"植物的身體",q:"長春花（日日春）的果實成熟後，打開會看到什麼？",o:["黑色的小顆粒種子", "一隻小蟲", "白色的根", "綠色的葉子"],a:0,why:"長春花的果實是細長的夾狀，成熟後裂開，會露出黑色的小顆粒，那就是種子。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"安全守則",q:"觸摸植物之後，應該怎麼做？",o:["舔舔手指", "把手洗乾淨", "直接吃東西", "不用管它"],a:1,why:"有些植物有毒性，所以觸摸植物後要把手洗乾淨。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"安全守則",q:"觀察植物時，看到植物上面有小動物，應該怎麼做？",o:["抓起來玩", "不要觸碰牠", "把牠趕走", "用手戳牠"],a:1,why:"課本提醒：不要觸碰植物上面的小動物。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"有毒植物",q:"很多植物會有毒性，原因是什麼？",o:["植物想傷害人", "植物為了保護自己、避免受到傷害", "因為植物生病了", "因為下雨"],a:1,why:"有毒是植物為了保護自己、避免受到傷害，所發展出來的求生之道。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"有毒植物",q:"下面哪一個是課本介紹的「常見有毒植物」？",o:["小白菜", "夾竹桃", "菠菜", "蔥"],a:1,why:"課本介紹的常見有毒植物有聖誕紅、杜鵑、馬纓丹、常春藤、黛粉葉、黃金葛、姑婆芋、曼陀羅、夾竹桃。"},
    {l:"第一單元活動一 植物是什麼",lv:1,u:"植物的身體",q:"觀察植物時，可以用什麼工具把細小的地方看得更清楚？",o:["放大鏡", "剪刀", "鏟子", "望遠鏡"],a:0,why:"課本的校園觀察用放大鏡，幫助看清楚葉子、花等細小的構造。"},
    {l:"第一單元活動一 植物是什麼",lv:2,u:"陷阱：不是",q:"下面哪一個「不是」生物？",o:["榕樹", "龜", "單槓", "白頭翁"],a:2,why:"單槓是遊樂器材，沒有生命，是非生物。榕樹是植物，龜和白頭翁是動物，都是生物。"},
    {l:"第一單元活動一 植物是什麼",lv:2,u:"陷阱：判斷對錯",q:"有人說：「榕樹和蝴蝶都是植物。」這句話對嗎？",o:["對，兩個都是植物", "不對，榕樹是植物，蝴蝶是動物，但兩個都是生物", "不對，兩個都是非生物", "不對，兩個都是動物"],a:1,why:"榕樹是植物，蝴蝶是動物，它們都屬於生物，但不是都是植物。"},
    {l:"第一單元活動一 植物是什麼",lv:2,u:"陷阱：判斷對錯",q:"生物裡面包含哪些？",o:["只有動物", "只有植物", "動物和植物", "石頭和椅子"],a:2,why:"生物包含動物和植物，兩者都有生命。",trap:{"0": "植物也是生物喔，不要忘了。"}},
    {l:"第一單元活動一 植物是什麼",lv:2,u:"陷阱：比較",q:"植物和動物最大的不同是什麼？",o:["植物沒有生命", "植物能自己製造養分、不會移動位置", "動物不會長大", "植物會走路"],a:1,why:"植物能用陽光、水等自己製造養分，不會移動；動物不能自己製造養分，要移動去覓食。",trap:{"0": "植物也是有生命的生物，只是不會移動。"}},
    {l:"第一單元活動一 植物是什麼",lv:2,u:"陷阱：哪個錯",q:"觀察校園植物時，下面哪個做法是「錯」的？",o:["觸摸後把手洗乾淨", "用放大鏡觀察", "嘗嘗葉子的味道", "不碰植物上的小動物"],a:2,why:"觀察植物不能嘗葉子的味道，因為有些植物有毒，可能會誤食。"},
    {l:"第一單元活動一 植物是什麼",lv:2,u:"陷阱：有毒植物",q:"關於有毒植物，下面哪一個說法正確？",o:["有毒植物都要全部砍掉", "只要不觸摸汁液、不食用，它們還能讓環境更美麗", "有毒植物不能種在任何地方", "看一眼就會中毒"],a:1,why:"課本說：只要了解植物特性，避免觸摸汁液或食用，有毒植物不會傷害我們，還能讓環境更美麗。",trap:{"0": "有毒植物不用全部砍掉，只要注意不要碰汁液、不要吃。"}},
    {l:"第一單元活動一 植物是什麼",lv:2,u:"陷阱：觀察方法",q:"下面哪一個部分，「不能」只用眼睛從外面直接觀察到？",o:["莖", "葉", "花", "根"],a:3,why:"根長在泥土下面，要挖開泥土才能觀察；莖、葉、花長在外面，容易直接觀察。"},
    {l:"第一單元活動一 植物是什麼",lv:3,u:"融會貫通：推理",q:"小明說：「石頭不會動，所以石頭是植物。」他錯在哪裡？",o:["石頭會動", "石頭沒有生命，是非生物；植物雖然不會移動，但是會自己製造養分", "石頭是動物", "他沒有錯"],a:1,why:"不會動不代表是植物。植物是有生命的生物，會用陽光和水製造養分；石頭沒有生命，是非生物。"},
    {l:"第一單元活動一 植物是什麼",lv:3,u:"融會貫通：推理",q:"為什麼大多數的動物需要到處移動？",o:["因為喜歡玩", "因為不能自己製造養分，要去找食物", "因為怕曬太陽", "因為根太短"],a:1,why:"動物需要從外界攝取營養，所以要移動去覓食；植物能自己製造養分，就不用移動。"},
    {l:"第一單元活動一 植物是什麼",lv:3,u:"融會貫通：生活應用",q:"妹妹想把聖誕紅的葉子放進嘴巴裡，你應該怎麼做？",o:["跟她一起吃", "阻止她，因為聖誕紅是有毒植物", "說只能吃一片", "拍照留念"],a:1,why:"聖誕紅是課本介紹的有毒植物，不能放進嘴巴，摸過後也要洗手。"},
    {l:"第一單元活動一 植物是什麼",lv:3,u:"融會貫通：推理",q:"如果一棵小樹沒有根，最可能會發生什麼事？",o:["長得更快", "沒辦法固定在土裡，容易倒下", "會開更多花", "會自己走路"],a:1,why:"根伸入土壤中可以固定植物，沒有根，植物就站不穩。"},
    {l:"第一單元活動一 植物是什麼",lv:3,u:"融會貫通：推理",q:"不同的植物長得很不一樣，課本說這是為了什麼？",o:["為了好看", "為了適應環境，有利生長和繁殖", "因為它們不是植物", "因為被人修剪"],a:1,why:"不同植物為了適應環境、方便生長和繁殖，外形差異很大，但身體仍都有根、莖、葉、花、果實、種子。"},
    {l:"第一單元活動一 植物是什麼",lv:3,u:"融會貫通：分類應用",q:"校園裡看到「溜滑梯、蝸牛、樟樹」，正確的分類是？",o:["都是生物", "溜滑梯是非生物；蝸牛是動物；樟樹是植物", "都是植物", "溜滑梯是植物"],a:1,why:"溜滑梯是沒有生命的遊樂器材（非生物）；蝸牛會移動覓食（動物）；樟樹會自己製造養分（植物）。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的葉",q:"一片葉子具有哪三種特徵？",o:["顏色、大小、味道", "葉形、葉緣、葉脈", "根、莖、花", "果實、種子、芽"],a:1,why:"一片葉子具有葉形、葉緣和葉脈等特徵，可以用來辨別不同的植物。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的葉",q:"「葉緣」是指葉子的什麼？",o:["葉子的形狀", "葉子的邊緣", "葉子上的脈紋", "葉子的顏色"],a:1,why:"葉緣是葉子的邊緣，有的平滑完整，有的是鋸齒狀。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的葉",q:"葉脈有什麼功能？",o:["讓葉子變漂亮", "輸送水分和養分", "讓葉子會動", "製造種子"],a:1,why:"葉脈是葉子上的脈紋，可以輸送水分和養分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的葉",q:"桂花葉的葉脈像網子一樣互相交錯，這叫做什麼？",o:["平行脈", "網狀脈", "直線脈", "鋸齒脈"],a:1,why:"像網子互相交錯的是網狀脈，例如桂花葉。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的葉",q:"百合葉的葉脈一條一條像直線，這叫做什麼？",o:["網狀脈", "平行脈", "鋸齒脈", "輪生脈"],a:1,why:"一條一條像直線般並列的是平行脈，例如百合葉。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"光合作用",q:"葉子進行光合作用時，需要哪些原料？",o:["陽光、二氧化碳和水", "氧氣和土壤", "石頭和沙子", "只要黑暗"],a:0,why:"葉子利用太陽的光、空氣中的二氧化碳和根吸收的水，合成植物需要的養分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"光合作用",q:"光合作用會製造出什麼？",o:["二氧化碳和石頭", "養分（葡萄糖）和氧氣", "只有水", "種子"],a:1,why:"光合作用合成植物生長需要的養分（葡萄糖），同時產生氧氣。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的葉",q:"春天和夏天，葉子看起來是綠色的，是因為含有很多什麼？",o:["花青素", "葉綠素", "葉黃素", "類胡蘿蔔素"],a:1,why:"葉綠素是綠色的，春、夏季葉子裡有很多葉綠素，所以看起來是綠色。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"葉序",q:"植物的葉子是從莖或枝條上的哪裡長出來的？",o:["根", "節", "花", "種子"],a:1,why:"葉子從莖或枝條上的「節」長出來，節也是芽萌發的地方。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"葉序",q:"一個節上只長出一片葉子，叫做什麼？",o:["互生", "對生", "輪生", "叢生"],a:0,why:"一個節上只長一片葉子是互生，例如榕樹、朱槿。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"葉序",q:"一個節上長出兩片葉子，叫做什麼？",o:["互生", "對生", "輪生", "叢生"],a:1,why:"一個節上長兩片葉子是對生，例如桂花、福木。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"葉序",q:"一個節上長出三片或三片以上的葉子，叫做什麼？",o:["互生", "對生", "輪生", "單生"],a:2,why:"一個節上長三片以上葉子是輪生，例如黑板樹、軟枝黃蟬。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"葉序",q:"葉子在莖上相互錯開生長，是為了什麼？",o:["比較好看", "爭取更多的陽光來製造養分", "讓蟲吃不到", "比較好摘"],a:1,why:"葉子相互錯開生長，下面的葉子也能照到陽光，才能製造更多養分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的莖",q:"植物的莖有什麼功能？",o:["只用來好看", "支撐植物身體，並運輸水分和養分", "製造種子", "吸收空氣中的水"],a:1,why:"莖可以支撐植物身體、幫助植物往陽光方向生長，也能運輸水分和養分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的莖",q:"下面哪一種植物是「木本莖」？",o:["長春花", "木棉", "牽牛花", "絲瓜"],a:1,why:"木本莖粗壯堅硬、直立高大，例如木棉、樟樹、小葉欖仁。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的莖",q:"下面哪一種植物是「藤本莖」？",o:["樟樹", "長春花", "牽牛花", "木棉"],a:2,why:"藤本莖細小柔軟，無法直立，要依靠其他物體攀爬，例如牽牛花、絲瓜。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的莖",q:"下面哪一種植物是「草本莖」？",o:["大花咸豐草", "木棉", "絲瓜", "小葉欖仁"],a:0,why:"草本莖細小柔軟但能直立，會長出很多枝條，例如長春花、大花咸豐草。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"喬木與灌木",q:"下面哪一種是「喬木」？",o:["月橘", "杜鵑", "樟樹", "長春花"],a:2,why:"喬木有明顯主幹，可以長到 5 公尺以上，例如樟樹、木棉。月橘、杜鵑是灌木。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"特殊的莖",q:"仙人掌的莖有什麼特別的功能？",o:["可以飛", "可以儲存水分", "可以吃蟲", "可以發光"],a:1,why:"仙人掌的莖肥厚，可以儲存水分。馬鈴薯的莖可以儲存養分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的根",q:"植物的根有哪兩個主要功能？",o:["固定植物、吸收水分", "開花、結果", "製造養分、產生氧氣", "保護種子、傳播花粉"],a:0,why:"根可以抓住土壤、固定植物，也會吸收植物生長需要的水分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的根",q:"下面哪一種植物的根是「軸根」？",o:["蔥", "蒜", "菠菜", "以上都是鬚根"],a:2,why:"軸根有一條較粗的主根，旁邊有細小的根，例如莧菜、小白菜、菠菜。蔥、蒜是鬚根。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"植物的根",q:"下面哪一種植物的根是「鬚根」？",o:["小白菜", "莧菜", "菠菜", "蔥"],a:3,why:"鬚根全部細細小小的，沒有主根，例如蔥、蒜。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"特殊的根",q:"甘藷（地瓜）的根特別肥大，叫做什麼根？有什麼功能？",o:["氣生根，吸收空氣中的水", "塊根，儲存水分和養分", "板根，幫助站穩", "鬚根，固定植物"],a:1,why:"甘藷的塊根特別肥大，可以儲存水分和養分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"特殊的根",q:"印度橡膠樹有些根暴露在空氣中，可以吸收空氣中的水分，叫做什麼？",o:["塊根", "板根", "氣生根", "軸根"],a:2,why:"暴露在空氣中、能吸收空氣中水分的根叫氣生根。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:1,u:"特殊的根",q:"銀葉樹板狀的根（板根）有什麼功能？",o:["儲存養分", "擴展抓地面積，讓樹站穩不倒", "吸收空氣中的水", "製造氧氣"],a:1,why:"板根能擴展抓地的面積，讓樹穩穩向上伸展，避免傾倒。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：葉形",q:"有些葉子形狀細長，例如針形或線形，這樣的葉形對植物有什麼幫助？",o:["照到更多陽光", "適應寒冷或風大的環境", "讓葉子更好吃", "讓葉脈變多"],a:1,why:"細長的葉子可以幫助植物適應寒冷或風大的環境；寬大的心形、卵形葉才是為了照到更多陽光。",trap:{"0": "照到更多陽光是寬大葉形（心形、卵形）的好處。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：葉子變色",q:"秋天葉子會變黃、變紅，原因是什麼？",o:["葉子生病了", "低溫破壞了葉綠素，讓其他色素的顏色顯現出來", "葉子被太陽晒傷", "葉子長出新的顏色"],a:1,why:"葉子本來就有葉黃素、類胡蘿蔔素、花青素等色素。秋天低溫破壞綠色的葉綠素，其他顏色就顯現出來了。",trap:{"3": "那些顏色本來就在葉子裡，只是被綠色的葉綠素蓋住了。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：葉序判斷",q:"判斷葉序（互生、對生、輪生）時，要看什麼？",o:["整棵植物有幾片葉子", "「一個節」上長出幾片葉子", "葉子有多大", "葉子是什麼顏色"],a:1,why:"葉序要看單一個節上長幾片葉子：1 片互生、2 片對生、3 片以上輪生，不是數整棵植物的葉子。",trap:{"0": "不是數整棵植物，而是看「一個節」上長幾片。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：叢生現象",q:"車前草的葉子集中生長在一起，這是什麼現象？原因是什麼？",o:["輪生，因為葉子很多", "叢生現象，因為節間太短", "對生，因為葉子成對", "互生，因為一節一片"],a:1,why:"兩個相鄰的節之間的距離叫節間，節間太短時葉子會集中生長，叫做叢生現象。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：喬木與灌木",q:"喬木和灌木最主要的差別是什麼？",o:["顏色不同", "喬木有明顯主幹，灌木沒有明顯主幹、從地面附近就分枝", "灌木是草本植物", "喬木會開花，灌木不會"],a:1,why:"兩個都是木本植物。喬木主幹明顯、離地一段距離才分枝；灌木沒有明顯主幹，從地面附近就分枝。",trap:{"2": "灌木也是木本植物，莖是硬的。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：草本與藤本",q:"一種植物的莖細小柔軟，但是「能直立」，還會長出很多枝條，它是哪一種莖？",o:["木本莖", "草本莖", "藤本莖", "卷鬚莖"],a:1,why:"草本莖柔軟但能直立；藤本莖柔軟而且無法直立，要依靠物體攀爬。",trap:{"2": "藤本莖無法直立，要靠攀爬；這題說「能直立」，是草本莖。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：實驗設計",q:"根吸水實驗中，用膠泥（油土）把瓶口封住，目的是什麼？",o:["把植物固定住", "避免水分從瓶口散失，影響實驗結果", "讓瓶子比較好看", "讓植物長得更快"],a:1,why:"封住瓶口是為了不讓水從瓶口蒸發散失，這樣水位下降才能確定是根吸收的。",trap:{"0": "膠泥不是用來固定植物的，是防止水從瓶口跑掉。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：運輸方向",q:"關於植物運送水分和養分，哪一個說法正確？",o:["養分是根製造的", "葉子製造的養分，經由莖送到根部", "水分是葉子從空氣中吸收後送到根", "莖會自己製造水"],a:1,why:"葉子行光合作用製造養分，經莖送到根部；水分則由根吸收，經莖運送到植物生長的部位。",trap:{"0": "製造養分的是葉子，根負責吸收水分。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：根的深淺",q:"鬚根通常生長在土壤的哪裡？",o:["土壤的深層", "土壤的淺層", "空氣中", "水裡"],a:1,why:"鬚根細細小小，生長在土壤淺層；軸根有粗大主根，可以深入土壤深層。",trap:{"0": "深入土壤深層的是軸根。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：根還是莖",q:"馬鈴薯和甘藷都長在土裡、都很肥大，哪一個是「莖」？",o:["馬鈴薯", "甘藷", "兩個都是根", "兩個都是莖"],a:0,why:"馬鈴薯是儲存養分的莖；甘藷（地瓜）是肥大的塊根。長在土裡的不一定是根。",trap:{"1": "甘藷是塊根，馬鈴薯才是莖。"}},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：不包括",q:"光合作用的原料「不包括」下面哪一個？",o:["陽光", "水", "二氧化碳", "氧氣"],a:3,why:"氧氣是光合作用產生出來的，不是原料。原料是陽光、二氧化碳和水。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：特殊的莖",q:"瓠瓜會長出捲捲的構造纏繞其他物體，那是什麼？",o:["卷鬚根", "卷鬚莖", "葉脈", "氣生根"],a:1,why:"瓠瓜長出的是卷鬚莖，會纏繞其他物體來支撐主莖。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:2,u:"陷阱：葉序實例",q:"桂花葉在一個節上長兩片，它的葉序是？",o:["互生", "對生", "輪生", "叢生"],a:1,why:"一個節上長兩片葉子是對生，桂花和福木都是對生。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：實驗推理",q:"根吸水實驗放了一段時間後，瓶子裡的水位下降了，這表示什麼？",o:["水被太陽晒乾了", "植物的根會吸收水分", "瓶子破了", "葉子把水喝掉了"],a:1,why:"瓶口已經用膠泥封住，水不會從瓶口散失，所以水位下降是根吸收了水分。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：實驗推理",q:"如果根吸水實驗「沒有」用膠泥封住瓶口，水位下降了，還能確定是根吸水嗎？",o:["可以，一定是根吸的", "不能確定，水也可能從瓶口蒸發散失", "可以，因為植物還活著", "水位不會下降"],a:1,why:"沒有封口，水可能從瓶口蒸發，就不能確定水位下降完全是根吸收的。這就是膠泥封口的原因。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：生活應用",q:"學校想在操場旁種一排植物當圍籬，下面哪一種最適合？",o:["樟樹（喬木）", "月橘（灌木）", "牽牛花（藤本）", "車前草"],a:1,why:"灌木沒有明顯主幹，從地面附近就分枝，長得密密的，所以常用來當圍籬，例如月橘、杜鵑。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：觀察判斷",q:"小華發現一根枝條上，每個節都長出 2 片葉子，這種植物的葉序是？",o:["互生", "對生", "輪生", "叢生"],a:1,why:"看單一個節：每個節長 2 片葉子，就是對生。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：推理",q:"住在寒冷、風很大的高山上的植物，葉子最可能是什麼形狀？",o:["大大的心形", "細長的針形", "寬寬的卵形", "圓圓的大葉子"],a:1,why:"細長的針形或線形葉子，可以幫助植物適應寒冷或風大的環境。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：觀察判斷",q:"把一根蔥拔起來，看到底下的根全部細細小小、沒有一條特別粗。這是哪一種根？",o:["軸根", "鬚根", "塊根", "板根"],a:1,why:"沒有主根、全部細細小小的是鬚根，蔥和蒜都是。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：推理",q:"秋天楓樹的葉子變成紅色，主要是哪一種色素的顏色顯現出來了？",o:["葉綠素", "花青素", "二氧化碳", "氧氣"],a:1,why:"花青素是紅色的；秋天低溫破壞葉綠素後，花青素的紅色就顯現出來。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：推理",q:"絲瓜為什麼要沿著竹竿往上爬？",o:["因為它喜歡竹子", "因為它是藤本莖，無法直立，要依靠物體攀爬才能獲得陽光", "因為它要找水", "因為它是喬木"],a:1,why:"藤本莖柔軟無法直立，要依靠其他物體向上或向外攀爬，才能照到陽光。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：生活應用",q:"植物忘記澆水，葉子都下垂了。應該把水澆在哪裡？為什麼？",o:["澆在葉子上，因為葉子會喝水", "澆在土壤上，因為根會吸收水分", "不用澆，曬太陽就好", "澆在花上"],a:1,why:"植物生長需要的水是由根部吸收，所以要澆在土壤上，不久葉子就會慢慢挺立。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：推理",q:"海邊風很大，銀葉樹的哪一個構造可以幫助它不被吹倒？",o:["氣生根", "板根", "塊根", "葉綠素"],a:1,why:"板根像板子一樣擴展抓地面積，讓樹穩穩站著，避免傾倒。"},
    {l:"第一單元活動二 植物如何獲取陽光和水",lv:3,u:"融會貫通：推理",q:"大樹底下的小草也想照到陽光，大樹的葉子怎麼生長，可以讓自己下面的葉子也照到陽光？",o:["全部疊在一起", "相互錯開生長", "全部朝下", "只長在根上"],a:1,why:"葉子在莖上相互錯開生長，避免互相遮擋，讓下面的葉子也能接收陽光。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "開花的季節", "q": "植物開花的時間不一樣，是受到什麼的影響？", "o": ["溫度和光照", "土壤的顏色", "動物的數量", "人們的喜好"], "a": 0, "why": "課本說：植物受到溫度和光照的影響，開花的時間並不相同。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "開花的季節", "q": "春季時，可以看到哪些花開？", "o": ["櫻花和杜鵑", "荷花和金針花", "臺灣欒樹的花", "梅花"], "a": 0, "why": "春季有櫻花和杜鵑；夏季有荷花和金針花；秋季有臺灣欒樹；冬季有梅花。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "開花的季節", "q": "夏季接續登場的花是哪兩種？", "o": ["梅花和櫻花", "荷花和金針花", "杜鵑和梅花", "臺灣欒樹和櫻花"], "a": 1, "why": "夏季時，荷花和金針花接續登場。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "開花的季節", "q": "秋季時，哪一種樹開出金黃色、十分燦爛的花？", "o": ["臺灣欒樹", "梅花", "櫻花", "杜鵑"], "a": 0, "why": "到了秋季，臺灣欒樹金黃色的花十分燦爛。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "開花的季節", "q": "在寒冷的冬季，也能看到哪一種花精神抖擻的綻放？", "o": ["荷花", "金針花", "梅花", "杜鵑"], "a": 2, "why": "即使在寒冷的冬季，也能看到梅花精神抖擻的綻放。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "花的構造", "q": "一般植物的花，主要可以分成哪四個部分？", "o": ["花萼、花瓣、雄蕊、雌蕊", "根、莖、葉、花", "花瓣、果實、種子、葉", "花粉、花蜜、花瓣、刺"], "a": 0, "why": "一般植物的花主要分為花萼、花瓣、雄蕊和雌蕊四個部分。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "授粉", "q": "雄蕊上的花粉傳到雌蕊上，這個過程叫做什麼？", "o": ["授粉", "光合作用", "發芽", "落葉"], "a": 0, "why": "開花是為了讓雄蕊上的花粉傳到雌蕊上，這個過程稱為「授粉」。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "授粉", "q": "植物開花，是為了什麼？", "o": ["讓花園更漂亮", "授粉，讓植物能繁衍下一代", "吸收更多水分", "固定植物的身體"], "a": 1, "why": "開花是為了授粉，讓植物能繁衍下一代。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "授粉", "q": "有些植物用什麼來吸引動物，幫忙把花粉傳出去？", "o": ["鮮豔的花瓣、香甜的花蜜或特殊的氣味", "尖尖的刺", "很粗的根", "堅硬的莖"], "a": 0, "why": "植物利用鮮豔的花瓣、香甜的花蜜或特殊的氣味吸引動物，動物在不同花朵間採食，花粉就傳播出去了。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "完全花與不完全花", "q": "花萼、花瓣、雄蕊、雌蕊四個部分都有的花，叫做什麼？", "o": ["完全花", "不完全花", "雄花", "雌花"], "a": 0, "why": "四個部分都有的花稱為「完全花」，例如玫瑰、朱槿。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "完全花與不完全花", "q": "下面哪一個是課本舉例的「完全花」？", "o": ["朱槿", "絲瓜的雄花", "絲瓜的雌花", "臺灣欒樹的果實"], "a": 0, "why": "玫瑰、朱槿是完全花；絲瓜的雄花、雌花各少了一部分，是不完全花。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "完全花與不完全花", "q": "缺少花萼、花瓣、雄蕊、雌蕊其中一個部分的花，叫做什麼？", "o": ["不完全花", "完全花", "果實", "種子"], "a": 0, "why": "缺少其中一個部分的花，稱為「不完全花」。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "完全花與不完全花", "q": "絲瓜的花中，只有雄蕊的花叫做什麼？", "o": ["雄花", "雌花", "完全花", "果實"], "a": 0, "why": "絲瓜只有雄蕊的花稱為雄花，只有雌蕊的花稱為雌花。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "完全花與不完全花", "q": "絲瓜的花中，只有雌蕊的花叫做什麼？", "o": ["雄花", "雌花", "完全花", "種子"], "a": 1, "why": "只有雌蕊的花稱為雌花。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "果實和種子", "q": "植物開花後，如果授粉成功，花的哪一個部分會發育、結出果實？", "o": ["雌蕊", "雄蕊", "花瓣", "花萼"], "a": 0, "why": "授粉成功後，雌蕊就會開始發育、結出果實，果實裡有種子。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "果實和種子", "q": "果實裡面有什麼？", "o": ["種子", "根", "葉子", "花瓣"], "a": 0, "why": "果實裡有種子。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "果實和種子", "q": "果實的主要功能是什麼？", "o": ["保護種子和幫助種子傳播", "吸收水分", "製造養分", "吸引花粉"], "a": 0, "why": "課本說：果實的主要功能是保護種子和幫助種子傳播。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "果實和種子", "q": "龍眼的果實裡有幾顆種子？", "o": ["1 顆", "6 顆", "許多顆", "沒有種子"], "a": 0, "why": "龍眼：咖啡色外殼、白色果肉，果實內有 1 顆黑色的種子。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "果實和種子", "q": "木瓜的果實裡，種子的情形是？", "o": ["有許多黑色的種子", "只有 1 顆種子", "通常有 6 顆種子", "沒有種子"], "a": 0, "why": "木瓜果實內有許多黑色的種子。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "果實和種子", "q": "臺灣欒樹的果實裡，通常有幾顆種子？", "o": ["6 顆", "1 顆", "許多顆", "2 顆"], "a": 0, "why": "臺灣欒樹的果實很輕，外形像氣球，果實內通常有 6 顆種子。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "種子的傳播", "q": "臺灣欒樹的種子是靠什麼傳播？", "o": ["風力", "動物", "水流", "人類"], "a": 0, "why": "臺灣欒樹的果實很輕、像氣球，傳播方式是風力。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "種子的傳播", "q": "龍眼和木瓜的種子是靠什麼傳播？", "o": ["動物", "風力", "水流", "自己彈開"], "a": 0, "why": "龍眼、木瓜的果實香甜，傳播方式是動物。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "植物與生活", "q": "稻子可以煮成米飯，這是植物在生活中哪一方面的用途？", "o": ["食", "住", "育、樂"], "a": 0, "why": "食：稻子可以煮成米飯，還有柳橙、萵苣等。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "植物與生活", "q": "木屋和木製家具，是用植物的哪一個部分做成的？", "o": ["莖", "根", "花", "種子"], "a": 0, "why": "有些房屋和家具是用植物的莖做成，例如木屋、木製家具。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "植物與生活", "q": "植物園和陽明山花鐘，是植物在生活中哪一方面的用途？", "o": ["育、樂", "食", "住"], "a": 0, "why": "育、樂：植物可以作為自然教學的場所，也可以美化環境，例如植物園和陽明山花鐘。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 1, "u": "植物與自然", "q": "為什麼說植物在大自然中非常重要？", "o": ["可以提供其他生物居住、棲息的場所，也是動物的食物來源", "會吃掉其他動物", "會讓動物生病", "會移動去陪動物玩"], "a": 0, "why": "植物可以提供其他生物居住及棲息場所，也可以作為其他動物的食物來源。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "u": "陷阱：不是", "q": "下面哪一個「不是」花的基本構造？", "o": ["種子", "花萼", "雄蕊", "雌蕊"], "a": 0, "why": "花的四個部分是花萼、花瓣、雄蕊、雌蕊。種子是在果實裡面。", "trap": {"1": "花萼是花最下面綠色的部分，它是花的構造喔。"}},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 2, "u": "陷阱：判斷對錯", "q": "有人說：「所有的果實裡面都有很多種子。」這句話對嗎？", "o": ["不對，像龍眼只有 1 顆種子", "對，每個果實都有很多種子", "不對，果實裡面都沒有種子", "不對，種子長在花瓣上"], "a": 0, "why": "不同植物的種子數量不一樣：龍眼 1 顆、臺灣欒樹通常 6 顆、木瓜有許多顆。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "u": "融會貫通：推理", "q": "絲瓜的雌花只有雌蕊、沒有雄蕊，所以它是什麼花？", "o": ["不完全花", "完全花", "果實", "葉子"], "a": 0, "why": "缺少四個部分中任何一個，就是不完全花。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "u": "融會貫通：推理", "q": "如果都沒有動物來採花蜜，靠動物傳播花粉的植物可能會怎樣？", "o": ["比較難授粉，也比較難結出果實", "長得更高", "開更多花瓣", "根變得更粗"], "a": 0, "why": "這些植物靠動物在花朵間採食來傳播花粉；沒有動物，花粉就傳不出去，比較難授粉、結果。"},
    {"l": "第一單元活動三 花、果實和種子有什麼功能", "lv": 3, "ext": true, "u": "看圖・花的構造", "t": "multi", "legend": true, "q": "看圖，選出每一個代號是花的哪一個部分。", "o": ["花瓣", "花萼", "雄蕊", "雌蕊"], "parts": [{"s": "圖中「甲」是哪一個部分？", "a": 0, "why": "甲是展開、顏色鮮豔的花瓣。"}, {"s": "圖中「乙」是哪一個部分？", "a": 2, "why": "乙是頂端有花粉（黃色）的雄蕊。"}, {"s": "圖中「丙」是哪一個部分？", "a": 3, "why": "丙是在花中央、最長的那一枝，是雌蕊。"}, {"s": "圖中「丁」是哪一個部分？", "a": 1, "why": "丁在花的最下面、綠色的，是花萼。"}], "why": "一般的花有花萼、花瓣、雄蕊、雌蕊四部分：花萼在最下面、綠色；花瓣鮮豔；雄蕊頂端有花粉；雌蕊在正中央。", "img": "<svg viewBox=\"0 0 340 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"340\" height=\"300\" rx=\"14\" fill=\"#FFF6FB\"/><path d=\"M170 290 L170 190\" stroke=\"#4F9A4A\" stroke-width=\"8\" stroke-linecap=\"round\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(-60 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(-20 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(20 170 175) translate(0 0)\"/><ellipse cx=\"170\" cy=\"120\" rx=\"26\" ry=\"62\" fill=\"#F48FB8\" stroke=\"#3B3355\" stroke-width=\"2.5\" transform=\"rotate(60 170 175) translate(0 0)\"/><path d=\"M170 180 Q152.0 140 140 92\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"140\" cy=\"88\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q161.0 140 155 82\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"155\" cy=\"78\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q179.0 140 185 82\" stroke=\"#C9A33A\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"185\" cy=\"78\" rx=\"6\" ry=\"8\" fill=\"#FFD45C\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><path d=\"M170 180 Q188.0 140 200 92\" stroke=\"#C9A33A
