  science:[
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "水的三態", "q": "大自然中的水形成雲、霧、雨、雪、露、霜、雹，主要是因為什麼？", "o": ["溫度不同，水有三態變化", "風向改變", "月亮的引力", "地震"], "a": 0, "why": "大自然中的水會因為溫度不同，形成不同形態的水。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "水的三態", "q": "水的三種狀態是什麼？", "o": ["氣態、液態、固態", "冷、溫、熱", "雲、雨、雪", "大、中、小"], "a": 0, "why": "水有氣態（水蒸氣）、液態（水）和固態（冰）。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "雲和霧", "q": "雲是怎麼形成的？", "o": ["水蒸氣上升遇冷，附著在微粒上形成小水滴或冰晶，飄浮在空中", "煙飄到天上", "海水直接飛上天", "灰塵聚在一起"], "a": 0, "why": "地表的水蒸發成水蒸氣，上升遇冷，附著在灰塵等微粒上形成小水滴或冰晶，就是雲。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "雲和霧", "q": "雲和霧最主要的不同是什麼？", "o": ["飄浮的高度位置不同", "組成的物質不同", "顏色不同", "霧是煙、雲是水"], "a": 0, "why": "雲和霧都是水蒸氣遇冷凝結的小水滴；在高空是雲，在地面附近是霧。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "凝結核", "q": "大氣中的塵埃、煙塵等微粒，有助於水蒸氣凝結，叫做什麼？", "o": ["凝結核", "冰晶", "水循環", "鋒面"], "a": 0, "why": "這些微粒稱為凝結核。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "露和霜", "q": "「露」是怎麼形成的？", "o": ["氣溫夠低時，地面附近的水蒸氣附著在物體表面，凝結成小水滴", "雨水留在葉子上", "冰塊融化", "植物流出的汁液"], "a": 0, "why": "當氣溫足夠低時，水蒸氣附著在草木表面凝結成小水滴，就是露。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "露和霜", "q": "「霜」是怎麼形成的？", "o": ["氣溫接近或低於 0°C 時，水蒸氣附著在低於 0°C 的物體表面，直接變成冰晶", "雪融化後再結冰", "露水被曬乾", "冰雹打碎了"], "a": 0, "why": "水蒸氣附著在低於 0°C 的物體表面，直接變成冰晶，就是霜。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "露和霜", "q": "露和霜最主要的不同是什麼？", "o": ["形成的溫度不同", "一個在天上、一個在地上", "一個是水蒸氣、一個是煙", "形成的季節完全相同"], "a": 0, "why": "露和霜都是地面附近的水蒸氣遇冷形成的，只是形成的溫度不同。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "雨雪雹", "q": "雲中的冰晶在落下過程中「沒有融化」，直接掉到地面，是什麼？", "o": ["雪", "雨", "露", "霧"], "a": 0, "why": "冰晶落下時沒有融化，直接掉落地面，就是下雪。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "雨雪雹", "q": "下列哪一個是「下雨」的情形？", "o": ["雲中小水滴直接掉落，或冰晶落下時融化成水", "冰晶落下時沒有融化", "冰粒在雲中被帶回高空", "水蒸氣在草葉上凝結"], "a": 0, "why": "小水滴直接掉落，或冰晶掉落時融化成水，就是下雨。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "雨雪雹", "q": "雹通常在哪一種雲中形成？", "o": ["積雨雲", "卷雲", "層雲", "霧"], "a": 0, "why": "雹通常在積雨雲中形成。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "雨雪雹", "q": "雹為什麼會越來越大？", "o": ["積雨雲內對流旺盛，冰粒被反覆帶往高空，外圍的水再次凝固", "冰粒在地上滾動", "冰粒吸收陽光", "冰粒被風吹散"], "a": 0, "why": "對流旺盛使未融化的冰粒又被帶往高空，外圍的水再凝固，越來越大、過重才掉下來。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "海洋與氣溫", "q": "海洋為什麼可以調節氣溫？", "o": ["海水溫度的變化比陸地小", "海水很鹹", "海很深", "海裡有很多魚"], "a": 0, "why": "海洋吸收大部分太陽輻射、儲存大量熱能，海水溫度變化比陸地小，可以調節氣溫。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "海洋與氣溫", "q": "臺灣附近的黑潮，對周圍地區的溫度有什麼影響？", "o": ["從溫暖的赤道流向北方，使周圍溫度升高", "從北極流來，使溫度降低", "對溫度沒有影響", "讓海水結冰"], "a": 0, "why": "黑潮從溫暖的赤道流向北方，可以升高周圍地區的溫度。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "水循環", "q": "水循環中，水蒸氣除了來自地表水蒸發，還來自哪裡？", "o": ["植物蒸散", "岩石", "月亮", "太陽"], "a": 0, "why": "植物蒸散的水分也是水循環的一部分。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "實驗", "q": "模擬雲霧的實驗中，把點燃的線香伸入瓶中，線香的煙代表什麼？", "o": ["凝結核", "水蒸氣", "冰晶", "雨"], "a": 0, "why": "線香的煙塵是凝結核，幫助水蒸氣凝結。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "實驗", "q": "模擬雲霧的實驗中，在瓶口放冰塊的目的是什麼？", "o": ["使瓶內降溫", "提供凝結核", "把水加熱", "讓瓶子變重"], "a": 0, "why": "冰塊讓瓶內空氣降溫，水蒸氣才會遇冷凝結。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "實驗", "q": "鋼杯裡放水和冰塊，溫度接近但仍高於 0°C，杯子外壁會出現什麼？", "o": ["小水滴（模擬露）", "白色冰晶（模擬霜）", "沒有任何變化", "雪花"], "a": 0, "why": "溫度在 0°C 以上，空氣中的水蒸氣凝結成小水滴，模擬露。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "實驗", "q": "鋼杯裡放水、冰塊和食鹽，溫度降到 0°C 以下，杯子外壁會出現什麼？", "o": ["白色冰晶（模擬霜）", "小水滴（模擬露）", "沒有任何變化", "雨滴"], "a": 0, "why": "溫度低於 0°C，水蒸氣直接變成冰晶，模擬霜。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "充電站：霧的種類", "q": "「輻射霧」通常發生在什麼時候？", "o": ["晴朗無雲、風速較弱的夜晚到清晨", "颱風天", "下大雨的中午", "風很大的白天"], "a": 0, "why": "輻射霧發生在晴朗無雲、風弱的夜晚至清晨，地面溫度較低時。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "充電站：霧的種類", "q": "清晨太陽出來後，輻射霧為什麼會漸漸消散？", "o": ["地面溫度回升，空氣能容納較多水蒸氣", "風把霧吹到海上", "太陽把霧吸上天", "霧變成了雪"], "a": 0, "why": "日出後地面溫度回升，空氣能容納較多水蒸氣，霧就漸漸消散。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "充電站：霧的種類", "q": "「平流霧」是怎麼形成的？", "o": ["暖溼空氣流經較冷的地面或海面，低層空氣遇冷凝結", "晴朗無風的夜晚地面散熱", "冰晶落下時沒有融化", "火山噴出的煙"], "a": 0, "why": "平流霧和空氣的水平流動有關：暖溼空氣流過冷的地面或海面，遇冷凝結。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 1, "u": "充電站：霧的種類", "q": "臺灣西部在冬末春初，常出現哪一種霧？", "o": ["平流霧", "輻射霧", "煙霧", "霾"], "a": 0, "why": "白天暖溼空氣從海面流入，夜晚溫度下降，就形成平流霧。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 2, "u": "陷阱：雲是什麼", "q": "有人說：「天上的雲就是水蒸氣。」這句話對嗎？", "o": ["不對，雲是水蒸氣遇冷凝結成的小水滴或冰晶", "對，雲就是水蒸氣", "不對，雲是煙", "不對，雲是灰塵"], "a": 0, "why": "水蒸氣要遇冷、附著在凝結核上，凝結成小水滴或冰晶，才會形成雲。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 2, "u": "陷阱：三態", "q": "霜和雪是哪一種狀態的水？", "o": ["都是固態", "都是液態", "霜是液態、雪是固態", "都是氣態"], "a": 0, "why": "霜是冰晶，雪是沒融化的冰晶，兩個都是固態。", "trap": {"2": "霜是冰晶，是固態；液態的是「露」。"}},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 2, "u": "陷阱：三態", "q": "露是哪一種狀態的水？", "o": ["液態", "固態", "氣態", "一半固態一半液態"], "a": 0, "why": "露是小水滴，屬於液態。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "u": "融會貫通：推理", "q": "寒流來襲的清晨，高山草葉上結了一層白色冰晶。前一晚到清晨，氣溫最可能是多少？", "o": ["接近或低於 0°C", "約 25°C", "約 15°C", "約 35°C"], "a": 0, "why": "白色冰晶是霜，要在氣溫接近或低於 0°C 時才會形成。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "u": "融會貫通：推理", "q": "冬天清晨，草地上的葉子沾滿透明的小水珠，摸起來不冰硬。這是什麼？", "o": ["露", "霜", "雪", "雹"], "a": 0, "why": "透明的小水滴是液態的露；霜是白色的固態冰晶。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 2, "ext": true, "u": "看圖・實驗", "q": "如圖，三個鋼杯分別裝了不同的東西。過一段時間，哪一杯的外壁會結出「白色冰晶」？", "o": ["甲", "乙", "丙"], "a": 2, "why": "丙杯加了食鹽，溫度降到 0°C 以下，空氣中的水蒸氣直接變成冰晶，模擬霜。", "trap": {"1": "乙杯接近 0°C 但仍在 0°C 以上，外壁出現的是小水滴（露），不是冰晶。"}, "img": "<svg viewBox=\"0 0 560 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"560\" height=\"200\" rx=\"14\" fill=\"#F2F8FF\"/><path d=\"M30 50 L140 50 L130 160 L40 160Z\" fill=\"#DCE3EA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M34 70 L136 70 L128 156 L42 156Z\" fill=\"#BFE0FA\"/><text x=\"85\" y=\"34\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">甲</text><text x=\"85\" y=\"186\" text-anchor=\"middle\" font-size=\"15\" fill=\"#6E6290\">常溫水</text><path d=\"M225 50 L335 50 L325 160 L235 160Z\" fill=\"#DCE3EA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M229 70 L331 70 L323 156 L237 156Z\" fill=\"#BFE0FA\"/><rect x=\"247\" y=\"80\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"277\" y=\"96\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"299\" y=\"78\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"265\" y=\"120\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><text x=\"280\" y=\"34\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">乙</text><text x=\"280\" y=\"186\" text-anchor=\"middle\" font-size=\"15\" fill=\"#6E6290\">水＋冰塊</text><path d=\"M420 50 L530 50 L520 160 L430 160Z\" fill=\"#DCE3EA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M424 70 L526 70 L518 156 L432 156Z\" fill=\"#BFE0FA\"/><rect x=\"442\" y=\"80\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"472\" y=\"96\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\"     {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "看圖・實驗", "q": "乙杯外壁出現的小水滴，是從哪裡來的？", "o": ["空氣中的水蒸氣遇冷凝結", "杯子裡的水滲出來", "冰塊融化濺出來", "鋼杯自己產生的"], "a": 0, "why": "鋼杯是不透水的，外壁的水來自杯子外面的空氣：水蒸氣碰到冰冷的杯壁凝結成小水滴。", "trap": {"1": "鋼杯不會漏水喔！甲杯也有水，外壁卻沒有水滴。"}, "img": "<svg viewBox=\"0 0 560 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"560\" height=\"200\" rx=\"14\" fill=\"#F2F8FF\"/><path d=\"M30 50 L140 50 L130 160 L40 160Z\" fill=\"#DCE3EA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M34 70 L136 70 L128 156 L42 156Z\" fill=\"#BFE0FA\"/><text x=\"85\" y=\"34\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">甲</text><text x=\"85\" y=\"186\" text-anchor=\"middle\" font-size=\"15\" fill=\"#6E6290\">常溫水</text><path d=\"M225 50 L335 50 L325 160 L235 160Z\" fill=\"#DCE3EA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M229 70 L331 70 L323 156 L237 156Z\" fill=\"#BFE0FA\"/><rect x=\"247\" y=\"80\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"277\" y=\"96\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"299\" y=\"78\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"265\" y=\"120\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><text x=\"280\" y=\"34\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#3B3355\">乙</text><text x=\"280\" y=\"186\" text-anchor=\"middle\" font-size=\"15\" fill=\"#6E6290\">水＋冰塊</text><path d=\"M420 50 L530 50 L520 160 L430 160Z\" fill=\"#DCE3EA\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><path d=\"M424 70 L526 70 L518 156 L432 156Z\" fill=\"#BFE0FA\"/><rect x=\"442\" y=\"80\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"1.5\"/><rect x=\"472\" y=\"96\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" s     {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "看圖・水循環", "q": "水循環示意圖中，「A」從海洋往上的是什麼？", "o": ["水蒸氣（氣態）", "雲", "雨", "冰"], "a": 0, "why": "海水受熱蒸發成水蒸氣，往上升。", "img": "<svg viewBox=\"0 0 560 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"560\" height=\"260\" rx=\"14\" fill=\"#EEF7FF\"/><path d=\"M0 200 L260 200 L300 230 L560 230 L560 260 L0 260Z\" fill=\"#9CCBF2\"/><path d=\"M0 200 L260 200 L300 230 L0 260Z\" fill=\"#B9D98A\"/><text x=\"440\" y=\"252\" font-size=\"15\" fill=\"#3B3355\">海洋</text><text x=\"40\" y=\"240\" font-size=\"15\" fill=\"#3B3355\">陸地</text><ellipse cx=\"300\" cy=\"60\" rx=\"90\" ry=\"32\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><ellipse cx=\"250\" cy=\"72\" rx=\"50\" ry=\"24\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><ellipse cx=\"300\" cy=\"62\" rx=\"80\" ry=\"26\" fill=\"#FFFFFF\"/><line x1=\"150\" y1=\"100\" x2=\"142\" y2=\"160\" stroke=\"#3E8FD6\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><line x1=\"175\" y1=\"100\" x2=\"167\" y2=\"160\" stroke=\"#3E8FD6\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><line x1=\"200\" y1=\"100\" x2=\"192\" y2=\"160\" stroke=\"#3E8FD6\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><line x1=\"450\" y1=\"215\" x2=\"413.0\" y2=\"117.8\" stroke=\"#E07A5F\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M410 110 L420.2 119.6 L408.8 123.9Z\" fill=\"#E07A5F\"/><line x1=\"110\" y1=\"195\" x2=\"174.7\" y2=\"116.5\" stroke=\"#E07A5F\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M180 110 L176.7 123.6 L167.3 115.9Z\" fill=\"#E07A5F\"/><path d=\"M80 200 l0 -36 M70 176 q10 -18 20 0\" stroke=\"#4F9A4A\" stroke-width=\"5\" fill=\"#7CC47A\"/><circle cx=\"452\" cy=\"150\" r=\"16\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"452\" y=\"157\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">A</text><circle cx=\"392\" cy=\"52\" r=\"16\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\     {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "看圖・水循環", "q": "水循環示意圖中，「B」是什麼？", "o": ["雲（小水滴或冰晶）", "水蒸氣", "地下水", "霜"], "a": 0, "why": "水蒸氣上升遇冷凝結成小水滴或冰晶，聚集成雲。", "img": "<svg viewBox=\"0 0 560 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"560\" height=\"260\" rx=\"14\" fill=\"#EEF7FF\"/><path d=\"M0 200 L260 200 L300 230 L560 230 L560 260 L0 260Z\" fill=\"#9CCBF2\"/><path d=\"M0 200 L260 200 L300 230 L0 260Z\" fill=\"#B9D98A\"/><text x=\"440\" y=\"252\" font-size=\"15\" fill=\"#3B3355\">海洋</text><text x=\"40\" y=\"240\" font-size=\"15\" fill=\"#3B3355\">陸地</text><ellipse cx=\"300\" cy=\"60\" rx=\"90\" ry=\"32\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><ellipse cx=\"250\" cy=\"72\" rx=\"50\" ry=\"24\" fill=\"#FFFFFF\" stroke=\"#3B3355\" stroke-width=\"2.5\"/><ellipse cx=\"300\" cy=\"62\" rx=\"80\" ry=\"26\" fill=\"#FFFFFF\"/><line x1=\"150\" y1=\"100\" x2=\"142\" y2=\"160\" stroke=\"#3E8FD6\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><line x1=\"175\" y1=\"100\" x2=\"167\" y2=\"160\" stroke=\"#3E8FD6\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><line x1=\"200\" y1=\"100\" x2=\"192\" y2=\"160\" stroke=\"#3E8FD6\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><line x1=\"450\" y1=\"215\" x2=\"413.0\" y2=\"117.8\" stroke=\"#E07A5F\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M410 110 L420.2 119.6 L408.8 123.9Z\" fill=\"#E07A5F\"/><line x1=\"110\" y1=\"195\" x2=\"174.7\" y2=\"116.5\" stroke=\"#E07A5F\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M180 110 L176.7 123.6 L167.3 115.9Z\" fill=\"#E07A5F\"/><path d=\"M80 200 l0 -36 M70 176 q10 -18 20 0\" stroke=\"#4F9A4A\" stroke-width=\"5\" fill=\"#7CC47A\"/><circle cx=\"452\" cy=\"150\" r=\"16\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"452\" y=\"157\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">A</text><circle cx=\"392\" cy=\"52\" r=\"16\" fill=\"#fff\" stroke=\"#3B3355\" stroke-width=\"2\"/><text x=\"392\" y=\"59\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#3B3355\">B</text><text x=\"470\" y=\"125\" font-size=\"13\" fill=\"#6E6290\">蒸發</text><text x=\"190\" y=\"180\" font-size=\"13\" fill=\"#6E6290\">蒸散</text><text x=\"100\" y=\"130\" font-size=\"13\" fill=\"#6E6290\">降水</text></svg>"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "雲和霧都是水蒸氣遇冷凝結形成的小水滴。", "a": 0}, {"s": "下雪是冰晶在掉落的過程中融化成水。", "a": 1, "why": "冰晶落下時「沒有融化」才是雪；融化成水就變成雨了。"}, {"s": "植物蒸散的水分，也是水循環的一部分。", "a": 0}, {"s": "露和霜都是固態的水。", "a": 1, "why": "露是液態的小水滴，霜才是固態的冰晶。"}], "why": "雨和雪的差別：冰晶落下時有沒有融化。露和霜的差別：形成溫度和狀態。", "tf": true},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "海水溫度的變化比陸地大，所以海洋能調節氣溫。", "a": 1, "why": "剛好相反：海水溫度的變化比陸地「小」，才能調節氣溫。"}, {"s": "雹通常是在積雨雲中形成的。", "a": 0}, {"s": "只要空氣中有水蒸氣，不需要降溫，也一定會形成雲。", "a": 1, "why": "水蒸氣要遇冷才會凝結成雲；「一定」是陷阱。"}, {"s": "黑潮從赤道流向北方，可以使周圍地區的溫度升高。", "a": 0}], "why": "看到「一定」「只要」要特別小心；海洋能調節氣溫，是因為海水溫度變化「比較小」。", "tf": true},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "配合題・水的變化", "t": "multi", "q": "請幫每一小題選出正確的代號。", "o": ["甲 雲", "乙 霧", "丙 露", "丁 霜"], "parts": [{"s": "水蒸氣上升到高空，遇冷凝結成小水滴或冰晶", "a": 0}, {"s": "水蒸氣在地面附近遇冷凝結成小水滴，飄浮在空中", "a": 1}, {"s": "水蒸氣附著在草葉上，凝結成小水滴", "a": 2}, {"s": "水蒸氣附著在低於 0°C 的物體表面，直接變成冰晶", "a": 3}], "why": "雲和霧看高度；露和霜看溫度（0°C 以上是露，接近或低於 0°C 是霜）。", "legend": true},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "配合題・降水", "t": "multi", "q": "請幫每一小題選出正確的代號。", "o": ["甲 雨", "乙 雪", "丙 雹"], "parts": [{"s": "冰晶落下時融化成水", "a": 0}, {"s": "冰晶落下時沒有融化，直接掉到地面", "a": 1}, {"s": "冰粒在積雨雲中被反覆帶往高空，越來越大後掉落", "a": 2}, {"s": "雲中的小水滴直接掉落", "a": 0}], "why": "雨：小水滴直接掉，或冰晶融化；雪：冰晶沒融化；雹：積雨雲裡反覆上下、越滾越大。", "legend": true},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "推理", "q": "模擬雲霧的實驗中，如果「沒有」把線香的煙放進瓶子裡，最可能會怎樣？", "o": ["比較不容易看到白色霧氣", "霧氣會更多", "結果完全一樣", "瓶子裡會下雪"], "a": 0, "why": "煙塵是凝結核，有助水蒸氣凝結；沒有凝結核，水蒸氣比較不容易凝結成小水滴。"},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "素養題組", "q": "小芸家附近的霧，是哪一種霧？", "o": ["平流霧", "輻射霧", "煙霧", "霾"], "a": 0, "why": "暖溼空氣從海面水平流到較冷的地方，遇冷凝結，是平流霧。", "ctx": "小芸住在臺灣西部的海邊。<b>冬末春初</b>的白天，溫暖潮溼的空氣從海面吹進來；到了晚上溫度下降，沿海常常起大霧。<br>小宇住在山谷裡。某個<b>晴朗無雲、幾乎沒有風</b>的冬夜，清晨起床時山谷裡一片白霧，<b>太陽出來後</b>霧就慢慢散了。", "keep": true},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "素養題組", "q": "小宇家附近的霧，是哪一種霧？", "o": ["平流霧", "輻射霧", "煙霧", "霾"], "a": 1, "why": "晴朗無雲、風弱的夜晚，地面溫度降低形成的是輻射霧；日出後地面溫度回升，霧就散了。", "ctx": "小芸住在臺灣西部的海邊。<b>冬末春初</b>的白天，溫暖潮溼的空氣從海面吹進來；到了晚上溫度下降，沿海常常起大霧。<br>小宇住在山谷裡。某個<b>晴朗無雲、幾乎沒有風</b>的冬夜，清晨起床時山谷裡一片白霧，<b>太陽出來後</b>霧就慢慢散了。", "keep": true},
    {"l": "第一單元活動一 什麼是天氣變化的主角", "lv": 3, "ext": true, "u": "素養題組", "q": "小宇家的霧在太陽出來後散了，原因是什麼？", "o": ["地面溫度回升，空氣能容納較多水蒸氣", "風把霧吹走", "霧變成了霜", "霧被雲吸上去"], "a": 0, "why": "溫度回升後，空氣能容納較多水蒸氣，小水滴又變回水蒸氣，霧就消散。", "ctx": "小芸住在臺灣西部的海邊。<b>冬末春初</b>的白天，溫暖潮溼的空氣從海面吹進來；到了晚上溫度下降，沿海常常起大霧。<br>小宇住在山谷裡。某個<b>晴朗無雲、幾乎沒有風</b>的冬夜，清晨起床時山谷裡一片白霧，<b>太陽出來後</b>霧就慢慢散了。"},

    {"l": "第一單元活動二 如何預測天氣變化", "lv": 2, "ext": true, "u": "看圖・天氣圖符號", "q": "地面天氣圖上，哪一個是「冷鋒」的符號？", "o": ["<div><svg viewBox=\"0 0 240 90\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"240\" height=\"90\" rx=\"12\" fill=\"#F6F2FF\"/><path d=\"M20 50 L220 50\" stroke=\"#3E6FD6\" stroke-width=\"4\"/><path d=\"M28 50 L40 28 L52 50Z\" fill=\"#3E6FD6\"/><path d=\"M68 50 L80 28 L92 50Z\" fill=\"#3E6FD6\"/><path d=\"M108 50 L120 28 L132 50Z\" fill=\"#3E6FD6\"/><path d=\"M148 50 L160 28 L172 50Z\" fill=\"#3E6FD6\"/><path d=\"M188 50 L200 28 L212 50Z\" fill=\"#3E6FD6\"/></svg></div>", "<div><svg viewBox=\"0 0 240 90\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"240\" height=\"90\" rx=\"12\" fill=\"#F6F2FF\"/><path d=\"M20 50 L220 50\" stroke=\"#E5484D\" stroke-width=\"4\"/><path d=\"M28 50 A12 12 0 0 1 52 50Z\" fill=\"#E5484D\"/><path d=\"M68 50 A12 12 0 0 1 92 50Z\" fill=\"#E5484D\"/><path d=\"M108 50 A12 12 0 0 1 132 50Z\" fill=\"#E5484D\"/><path d=\"M148 50 A12 12 0 0 1 172 50Z\" fill=\"#E5484D\"/><path d=\"M188 50 A12 12 0 0 1 212 50Z\" fill=\"#E5484D\"/></svg></div>", "<div><svg viewBox=\"0 0 240 90\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"240\" height=\"90\" rx=\"12\" fill=\"#F6F2FF\"/><path d=\"M20 50 L220 50\" stroke=\"#8A63D2\" stroke-width=\"4\"/><path d=\"M28 50 L40 28 L52 50Z\" fill=\"#3E6FD6\"/><path d=\"M68 50 A12 12 0 0 0 92 50Z\" fill=\"#E5484D\"/><path d=\"M108 50 L120 28 L132 50Z\" fill=\"#3E6FD6\"/><path d=\"M148 50 A12 12 0 0 0 172 50Z\" fill=\"#E5484D\"/><path d=\"M188 50 L200 28 L212 50Z\" fill=\"#3E6FD6\"/></svg></div>"], "a": 0, "why": "冷鋒是藍色尖三角；暖鋒是紅色半圓；滯留鋒是三角和半圓交錯。", "pic": true},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 2, "ext": true, "u": "看圖・天氣圖符號", "q": "地面天氣圖上，哪一個是「滯留鋒」的符號？", "o": ["<div><svg viewBox=\"0 0 240 90\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"240\" height=\"90\" rx=\"12\" fill=\"#F6F2FF\"/><path d=\"M20 50 L220 50\" stroke=\"#8A63D2\" stroke-width=\"4\"/><path d=\"M28 50 L40 28 L52 50Z\" fill=\"#3E6FD6\"/><path d=\"M68 50 A12 12 0 0 0 92 50Z\" fill=\"#E5484D\"/><path d=\"M108 50 L120 28 L132 50Z\" fill=\"#3E6FD6\"/><path d=\"M148 50 A12 12 0 0 0 172 50Z\" fill=\"#E5484D\"/><path d=\"M188 50 L200 28 L212 50Z\" fill=\"#3E6FD6\"/></svg></div>", "<div><svg viewBox=\"0 0 240 90\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"240\" height=\"90\" rx=\"12\" fill=\"#F6F2FF\"/><path d=\"M20 50 L220 50\" stroke=\"#3E6FD6\" stroke-width=\"4\"/><path d=\"M28 50 L40 28 L52 50Z\" fill=\"#3E6FD6\"/><path d=\"M68 50 L80 28 L92 50Z\" fill=\"#3E6FD6\"/><path d=\"M108 50 L120 28 L132 50Z\" fill=\"#3E6FD6\"/><path d=\"M148 50 L160 28 L172 50Z\" fill=\"#3E6FD6\"/><path d=\"M188 50 L200 28 L212 50Z\" fill=\"#3E6FD6\"/></svg></div>", "<div><svg viewBox=\"0 0 240 90\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"240\" height=\"90\" rx=\"12\" fill=\"#F6F2FF\"/><path d=\"M20 50 L220 50\" stroke=\"#E5484D\" stroke-width=\"4\"/><path d=\"M28 50 A12 12 0 0 1 52 50Z\" fill=\"#E5484D\"/><path d=\"M68 50 A12 12 0 0 1 92 50Z\" fill=\"#E5484D\"/><path d=\"M108 50 A12 12 0 0 1 132 50Z\" fill=\"#E5484D\"/><path d=\"M148 50 A12 12 0 0 1 172 50Z\" fill=\"#E5484D\"/><path d=\"M188 50 A12 12 0 0 1 212 50Z\" fill=\"#E5484D\"/></svg></div>"], "a": 0, "why": "滯留鋒是冷暖氣團勢均力敵，符號是藍三角和紅半圓交錯。梅雨季常看到它。", "pic": true},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 3, "ext": true, "u": "配合題・鋒面", "t": "multi", "q": "請幫每一小題選出正確的代號。", "o": ["甲 冷鋒", "乙 暖鋒", "丙 滯留鋒"], "parts": [{"s": "冷氣團勢力較強，推著暖氣團後退", "a": 0}, {"s": "暖氣團勢力較強，推著冷氣團後退", "a": 1}, {"s": "冷、暖氣團勢均力敵，在原地徘徊", "a": 2}, {"s": "五、六月梅雨季的主角", "a": 2}, {"s": "通過臺灣後，氣溫通常會下降", "a": 0}], "why": "記法：誰比較強，就叫誰的名字；打成平手的是滯留鋒。", "legend": true},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 3, "ext": true, "u": "素養・讀表判斷", "t": "multi", "q": "根據上面的表，判斷每一個颱風的強度。", "o": ["甲 輕度颱風", "乙 中度颱風", "丙 強烈颱風"], "parts": [{"s": "近中心最大平均風速 25 公尺／秒", "a": 0}, {"s": "近中心最大平均風速 32.6 公尺／秒", "a": 0, "why": "32.6 還在輕度的範圍內（17.2～32.6）。"}, {"s": "近中心最大平均風速 32.7 公尺／秒", "a": 1, "why": "32.7 剛好進入中度的範圍。"}, {"s": "近中心最大平均風速 45 公尺／秒", "a": 1}, {"s": "近中心最大平均風速 51.0 公尺／秒", "a": 2}], "why": "讀表時要注意邊界數字：32.6 是輕度、32.7 就是中度；51.0 以上才是強烈。", "legend": true, "ctx": "中央氣象署依照<b>近中心最大平均風速</b>劃分颱風強度：<table><tr><th>強度</th><th>近中心最大平均風速（公尺／秒）</th></tr><tr><td>輕度颱風</td><td>17.2～32.6</td></tr><tr><td>中度颱風</td><td>32.7～50.9</td></tr><tr><td>強烈颱風</td><td>51.0 以上</td></tr></table>"},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 3, "ext": true, "u": "素養題組", "q": "冷鋒通過後，三個地方的平均氣溫有什麼變化？", "o": ["都下降了", "都上升了", "都沒有改變", "有的升、有的降"], "a": 0, "why": "三個地方的氣溫都比前一天低，冷鋒通過後氣溫下降。", "ctx": "冷鋒通過臺灣前後，三個地方的「全日平均氣溫」如下：<table><tr><th>地點</th><th>3 月 3 日（冷鋒接近前）</th><th>3 月 4 日（冷鋒通過後）</th></tr><tr><td>臺北</td><td>23.5°C</td><td>21.1°C</td></tr><tr><td>臺中</td><td>25.1°C</td><td>22.9°C</td></tr><tr><td>宜蘭</td><td>23.7°C</td><td>22.4°C</td></tr></table>"},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 3, "ext": true, "u": "素養題組", "q": "哪一個地方的平均氣溫下降最多？", "o": ["臺北", "臺中", "宜蘭", "三個一樣多"], "a": 0, "why": "臺北 23.5−21.1＝2.4°C；臺中 25.1−22.9＝2.2°C；宜蘭 23.7−22.4＝1.3°C。臺北下降最多。", "trap": {"1": "臺中 3 月 4 日的氣溫最高，但要比較的是「下降多少」：臺中降了 2.2°C，臺北降了 2.4°C。"}, "ctx": "冷鋒通過臺灣前後，三個地方的「全日平均氣溫」如下：<table><tr><th>地點</th><th>3 月 3 日（冷鋒接近前）</th><th>3 月 4 日（冷鋒通過後）</th></tr><tr><td>臺北</td><td>23.5°C</td><td>21.1°C</td></tr><tr><td>臺中</td><td>25.1°C</td><td>22.9°C</td></tr><tr><td>宜蘭</td><td>23.7°C</td><td>22.4°C</td></tr></table>", "keep": true},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 3, "ext": true, "u": "素養題組", "q": "3 月 4 日冷鋒通過時，衛星雲圖上臺灣上空最可能是什麼樣子？", "o": ["雲層變多", "完全沒有雲", "出現颱風眼", "一片藍色海洋"], "a": 0, "why": "冷鋒通過時，臺灣上空雲層分布較多，天氣可能較不穩定。", "ctx": "冷鋒通過臺灣前後，三個地方的「全日平均氣溫」如下：<table><tr><th>地點</th><th>3 月 3 日（冷鋒接近前）</th><th>3 月 4 日（冷鋒通過後）</th></tr><tr><td>臺北</td><td>23.5°C</td><td>21.1°C</td></tr><tr><td>臺中</td><td>25.1°C</td><td>22.9°C</td></tr><tr><td>宜蘭</td><td>23.7°C</td><td>22.4°C</td></tr></table>"},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "衛星雲圖上臺灣上空幾乎沒有雲，天氣可能晴朗。", "a": 0}, {"s": "地面天氣圖上的「L」代表高氣壓中心。", "a": 1, "why": "L 是低氣壓中心，H 才是高氣壓中心。"}, {"s": "冷氣團勢力較強，推動暖氣團後退所形成的鋒面是暖鋒。", "a": 1, "why": "冷氣團比較強，形成的是冷鋒。"}, {"s": "颱風帶來的豐沛雨量，也是臺灣重要的水源之一。", "a": 0}], "why": "H 高、L 低；誰比較強，鋒面就叫誰的名字。", "tf": true},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 2, "ext": true, "u": "是非題組", "t": "multi", "q": "判斷下面的說法，對的選 ⭕，錯的選 ❌。", "o": ["⭕ 對", "❌ 錯"], "parts": [{"s": "颱風眼經過的地方，通常是狂風暴雨最強烈的地方。", "a": 1, "why": "颱風眼經過的區域通常無風、無雨。"}, {"s": "每一個颱風都有明顯的颱風眼。", "a": 1, "why": "不是每個颱風都有明顯的颱風眼。"}, {"s": "梅雨季時，鋒面在原地徘徊，常出現連續或間歇性的雨。", "a": 0}, {"s": "氣團可以依照溫度高低，分成冷氣團和暖氣團。", "a": 0}], "why": "颱風眼「通常無風無雨」，而且不是每個颱風都有。", "tf": true},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 2, "ext": true, "u": "選出錯的", "q": "關於颱風，下列哪一個說法「錯誤」？", "o": ["颱風是一種高氣壓", "颱風通常生成在潮溼、高溫的熱帶海洋上", "颱風在衛星雲圖上像螺旋狀的濃密雲團", "颱風依照近中心最大平均風速分成三種強度"], "a": 0, "why": "颱風是由熱帶性低氣壓發展而來，是低氣壓。"},
    {"l": "第一單元活動二 如何預測天氣變化", "lv": 3, "ext": true, "u": "生活應用", "q": "氣象報告說：「明天有冷鋒通過臺灣。」明天出門最適合準備什麼？", "o": ["外套和雨具", "防曬乳和短袖", "泳衣", "什麼都不用準備"], "a": 0, "why": "冷鋒通過時雲層多、天氣較不穩定，通過後氣溫下降，要帶外套和雨具。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "天氣與氣候", "q": "「天氣」和「氣候」有什麼不同？", "o": ["天氣是短時間的大氣變化；氣候是長時間的平均狀態和趨勢", "天氣是長時間，氣候是短時間", "兩個意思完全一樣", "天氣只講下雨，氣候只講溫度"], "a": 0, "why": "天氣是短時間內大氣變化的情形，氣候是長時間天氣現象的平均狀態和趨勢。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "氣候變遷", "q": "臺灣自西元 1965 年以來，年平均氣溫有什麼趨勢？", "o": ["上升", "下降", "完全不變", "一直維持在 20°C"], "a": 0, "why": "臺灣年平均氣溫有上升的趨勢。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "氣候變遷", "q": "天氣變化太過極端，可能造成哪些災害？", "o": ["淹水或乾旱", "彩虹變多", "月亮變大", "地震"], "a": 0, "why": "天氣現象過於極端，可能造成淹水或乾旱。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "氣候變遷", "q": "下列哪一個是氣候變遷造成的影響？", "o": ["冰河融化消退", "月亮繞地球", "白天和黑夜", "潮汐漲退"], "a": 0, "why": "冰河融化、極端降雨使水庫淤積或淹水、乾旱使水庫乾涸，都是氣候變遷的影響。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "溫室效應", "q": "自西元 1880 年以來，空氣中的二氧化碳濃度有什麼變化？", "o": ["逐漸升高", "逐漸降低", "沒有變化", "先升高後歸零"], "a": 0, "why": "二氧化碳濃度逐漸升高，全球平均氣溫也越來越高。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "溫室效應", "q": "什麼是「溫室效應」？", "o": ["陽光的能量被地球吸收後輻射出去，停留在大氣層內，使地表變暖", "地球離太陽越來越近", "溫室裡種的花長得比較快", "冷氣把熱氣排到戶外"], "a": 0, "why": "能量停留在大氣層內，導致地球表面變暖和，就是溫室效應。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "溫室效應", "q": "下列哪一組都是「溫室氣體」？", "o": ["二氧化碳、甲烷、水蒸氣", "氧氣、氮氣", "氦氣、氖氣", "氫氣、氧氣"], "a": 0, "why": "溫室氣體包括二氧化碳、水蒸氣、甲烷、氧化亞氮和氟氯碳化物等。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "溫室效應", "q": "燃燒化石燃料會產生哪一種溫室氣體？", "o": ["二氧化碳", "氧氣", "氮氣", "氦氣"], "a": 0, "why": "燃燒化石燃料會產生二氧化碳。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "溫室效應", "q": "牛、羊等家畜會排放哪一種溫室氣體？", "o": ["甲烷", "氧氣", "氮氣", "氫氣"], "a": 0, "why": "牛、羊等家畜會排放甲烷。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "碳足跡", "q": "什麼是產品的「碳足跡」？", "o": ["產品從原料、生產、運送、銷售、使用到廢棄回收，產生的溫室氣體排放量總和", "產品用了多少水", "產品的價錢", "走路留下的腳印"], "a": 0, "why": "這個過程中所產生的溫室氣體排放量總和，稱為產品的碳足跡。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "水足跡", "q": "「水足跡」是在衡量什麼？", "o": ["直接和間接的水資源使用量", "溫室氣體的排放量", "海水的深度", "下雨的次數"], "a": 0, "why": "水足跡衡量直接與間接的水資源使用量，包含產品製造、供應過程中需要的水。", "trap": {"1": "溫室氣體的排放量是「碳足跡」。"}},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "碳足跡", "q": "下列哪一個行為可以減少碳足跡？", "o": ["自備環保杯", "使用一次性餐具", "浪費食物", "多吃肉少吃菜"], "a": 0, "why": "自備環保杯、多吃蔬果、選在地當季食材、搭大眾運輸、自備購物袋，都能減少碳足跡。"},
    {"l": "第一單元活動三 氣候正在改變嗎", "lv": 1, "u": "水足跡", "q": "下列哪一個行為可以減少水足跡？", "o": ["使用雨撲滿回收雨水再利用", "水龍頭開到最大", "浪費食物", "洗澡洗很久"], "a": 0, "why": "水龍頭不要開太大、不浪費食物、用雨撲滿回收雨水，都能減少水足跡。"},

,"u":"分離溶質","q":"熬煮甘蔗汁可以得到什麼？","o":["紅糖","食鹽","醋","汽水"],"a":0,"why":"熬煮甘蔗汁使水分慢慢蒸發，冷卻後得到固體的紅糖。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":1,"u":"生活現象","q":"流汗後衣服上留下白色的痕跡，那是什麼？","o":["汗水的水分蒸發後留下的鹽","衣服褪色","灰塵","洗衣粉"],"a":0,"why":"汗水 99% 是水，其餘 1% 是鹽類等物質，水分蒸發後留下鹽的白色痕跡。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":1,"u":"實驗","q":"「物質溶解前後重量」的實驗中，操縱變因是什麼？","o":["食鹽是否溶解在水中","水量","食鹽的重量","使用的電子秤"],"a":0,"why":"改變的條件是食鹽有沒有溶解；水量、食鹽重量、燒杯和秤都要相同。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":1,"u":"實驗","q":"把食鹽水倒入培養皿，放在通風處幾天後，會看到什麼？","o":["底部出現白色顆粒","水變成紅色","什麼都沒有","長出植物"],"a":0,"why":"水分蒸發後，培養皿底部析出白色的食鹽結晶。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":1,"u":"充電站","q":"空氣是氧氣和其他氣體溶解在哪一種氣體裡？","o":["氮氣","二氧化碳","水蒸氣","氫氣"],"a":0,"why":"空氣是氧氣和其他氣體溶解在氮氣裡，溶劑是氣體。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":1,"u":"充電站","q":"不鏽鋼是把碳溶解在什麼裡面的合金？","o":["鐵","水","銅","空氣"],"a":0,"why":"不鏽鋼是將碳溶解在鐵（固體）裡的合金。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":1,"u":"鹽的種類","q":"抽取地下鹽水熬煮得到的鹽，稱為什麼？","o":["井鹽","海鹽","岩鹽","湖鹽"],"a":0,"why":"海鹽來自海水、岩鹽來自地底鹽礦、湖鹽來自鹹水湖、井鹽來自地下鹽水熬煮。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":2,"u":"陷阱：消失","q":"食鹽溶在水裡後看不見了，下面哪一個說法正確？","o":["食鹽還在水裡，只是看不見","食鹽消失了","食鹽變成水了","食鹽跑到空氣中"],"a":0,"why":"物質溶解在水中後，雖然看不見，但它仍然存在於水中。","trap":{"1":"看不見不代表消失，溶解前後總重量不變。"}},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":2,"u":"陷阱：溶劑","q":"「溶劑一定是水」這句話對嗎？","o":["不對，空氣的溶劑是氮氣，不鏽鋼的溶劑是鐵","對，溶劑只能是水","對，因為水溶液的溶劑是水","不對，溶劑一定是固體"],"a":0,"why":"水溶液的溶劑是水；但廣義的溶液，溶劑可以是氣體、液體或固體。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":2,"u":"陷阱：溶解和熔化","q":"下面哪一個是「溶解」？","o":["砂糖放進水裡攪拌後看不見","冰塊在太陽下變成水","蠟燭受熱變成液體","巧克力在手上變軟"],"a":0,"why":"溶解要有溶劑（水），把物質均勻分散；冰塊、蠟燭變成液體是熔化。","trap":{"1":"這是熔化，不需要溶劑。"}},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":2,"u":"陷阱：混合物","q":"麵粉加水攪拌後，靜置一段時間會沉澱。它是水溶液嗎？","o":["不是，水溶液要完全溶解、均勻、靜置不分層","是，因為有水","是，因為是混合物","是，因為攪拌過"],"a":0,"why":"麵粉、泥沙加水會沉澱，不是水溶液。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":2,"u":"陷阱：重量計算","q":"30 克的水加入 6 克砂糖，砂糖只溶解了一部分，杯底還有一些。整杯的總重量是多少？（不算杯子）","o":["36 克","30 克","比 36 克少","比 36 克多"],"a":0,"why":"不論有沒有全部溶解，砂糖都還在杯子裡，總重量 30 + 6 = 36 克。"},{"l":"第二單元活動一 物質溶解後消失了嗎","lv":2,"u":"陷阱：分離","q":"想從糖水中取回糖，下面哪一個方法「不可行」？","o":["用濾紙過濾","加熱讓水蒸發"," ，可以確定它是酸性嗎？","o":["不可以，也可能是中性，要再用藍色石蕊試紙","可以，一定是酸性","可以，一定是中性","不可以，一定是鹼性"],"a":0,"why":"酸性和中性都不會讓紅色試紙變色，要紅、藍兩種一起用。","trap":{"1":"中性也不會讓紅色試紙變色。"}},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":2,"u":"陷阱：試紙顏色","q":"鹼性水溶液會讓「藍色」石蕊試紙怎樣？","o":["不變色","變紅色","變綠色","變紫色"],"a":0,"why":"鹼性只會讓紅色試紙變藍，藍色試紙不變色。","trap":{"1":"讓藍色試紙變紅的是酸性。"}},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":2,"u":"陷阱：兩種指示劑","q":"紫色高麗菜汁遇到中性水溶液是什麼顏色？","o":["紫色","藍色","綠色","紅色"],"a":0,"why":"紫色高麗菜汁：酸性偏紅、中性紫色、鹼性偏藍綠。蝶豆花才是中性藍色。","trap":{"1":"中性呈藍色的是蝶豆花汁，紫色高麗菜汁中性是紫色。"}},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":2,"u":"陷阱：中和過頭","q":"在酸性水溶液中一直加入鹼性水溶液，最後會怎樣？","o":["先接近中性，再繼續加會變成鹼性","永遠是酸性","一定剛好停在中性","會變成更酸"],"a":0,"why":"持續加入鹼性水溶液，會由中性再變成鹼性。"},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":2,"u":"陷阱：水垢","q":"清洗熱水瓶的水垢，為什麼「不能」用小蘇打？","o":["水垢是鹼性，要用酸性的檸檬酸才能中和","小蘇打太貴","小蘇打是酸性","小蘇打會讓水垢變多"],"a":0,"why":"水垢是鹼性物質，要用酸性物質清除。"},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":2,"u":"陷阱：稀釋不是中和","q":"「檸檬汁太酸，加水稀釋」是利用酸鹼中和嗎？","o":["不是，這是稀釋","是，水是鹼性","是，水是酸性","是，加水一定會中和"],"a":0,"why":"加水只是讓濃度變淡，不是酸鹼中和。"},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":2,"u":"陷阱：酸鹼體質","q":"「吃鹼性食物可以改變酸性體質」這句話對嗎？","o":["不對，健康的人血液 pH 值大多維持在 7.4 左右，沒有酸性、鹼性體質之分","對，多吃就會變鹼性","對，蝶豆花可以改變體質","不對，應該吃酸的才對"],"a":0,"why":"現代醫學沒有所謂「酸性體質」或「鹼性體質」之分。"},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":2,"u":"陷阱：反向問法","q":"下面哪一個「不是」石蕊試紙的正確用法？","o":["用手拿試紙比較方便","用鑷子夾取","紅、藍試紙都要用","換不同水溶液要換滴管或洗滴管"],"a":0,"why":"不可用手碰觸，會汙染試紙。"},{"l":"第二單元活動三 水溶液的酸鹼性可以改變嗎","lv":3,"u":"看圖判斷","q":"看圖，哪一杯是酸性？","o":["甲杯","乙杯","丙杯","都不是"],"a":0,"why":"甲杯：紅色試紙不變、藍色試紙變紅，是酸性。乙杯兩種都不變是中性，丙杯紅色變藍是鹼性。","keep":true,"img":"<svg viewBox=\"0 0 470 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><rect width=\"470\" height=\"200\" rx=\"14\" fill=\"#F4FBF8\"/><text x=\"90\" y=\"30\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#2E2445\">甲 杯</text><text x=\"55\" y=\"58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6E6290\">紅色試紙</text><text x=\"125\" y=\"58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6E6290\">藍色試紙</text><rect x=\"38\" y=\"68\" wid }
function animalSVG(sp,furKey,wear,opts={}){

  const c=f[1], L=f[2], x=f[3]||{}, o=lineOf(c);
  wear=wear||{}; const p=speciesParts(sp,c,L,o,x), u=uid();

  const armFill=top?top.sleeve:p.armFill;

    `<defs><clipPath id="${u}c"><ellipse cx="100" cy="178" rx="38" ry="31"/></clipPath><clipPath id="${u}h"><ellipse cx="100" cy="100" rx="${HR}" ry="50"/></clipPath></defs>`,
    opts.bg&&wear.bg&&BGS[wear.bg]?BGS[wear.bg].d():'',
    `<ellipse cx="100" cy="214" rx="${56*s}" ry="7" fill="${OL}" opacity=".12"/>`,
    levelFx(frac,false),
    `<g transform="translate(100 212) scale(${s}) translate(-100 -212)">`,
    wing.d(),
    gear(wear,'back'),
    p.tail,
    mirror(`<ellipse cx="85" cy="206" rx="13" ry="7.5" fill="${p.feet}" ${ol(lineOf(p.feet===c?c:p.feet))}/>`),
    `<ellipse cx="100" cy="178" rx="38" ry="31" fill="${c}" ${ol(o)}/>`,
    p.belly?`<ellipse cx="100" cy="184" rx="22" ry="18" fill="${L}"/>`:'',
    p.bodySpots?`<g clip-path="url(#${u}c)">${[[76,166,6],[124,172,7],[110,196,5],[80,196,4]].map(([a,b,r])=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#4F4A57"/>`).join('')}</g>`:'',
    top?`<g clip-path="url(#${u}c)">${top.top()}</g><ellipse cx="100" cy="178" rx="38" ry="31" fill="none" ${ol(o)}/>`:'',
    p.arms?mirror(`<ellipse cx="65" cy="174" rx="9" ry="13" fill="${armFill}" ${ol(o)} transform="rotate(28 65 174)"/>`):'',
    gear(wear,'neck'),
    p.ruff&&sp==='dog'?p.ruff:'',
    p.ears,
    `<ellipse cx="100" cy="100" rx="${HR}" ry="50" fill="${c}" ${ol(o)}/>`,
    p.headMarks?`<g clip-path="url(#${u}h)">${p.headMarks}</g><ellipse cx="100" cy="100" rx="${HR}" ry="50" fill="none" ${ol(o)}/>`:'',
    p.ruff&&sp==='cat'?p.ruff:'',
    p.top||'',
    p.face,
    eyes(104,p.eye,p.ring), blush(118),
    gear(wear,'back','f'), gear(wear,'face'), gear(wear,'head'), gear(wear,'hand'),
    `</g>`,
    levelFx(frac,true),
  ];
  return SVG(inner.join(''),opts.bg&&wear.bg);
}

async function api(body){
  const r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({key:CFG.key},body))});

async function pushNow(){
  if(!cloudOn()) return;
  try{
    for(const id of [...dirty]){ const k=DB.kids.find(x=>x.id===id); if(k){ const stamp=k.updated; k.synced=stamp; await api({action:'saveKid',kid:k}); } dirty.delete(id); }
    saveLocal();
    if(logQueue.length){ const rows=logQueue.splice(0); try{ await api({action:'log',rows}); }catch(e){ logQueue.unshift(...rows); throw e; } }
    setCloud('ok','已同步到雲端');

async function pullCloud(){
  if(!cloudOn()){ setCloud('off',''); return false; }
  try{
    const r=await fetch(CFG.url+(CFG.url.includes('?')?'&':'?')+'action=load&key='+encodeURIComponent(CFG.key));
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'雲端回應錯誤');
    // 以雲端為主；平板上還沒上傳的新資料保留下來並補傳
    const server=(j.kids||[]).map(fixKid), merged=[];
    server.forEach(sk=>{ const lk=DB.kids.find(x=>x.id===sk.id); if(lk && (lk.updated||0)>(sk.updated||0)){ merged.push(lk); dirty.add(lk.id); } else merged.push(sk); });
    DB.kids.forEach(lk=>{ if(!server.some(x=>x.id===lk.id) && (lk.updated||0)>(lk.synced||0)){ merged.push(lk); dirty.add(lk.id); } });
    DB.kids=merged;
    S=DB.kids.find(k=>k.id===DB.current)||null; if(!S){ DB.current=null; }
    saveLocal(); setCloud('ok','已從雲端載入'); if(dirty.size) pushNow(); return true;
  }catch(e){ setCloud('error','連不上雲端：'+e.message+'（先用平板上的資料）'); return false; }
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function orderBy(list,key){ const missed=shuffle(list.filter(q=>S.missed.includes(key(q)))), fresh=shuffle(list.filter(q=>!S.mastered.includes(key(q))&&!S.missed.includes(key(q)))), done=shuffle(list.filter(q=>S.mastered.includes(key(q)))); return [...missed,...fresh,...done]; }
function startQuiz(subj, onlyQs, lesson, mode){
  const bank=bankOf(S,subj), key=q=>qid(subj,q);
  const qs0 = onlyQs || (()=>{
    if(mode==='ext') return shuffle(orderBy(extOf(S,subj,lesson),key).slice(0,5));
    if(mode==='gift') return shuffle(orderBy(giftOf(S,subj,lesson),key).slice(0,5));
    const all=bank.filter(q=>(!lesson || q.l===lesson) && (mode==='basic'?!q.ext:usable(S,subj,q)));
    const adv=orderBy(all.filter(q=>q.ext||(q.lv||1)>1),key), basic=orderBy(all.filter(q=>!q.ext&&(q.lv||1)===1),key);
    if(!adv.length) return basic.slice(0,5);
    const pickB=basic.slice(0,Math.max(3,5-adv.length)), pickA=adv.slice(0,5-pickB.length);
    return [...shuffle(pickB),...shuffle(pickA)];
  })();
  if(!qs0.length){ toast('這裡還沒有題目'); return; }
  const prep=q=>{ const c={...q, subj:q.subj||subj, order:q.t==='multi'?[]:(q.keep?q.o.map((_,j)=>j):shuffle(q.o.map((_,j)=>j)))};
    if(q.parts){ c.parts=q.parts.map(pt=>{ if(!pt.o||pt.keep) return pt; const ord=shuffle(pt.o.map((_,j)=>j)); return {...pt, o:ord.map(j=>pt.o[j]), a:ord.indexOf(pt.a)}; }); c.mp=c.parts.map(()=>null); }
    return c; };
  quiz={subj, mode, qs:qs0.map(prep), lesson, i:0, results:[], picked:null, earned:0, xp:0, fresh:0, last:null};
  clearInterval(tick); tick=setInterval(()=>{ if(document.visibilityState==='visible'){ S.seconds++; addDaySec(S); if(quiz) quiz.sec=(quiz.sec||0)+1; if(S.seconds%30===0){ save(); checkMedals(); renderTime(); } } },1000);
  tab='learn'; render();
}

const REVIEW_GAP=2, REVIEW_DONE=2;     // 訂正後隔 2 天要複習；隔天以後再答對 2 次＝已熟練

const md=d=>d?d.slice(5).replace('-','/'):'';
function allQs(k){ const out=[]; subjectsOf(k).forEach(s=>bankOf(k,s).forEach(q=>out.push({...q,subj:s,id:qid(s,q)}))); return out; }
function wrongState(k,id){
  const w=k.wrong[id]; if(!w) return null;

}
function wrongList(k,filter){
  return allQs(k).filter(q=>k.wrong[q.id]).map(q=>({...q, w:k.wrong[q.id], st:wrongState(k,q.id)})).filter(x=>!filter||filter(x));
}
function trackWrong(q,id,ok,wasMissed){
  const W=S.wrong; let w=W[id];
  if(!ok){ w=W[id]=w||{n:0,first:today()}; w.n++; w.last=today(); w.fixed=null; w.rv=0; w.lastOk=null; return {}; }
  if(!w) return {};
  if(wasMissed){ w.fixed=today(); w.lastOk=today(); w.rv=0; return {}; }
  const due=dayDiff(w.lastOk||w.fixed||today(), today())>=REVIEW_GAP && (w.rv||0)<REVIEW_DONE;

}

  else if(it.reward){ const m=MEDALS.find(x=>x.reward&&(x.reward.item===it.id||x.reward.item2===it.id)); note='破成就「'+m.name+'」才能得到'; btn=owned?`<button class="btn ghost" data-wear="${it.id}">已擁有・${on?'使用中':'穿上'}</button>`:`<span class="lock">${m.desc}</span>`; }
  else { const c=canBuy(it);
    note=it.season?(seasonOpen(it.season)?'節日期間限定販售':'節日還沒到'):it.medal?'需要勳章：'+MEDALS.find(m=>m.id===it.medal).name:it.medalCount?`需要 ${it.medalCount} 枚勳章`:it.rank?`需要等級「${LEVELS[it.rank].name}」`:'只要金幣就能換';
    btn=owned?`<button class="btn ghost" data-wear="${it.id}">已擁有・${on?'使用中':'穿上'}</button>`:`<button class="btn hot" data-buy="${it.id}" ${c.ok?'':'disabled'}>${it.price} 金幣兌換</button>${c.ok?'':`<span class="lock">${c.why}</span>`}`; }
  return `<div class="item ${on?'on':''}">${tag}<span class="slotname">${SLOT_NAME[it.slot]}</span>${av(previewWear(it))}<h4>${it.name}</h4><small>${note}</small>${btn}</div>`;
}
function bindItems(p){
  p.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{ const it=ITEMS.find(x=>x.id===b.dataset.wear);
    if(it.slot==='bg') S.wear.bg=it.id; else S.wear[it.slot]=S.wear[it.slot]===it.id?null:it.id; save(); render(); poke(document.querySelector('#sideBody .av')); });
  p.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ const it=ITEMS.find(x=>x.id===b.dataset.buy); if(!canBuy(it).ok) return;
    S.coins-=it.price; S.owned.push(it.id); S.wear[it.slot]=it.id; save(); render(); poke(document.querySelector('#sideBody .av')); toast('換到「'+it.name+'」了，已經幫你換上！'); });
}
function renderShop(p){
  const all=ITEMS.filter(it=>it.price>0);
  const seasonal=Object.keys(SEASONS).map(id=>{ const list=all.filter(i=>i.season===id); const open=seasonOpen(id), s=SEASONS[id];
    return [open,`<div class="section-t">${s.name}限定 ${open?`<span class="season">販售中・到 ${s.to[0]}/${s.to[1]}</span>`:`<span class="season off">${s.from[0]}/${s.from[1]} 開放</span>`}</div><div class="grid">${list.map(it=>itemCard(it,'shop')).join('')}</div>`]; }).sort((a,b)=>b[0]-a[0]).map(x=>x[1]).join('');
  p.innerHTML=`<h2>商店</h2><p class="sub">你有 <b>${S.coins}</b> 金幣、<b>${S.medals.length}</b> 枚勳章。節日裝扮只在節日期間販售，買了就能一直穿。</p>
  ${seasonal}
  <div class="section-t">金幣就能換</div><div class="grid">${all.filter(i=>!i.season&&!i.medal&&!i.medalCount&&!i.rank).map(it=>itemCard(it,'shop')).join('')}</div>
  <div class="section-t">勳章、等級限定</div><div class="grid">${all.filter(i=>!i.season&&(i.medal||i.medalCount||i.rank)).map(it=>itemCard(it,'shop')).join('')}</div>
  <div class="section-t">成就特殊道具（買不到，只能破成就）</div><div class="grid">${ITEMS.filter(i=>i.reward).map(it=>itemCard(it,'shop')).join('')}</div>`;
  bindItems(p);
}
function renderMedals(p){
  p.innerHTML=`<h2>勳章牆</h2><p class="sub">已收集 ${S.medals.length} / ${MEDALS.length} 枚。連續練習 ${streak(S)} 天，總共練習 ${S.days.length} 天、${fmtDur(S.seconds)}。</p>
  <div class="medals">${MEDALS.filter(m=>m.id==='life'?subjectsOf(S).includes('life')||S.medals.includes('life'):true).map(m=>`<div class="medal ${S.medals.includes(m.id)?'':'off'}"><span class="m">${m.short}</span><div><h4>${m.name}</h4><p>${m.desc}</p>${m.reward?`<p class="rw">獎勵：${rewardText(m.reward)}</p>`:''}</div></div>`).join('')}</div>
  <div class="section-t">偶像等級</div>
  <div class="levels">${LEVELS.map((lv,i)=>`<div class="lvrow ${i<=levelOf(S)?'done':''}"><b>${lv.name}</b><span>${Object.keys(lv.req).length?Object.entries(lv.req).map(([key,v])=>REQ_LABEL[key](v)).join('・'):'起點'}</span></div>`).join('')}</div>`;
}

/* ================= 開始 ================= */
function boot(){
  render();
  if(cloudOn()){ pullCloud().then(()=>{ if(!S) tab='who'; render(); }); }
}
window.addEventListener('pagehide',()=>{ if(cloudOn()) pushNow(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && cloudOn()) pushNow(); });

boot();
</script>
